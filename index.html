<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner của tôi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;background:#fff0f5;display:flex;flex-direction:column;overflow:hidden}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:980px;margin:0 auto;padding:10px 12px;flex-shrink:0}
nav button{font-family:inherit;font-size:18px;font-weight:700;color:#8c4a69;background:#fff7fa;border:2px solid #ffd6e7;border-radius:999px;padding:3px 10px;cursor:pointer;text-align:center;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
nav button:hover{background:#e6f3fe;border-color:#bfe0fb;transform:translateY(-1px)}
@media(min-width:1500px){nav{grid-template-columns:repeat(8,1fr);max-width:1400px}}
@media(max-width:640px){nav{grid-template-columns:repeat(2,1fr)}nav button{font-size:16px}}
nav button.on{background:linear-gradient(135deg,#ffc2d9,#f48fb1);border-color:#f48fb1;color:#fff}
#navbar{background:#fff;border-bottom:2px solid #ffd6e7;flex-shrink:0}
#tools{display:flex;justify-content:center;gap:8px;padding:0 12px 8px}
#tools button{font-family:inherit;font-size:15px;font-weight:700;color:#3f78a8;background:#eef7ff;border:2px solid #cfe7fb;border-radius:999px;padding:0 14px;cursor:pointer}
#tools button:hover{background:#dff0ff}
#gate,#busy{position:fixed;inset:0;background:#fff0f5;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#gate form{background:#fff;border:2px solid #ffd6e7;border-radius:24px;padding:26px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
#gate h2{color:#8c4a69;font-size:26px}
#gate input{font-family:inherit;font-size:18px;font-weight:700;color:#6b3550;padding:8px 14px;border:2px solid #ffd6e7;border-radius:14px;outline:none}
#gate input:focus{border-color:#f48fb1}
#gate button{font-family:inherit;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ffc2d9,#f48fb1);border:0;border-radius:999px;padding:6px;cursor:pointer}
#gerr{color:#d4537e;font-weight:600;min-height:22px}
#busy{font-size:22px;font-weight:700;color:#8c4a69}
#cloud{display:none;align-items:center;gap:8px}
#st{font-size:14px;font-weight:600;color:#8c6a7c}
main{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff0f5}
iframe.on{display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="navbar"><nav id="nav"></nav><div id="tools"><button id="bk">💾 Sao lưu toàn bộ</button><button id="rs">📂 Khôi phục từ file</button><span id="cloud"><span id="st"></span><button id="sy">☁️ Đồng bộ ngay</button><button id="lo">🚪 Đăng xuất</button></span><input type="file" id="rsf" accept=".json,application/json" hidden></div></div>
<main id="main"></main>
<div id="gate"><form id="gf"><h2>🌸 Đăng nhập</h2><input id="ge" type="email" placeholder="Email" autocomplete="username" required><input id="gp" type="password" placeholder="Mật khẩu" autocomplete="current-password" required><div id="gerr"></div><button type="submit">Đăng nhập</button></form></div>
<div id="busy"></div>
<script>
const PAGES={"planner": "\u003c!DOCTYPE html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Huyền's Planner — Hàng ngày & Nhật ký\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{font-family:'Be Vietnam Pro',sans-serif;background:#fdf4f8;color:#2c2c2a;min-height:100vh;font-size:15px;line-height:1.6}\n:root{\n  --pink:#d4537e;--blue:#185fa5;\n  --green:#3b6d11;--gbd:#c0dd97;\n  --w:#fff;--t:#2c2c2a;--t2:#6b6b68;\n  --r:14px;--rsm:8px;\n  /* section palettes */\n  --s1-bg:#fff0f4;--s1-bd:#f9c6d8;--s1-hd:#fde8ef;--s1-acc:#c94d72;--s1-cb:#e8a0b8;\n  --s2-bg:#fff5f0;--s2-bd:#f4a07a;--s2-hd:#fde8de;--s2-acc:#c45222;--s2-cb:#e88060;\n  --s3-bg:#fdf0f0;--s3-bd:#e07070;--s3-hd:#fad8d8;--s3-acc:#992222;--s3-cb:#c45050;\n}\n#app{max-width:1060px;margin:0 auto;padding:16px 12px 40px}\n\n/* ── HEADER ── */\nheader{text-align:center;padding:28px 20px 22px;background:linear-gradient(135deg,#fbeaf0,#e6f1fb);border-radius:var(--r);margin-bottom:16px;border:1px solid #f4c0d1;position:relative;overflow:hidden}\nheader::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(212,83,126,.07);border-radius:50%}\nheader::after{content:'';position:absolute;bottom:-20px;left:-20px;width:70px;height:70px;background:rgba(24,95,165,.06);border-radius:50%}\nheader h1{font-size:26px;font-weight:600;color:#993556;position:relative}\nheader p{font-size:13px;color:#b06080;margin-top:4px;font-weight:300;position:relative}\n.gift-btn{position:absolute;top:14px;right:14px;background:#fff;border:1px solid #f4c0d1;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:#993556;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;box-shadow:0 2px 8px rgba(212,83,126,.14);transition:transform .15s;z-index:2}\n.gift-btn:hover{transform:translateY(-2px)}\n\n/* ── OVERVIEW ── */\n.overview-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}\n.ov-card{background:var(--w);border-radius:var(--r);border:1px solid #f4c0d1;padding:14px 12px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}\n.ov-card:hover{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 4px 16px rgba(212,83,126,.12)}\n.ov-card.ov-today{border-color:#b5d4f4;background:linear-gradient(135deg,#fff,#f0f6fb)}\n.ov-label{font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}\n.ov-date{font-size:15px;font-weight:600;color:#993556}\n.ov-pct{font-size:12px;color:var(--t2);margin-top:5px}\n.ov-pct span{font-weight:500;color:var(--blue)}\n\n/* ── YEARLY STATS ── */\n.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}\n.stat-card{background:var(--w);border-radius:var(--r);border:1px solid #b5d4f4;padding:14px 12px;text-align:center}\n.stat-card.green-card{border-color:var(--gbd)}\n.stat-label{font-size:10px;color:var(--t2);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}\n.stat-val{font-size:22px;font-weight:600;color:var(--blue)}\n.stat-val.gr{color:var(--green)}\n.stat-sub{font-size:11px;color:var(--t2);margin-top:3px}\n\n/* ── DAY BLOCK ── */\n.days-list{display:flex;flex-direction:column;gap:14px}\n.day-block{background:var(--w);border-radius:var(--r);border:1px solid #f4c0d1;overflow:hidden;transition:box-shadow .2s}\n.day-block:hover{box-shadow:0 2px 12px rgba(212,83,126,.09)}\n.day-block.today-hl{border-color:#85b7eb;box-shadow:0 0 0 2px rgba(21,95,165,.12)}\n.day-header{background:linear-gradient(90deg,#fbeaf0,#edf5fb);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f4c0d1;cursor:pointer;user-select:none;transition:background .15s}\n.day-header:hover{background:linear-gradient(90deg,#f4c0d1,#d4eaf7)}\n.day-block.today-hl .day-header{background:linear-gradient(90deg,#e6f1fb,#d4eaf7);border-bottom-color:#b5d4f4}\n.day-title{font-size:14px;font-weight:600;color:#993556}\n.day-block.today-hl .day-title{color:#185fa5}\n.day-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);background:rgba(255,255,255,.7);border-radius:20px;padding:2px 10px;border:1px solid rgba(212,83,126,.2)}\n.day-badge .bp{font-weight:600;color:#993556}\n.today-badge{font-size:10px;font-weight:600;background:#185fa5;color:#fff;border-radius:20px;padding:2px 8px;margin-left:6px}\n.day-body{display:none;padding:14px;flex-direction:column;gap:14px}\n.day-body.open{display:flex;animation:fi .18s ease}\n@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}\n\n/* ── SECTION WRAPPER ── */\n.section-wrap{border-radius:var(--rsm);overflow:hidden;border-width:1px;border-style:solid}\n.section-wrap.s1{border-color:var(--s1-bd);background:var(--s1-bg)}\n.section-wrap.s2{border-color:var(--s2-bd);background:var(--s2-bg)}\n.section-wrap.s3{border-color:var(--s3-bd);background:var(--s3-bg)}\n\n.section-label{\n  padding:7px 12px;\n  display:flex;align-items:center;gap:8px;\n  font-size:12px;font-weight:600;\n  border-bottom-width:1px;border-bottom-style:solid;\n}\n.s1 .section-label{background:var(--s1-hd);border-color:var(--s1-bd);color:var(--s1-acc)}\n.s2 .section-label{background:var(--s2-hd);border-color:var(--s2-bd);color:var(--s2-acc)}\n.s3 .section-label{background:var(--s3-hd);border-color:var(--s3-bd);color:var(--s3-acc)}\n.section-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}\n.s1 .section-dot{background:var(--s1-acc)}\n.s2 .section-dot{background:var(--s2-acc)}\n.s3 .section-dot{background:var(--s3-acc)}\n.section-sub{font-size:11px;font-weight:400;opacity:.75;margin-left:2px}\n.section-est{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.65);border-radius:20px;padding:2px 10px;white-space:nowrap}\n.section-light{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:4px}\n.section-light.blink{animation:lightBlink 1s ease-in-out infinite}\n@keyframes lightBlink{0%,100%{opacity:1}50%{opacity:.2}}\n.light-green{background:#2ecc71;box-shadow:0 0 5px #2ecc71}\n.light-pink{background:#ff5fa2;box-shadow:0 0 5px #ff5fa2}\n.light-red{background:#e74c3c;box-shadow:0 0 5px #e74c3c}\n\n/* ── TASK TABLE inside each section ── */\n/* cols: task | h | m | s | btns | result */\n.tbl{width:100%}\n.tbl-cols{--ct:1fr;--ch:50px;--cm:50px;--cs:50px;--cb:70px;--cr:1fr}\n.tbl-row,.tbl-thead,.tbl-foot{\n  display:grid;\n  grid-template-columns:var(--ct) var(--ch) var(--cm) var(--cs) var(--cb) var(--cr);\n}\n.tbl-thead{border-bottom:1px solid currentColor;opacity:.9}\n.s1 .tbl-thead{border-color:var(--s1-bd)}\n.s2 .tbl-thead{border-color:var(--s2-bd)}\n.s3 .tbl-thead{border-color:var(--s3-bd)}\n.tbl-row{border-bottom:1px solid;}\n.s1 .tbl-row{border-color:rgba(249,198,216,.5)}\n.s2 .tbl-row{border-color:rgba(244,160,122,.4)}\n.s3 .tbl-row{border-color:rgba(224,112,112,.4)}\n.tbl-row:last-of-type{border-bottom:none}\n.tbl-foot{border-top:1px solid}\n.s1 .tbl-foot{border-color:var(--s1-bd)}\n.s2 .tbl-foot{border-color:var(--s2-bd)}\n.s3 .tbl-foot{border-color:var(--s3-bd)}\n\n.th,.td{padding:5px 8px;display:flex;align-items:center;justify-content:center}\n.th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}\n.s1 .th{color:var(--s1-acc)}\n.s2 .th{color:var(--s2-acc)}\n.s3 .th{color:var(--s3-acc)}\n\n/* task & result cells left-align */\n.th-task,.td-task,.th-res,.td-res{justify-content:flex-start;padding:5px 10px}\n.td-task.done .fi{text-decoration:line-through;opacity:.55}\n\n/* timer column shading — very light tints */\n.s1 .td-h,.s1 .th-h{background:rgba(249,198,216,.18);border-left:1px solid rgba(249,198,216,.6)}\n.s1 .td-m,.s1 .th-m{background:rgba(249,198,216,.12)}\n.s1 .td-s,.s1 .th-s{background:rgba(249,198,216,.07)}\n.s1 .td-btn,.s1 .th-btn{background:rgba(249,198,216,.22);border-right:1px solid rgba(249,198,216,.6)}\n\n.s2 .td-h,.s2 .th-h{background:rgba(244,160,122,.18);border-left:1px solid rgba(244,160,122,.5)}\n.s2 .td-m,.s2 .th-m{background:rgba(244,160,122,.12)}\n.s2 .td-s,.s2 .th-s{background:rgba(244,160,122,.07)}\n.s2 .td-btn,.s2 .th-btn{background:rgba(244,160,122,.22);border-right:1px solid rgba(244,160,122,.5)}\n\n.s3 .td-h,.s3 .th-h{background:rgba(224,112,112,.18);border-left:1px solid rgba(224,112,112,.5)}\n.s3 .td-m,.s3 .th-m{background:rgba(224,112,112,.12)}\n.s3 .td-s,.s3 .th-s{background:rgba(224,112,112,.07)}\n.s3 .td-btn,.s3 .th-btn{background:rgba(224,112,112,.22);border-right:1px solid rgba(224,112,112,.5)}\n\n.td-btn{gap:4px}\n\n/* timer display inside cells */\n.hms{width:100%;border:none;border-radius:5px;padding:3px 2px;font-size:13px;font-weight:600;font-family:'Be Vietnam Pro',sans-serif;font-variant-numeric:tabular-nums;text-align:center;background:transparent;outline:none}\n.hms::-webkit-outer-spin-button,.hms::-webkit-inner-spin-button{-webkit-appearance:none}\n.hms{-moz-appearance:textfield}\n.hms:focus{background:rgba(255,255,255,.7)}\n.s1 .hms{color:var(--s1-acc)}\n.s2 .hms{color:var(--s2-acc)}\n.s3 .hms{color:var(--s3-acc)}\n.td-h.running,.td-m.running,.td-s.running{animation:blink 1.4s ease-in-out infinite}\n@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}\n\n/* timer buttons */\n.tbtn{width:21px;height:21px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:transform .12s,filter .15s}\n.tbtn:hover{transform:scale(1.12);filter:brightness(1.1)}\n.s1 .tbtn.ts{background:#f9c6d8;color:var(--s1-acc)}\n.s1 .tbtn.tp{background:#fad4c8;color:#8b3010}\n.s2 .tbtn.ts{background:#f4c09a;color:var(--s2-acc)}\n.s2 .tbtn.tp{background:#f4b0a0;color:#8b2010}\n.s3 .tbtn.ts{background:#e8a0a0;color:var(--s3-acc)}\n.s3 .tbtn.tp{background:#e09090;color:#6b1010}\n.tbtn.tr2{background:#ddd;color:#555}\n\n/* text inputs */\n.fi{border:1px solid;border-radius:var(--rsm);padding:4px 8px;font-size:13px;font-family:'Be Vietnam Pro',sans-serif;background:var(--w);color:var(--t);outline:none;width:100%;transition:box-shadow .15s}\n.s1 .fi{border-color:var(--s1-bd)}\n.s2 .fi{border-color:var(--s2-bd)}\n.s3 .fi{border-color:var(--s3-bd)}\n.s1 .fi:focus{box-shadow:0 0 0 2px rgba(201,77,114,.14)}\n.s2 .fi:focus{box-shadow:0 0 0 2px rgba(196,82,34,.14)}\n.s3 .fi:focus{box-shadow:0 0 0 2px rgba(153,34,34,.14)}\n.fi::placeholder{color:#c0b0b8}\n.td-res .fi{background:#f8fbff}\n\ninput[type=checkbox]{width:14px;height:14px;flex-shrink:0;cursor:pointer;margin-right:7px}\n.s1 input[type=checkbox]{accent-color:var(--s1-acc)}\n.s2 input[type=checkbox]{accent-color:var(--s2-acc)}\n.s3 input[type=checkbox]{accent-color:var(--s3-acc)}\n\n/* add row button */\n.add-row-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:'Be Vietnam Pro',sans-serif;background:none;border:1px dashed;border-radius:var(--rsm);padding:3px 10px;cursor:pointer;font-weight:500;transition:background .15s,opacity .15s}\n.add-row-btn:hover{opacity:.8}\n.s1 .add-row-btn{color:var(--s1-acc);border-color:var(--s1-bd)}\n.s1 .add-row-btn:hover{background:rgba(249,198,216,.25)}\n.s2 .add-row-btn{color:var(--s2-acc);border-color:var(--s2-bd)}\n.s2 .add-row-btn:hover{background:rgba(244,160,122,.2)}\n.s3 .add-row-btn{color:var(--s3-acc);border-color:var(--s3-bd)}\n.s3 .add-row-btn:hover{background:rgba(224,112,112,.18)}\n\n/* ── DAILY SUMMARY ── */\n.day-summary{background:linear-gradient(135deg,#fbeaf0,#e6f1fb);border:1px solid #f4c0d1;border-radius:var(--rsm);padding:12px 16px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}\n.sum-item{display:flex;flex-direction:column;align-items:center;gap:3px}\n.sum-label{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;text-align:center}\n.sum-val{font-size:20px;font-weight:600;color:#993556;text-align:center}\n.sum-val.gr{color:var(--green)}\n.sum-sub{font-size:11px;color:var(--t2);text-align:center}\n.score-wrap{display:flex;align-items:center;gap:6px;margin-top:2px}\n.score-input{border:1px solid #b5d4f4;border-radius:var(--rsm);padding:3px 6px;font-size:18px;font-family:'Be Vietnam Pro',sans-serif;font-weight:600;width:62px;text-align:center;color:#185fa5;background:var(--w);outline:none}\n.score-input:focus{box-shadow:0 0 0 2px rgba(55,138,221,.1)}\n\n.note-label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}\n.day-note{width:100%;border:1px solid #f4c0d1;border-radius:var(--rsm);padding:8px 12px;font-size:13px;font-family:'Be Vietnam Pro',sans-serif;color:var(--t);background:#fdf4f8;resize:vertical;min-height:52px;outline:none;transition:border-color .15s}\n.day-note:focus{border-color:var(--pink);box-shadow:0 0 0 2px rgba(212,83,126,.1)}\n.day-note::placeholder{color:#c0b0b8}\n\n@media(max-width:700px){\n  .overview-row{grid-template-columns:1fr}\n  .stats-row{grid-template-columns:repeat(2,1fr)}\n  .tbl-cols{--ch:40px;--cm:40px;--cs:40px;--cb:60px}\n  .day-summary{grid-template-columns:repeat(3,1fr)}\n  header h1{font-size:20px}\n  header p{padding-right:70px}\n  #app{padding:10px 8px 40px}\n  .gift-btn{top:10px;right:10px;padding:5px 10px;font-size:12px}\n}\n@media(max-width:480px){\n  .tbl-cols{--ch:34px;--cm:34px;--cs:34px;--cb:52px}\n  .stats-row{grid-template-columns:1fr 1fr}\n  .day-summary{grid-template-columns:repeat(2,1fr)}\n}\n\n\n/* ── TAB NAV (merged site) ── */\n.tabnav{\n  max-width:1200px;margin:0 auto 18px;\n  display:flex;gap:10px;\n  padding:8px;\n  background:#fff;\n  border:1px solid #f4c0d1;\n  border-radius:16px;\n  box-shadow:0 2px 10px rgba(212,83,126,.08);\n  position:sticky;top:10px;z-index:500;\n}\n.tab-btn{\n  flex:1;\n  display:flex;align-items:center;justify-content:center;gap:6px;\n  padding:12px 14px;\n  border:none;border-radius:12px;\n  background:transparent;color:#993556;\n  font-family:'Be Vietnam Pro','Segoe UI',sans-serif;\n  font-size:15px;font-weight:600;\n  cursor:pointer;\n  transition:background .15s,color .15s,transform .12s;\n  margin:0;\n}\n.tab-btn:hover{background:#fbeaf0;transform:translateY(-1px)}\n.tab-btn.active{background:linear-gradient(135deg,#f4a3bf,#d4537e);color:#fff;box-shadow:0 3px 10px rgba(212,83,126,.28)}\n.tab-page{display:none}\n.tab-page.active{display:block}\n@media(max-width:600px){\n  .tabnav{border-radius:14px;top:6px}\n  .tab-btn{font-size:13px;padding:10px 8px}\n}\n\n\n/* ── Hàng ngày (đã đổi màu pastel hồng cho đồng bộ giao diện, giữ nguyên bố cục) ── */\n#page-hangngay, #page-hangngay * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n#page-hangngay {\n            background-color: #fdf4f8;\n            font-family: 'Be Vietnam Pro', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            color: #2c2c2a;\n            padding: 20px;\n            line-height: 1.6;\n        }\n#page-hangngay .quote {\n            text-align: center;\n            font-size: 24px;\n            color: #f4c0d1;\n            margin-bottom: 30px;\n            font-weight: bold;\n            font-style: italic;\n        }\n#page-hangngay .container {\n            max-width: 1200px;\n            margin: 0 auto;\n        }\n#page-hangngay .section {\n            border: 1px solid #f4c0d1;\n            margin-bottom: 20px;\n            padding: 20px;\n            border-radius: 8px;\n        }\n#page-hangngay .section-title {\n            color: #f4c0d1;\n            font-size: 20px;\n            font-weight: bold;\n            margin-bottom: 15px;\n            text-align: center;\n        }\n#page-hangngay .timer-grid {\n            display: grid;\n            grid-template-columns: repeat(2, 1fr);\n            gap: 15px;\n            margin: 20px 0;\n        }\n#page-hangngay .timer-box {\n            background-color: #FFFAFA;\n            border: 1px solid #f4c0d1;\n            border-radius: 12px;\n            padding: 20px 15px;\n            text-align: center;\n            box-shadow: 0 2px 4px rgba(255, 182, 193, 0.1);\n            transition: transform 0.2s ease, box-shadow 0.2s ease;\n        }\n#page-hangngay .timer-box:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 4px 8px rgba(255, 182, 193, 0.2);\n        }\n#page-hangngay .timer-label {\n            font-size: 13px;\n            color: #993556;\n            font-weight: 600;\n            margin-bottom: 8px;\n            line-height: 1.3;\n        }\n#page-hangngay .timer-value {\n            font-weight: bold;\n            font-size: 24px;\n            color: #d4537e;\n            line-height: 1.2;\n        }\n#page-hangngay .timer-unit {\n            font-size: 14px;\n            color: #993556;\n            margin-top: 4px;\n        }\n#page-hangngay .wasted-time-section {\n            margin: 25px 0;\n        }\n#page-hangngay .wasted-time-grid {\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 15px;\n            margin-bottom: 15px;\n        }\n#page-hangngay .countdown-quote {\n            text-align: center;\n            font-size: 18px;\n            color: #f4c0d1;\n            margin: 20px 0;\n            font-style: italic;\n        }\n#page-hangngay .wasted-time {\n            font-size: 20px;\n            font-weight: bold;\n            padding: 15px;\n            border-radius: 5px;\n            margin: 10px 0;\n        }\n#page-hangngay .red-angry { background-color: #ffebee; color: red; }\n#page-hangngay .blue-motivational { background-color: #e3f2fd; color: darkblue; }\n#page-hangngay .pink-proud { background-color: #fce4ec; color: #993556; font-weight: bold; }\n#page-hangngay .green-excellent { background-color: #e8f5e8; color: green; }\n#page-hangngay button {\n            background-color: #f4c0d1;\n            color: black;\n            border: none;\n            padding: 10px 20px;\n            margin: 5px;\n            border-radius: 5px;\n            cursor: pointer;\n            font-size: 16px;\n        }\n#page-hangngay button:hover {\n            background-color: #f9dce6;\n        }\n#page-hangngay button:active {\n            background-color: #e8a0b8;\n        }\n#page-hangngay .grid-1col {\n            display: grid;\n            grid-template-columns: 1fr;\n            gap: 20px;\n        }\n#page-hangngay .todo-section {\n            min-height: 400px;\n        }\n#page-hangngay .todo-item {\n            display: grid;\n            grid-template-columns: auto 1fr auto auto;\n            gap: 12px;\n            align-items: center;\n            margin: 12px 0;\n            padding: 12px 15px;\n            background-color: #FFF0F5;\n            border-radius: 8px;\n            border: 1px solid #FFE4E1;\n        }\n#page-hangngay .todo-item input[type=\"text\"] {\n            padding: 8px 12px;\n            border: 1px solid #f4c0d1;\n            border-radius: 6px;\n            font-size: 14px;\n            min-width: 250px;\n        }\n#page-hangngay .todo-timer {\n            font-size: 14px;\n            color: #993556;\n            margin-left: 10px;\n            font-weight: bold;\n        }\n#page-hangngay .todo-part {\n            margin-bottom: 25px;\n        }\n#page-hangngay .todo-part-title {\n            font-size: 16px;\n            font-weight: bold;\n            color: #993556;\n            margin-bottom: 10px;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            gap: 10px;\n        }\n#page-hangngay .todo-task {\n            background-color: #FFF0F5;\n            border: 1px solid #FFE4E1;\n            border-radius: 8px;\n            padding: 12px 15px;\n            margin: 12px 0;\n        }\n#page-hangngay .todo-task-header {\n            display: grid;\n            grid-template-columns: auto 1fr auto auto;\n            gap: 12px;\n            align-items: center;\n            margin-bottom: 10px;\n        }\n#page-hangngay .todo-task-header input[type=\"checkbox\"] {\n            transform: scale(1.3);\n        }\n#page-hangngay .todo-task-header input[type=\"text\"] {\n            padding: 8px 12px;\n            border: 1px solid #f4c0d1;\n            border-radius: 6px;\n            font-size: 14px;\n        }\n#page-hangngay .todo-task-timer {\n            font-size: 14px;\n            color: #d4537e;\n            font-weight: bold;\n            white-space: nowrap;\n        }\n#page-hangngay .todo-task-delete {\n            padding: 4px 10px;\n            margin: 0;\n            font-size: 14px;\n        }\n#page-hangngay .todo-rows {\n            display: grid;\n            grid-template-columns: 1fr;\n            gap: 8px;\n        }\n#page-hangngay .todo-row {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            background-color: white;\n            border: 1px solid #FFE4E1;\n            border-radius: 6px;\n            padding: 6px 10px;\n        }\n#page-hangngay .todo-row input[type=\"checkbox\"] {\n            transform: scale(1.2);\n            flex-shrink: 0;\n        }\n#page-hangngay .todo-row-text {\n            flex: 1;\n            min-width: 0;\n            padding: 6px 8px;\n            border: 1px solid #FFE4E1;\n            border-radius: 4px;\n            font-size: 13px;\n        }\n#page-hangngay .todo-row-timer {\n            font-size: 13px;\n            color: #d4537e;\n            font-weight: bold;\n            white-space: nowrap;\n            flex-shrink: 0;\n        }\n#page-hangngay .notes-section {\n            margin-top: 30px;\n            padding: 20px;\n            background-color: #FFFAFA;\n            border-radius: 12px;\n            border: 1px solid #f4c0d1;\n        }\n#page-hangngay .notes-input-container {\n            display: grid;\n            grid-template-columns: auto 1fr auto;\n            gap: 15px;\n            align-items: center;\n        }\n#page-hangngay .notes-select {\n            padding: 8px 12px;\n            border: 1px solid #f4c0d1;\n            border-radius: 6px;\n            background-color: white;\n            color: #993556;\n            font-weight: bold;\n        }\n#page-hangngay .notes-input {\n            padding: 8px 12px;\n            border: 1px solid #f4c0d1;\n            border-radius: 6px;\n            font-size: 14px;\n            width: 100%;\n        }\n#page-hangngay .todo-item input[type=\"number\"] {\n            width: 80px;\n            margin-right: 10px;\n            padding: 5px;\n            border: 1px solid #f4c0d1;\n            border-radius: 3px;\n        }\n#page-hangngay .grid-3col {\n            display: grid;\n            grid-template-columns: 1fr 1fr 1fr;\n            gap: 20px;\n        }\n#page-hangngay .chart-container {\n            border: 1px solid #f4c0d1;\n            margin: 15px 0;\n            padding: 10px 15px 10px;\n            border-radius: 8px;\n            background-color: #FFFAFA;\n        }\n#page-hangngay .chart-container canvas {\n            display: block;\n            width: 100% !important;\n        }\n#page-hangngay .chart-title {\n            font-weight: bold;\n            color: #993556;\n            margin-bottom: 10px;\n            text-align: center;\n        }\n#page-hangngay .emotion-buttons {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 10px;\n            margin: 10px 0;\n        }\n#page-hangngay .emotion-btn {\n            background-color: white;\n            border: 2px solid #f4c0d1;\n            color: black;\n        }\n#page-hangngay .emotion-btn.selected {\n            background-color: #f4c0d1;\n        }\n#page-hangngay .audio-section {\n            text-align: center;\n        }\n#page-hangngay #audioUpload {\n            margin: 10px;\n        }\n#page-hangngay .grid-2col {\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 20px;\n        }\n@media (max-width: 1024px) {\n#page-hangngay .grid-3col {\n                grid-template-columns: 1fr 1fr;\n            }\n#page-hangngay .timer-grid {\n                grid-template-columns: 1fr;\n            }\n}\n\n@media (max-width: 768px) {\n#page-hangngay .grid-2col, #page-hangngay .grid-3col, #page-hangngay .grid-1col {\n                grid-template-columns: 1fr;\n            }\n#page-hangngay .timer-grid {\n                grid-template-columns: 1fr;\n            }\n#page-hangngay .wasted-time-grid {\n                grid-template-columns: 1fr;\n            }\n#page-hangngay .notes-input-container {\n                grid-template-columns: 1fr;\n            }\n}\n\n\u003c/style>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap\" rel=\"stylesheet\">\u003cstyle>.tabnav{display:none!important}\u003c/style>\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"tabnav\">\n  \u003cbutton class=\"tab-btn active\" data-tab=\"hangngay\">📅 Hàng ngày\u003c/button>\n  \u003cbutton class=\"tab-btn\" data-tab=\"nhatky\">📔 Nhật ký\u003c/button>\n\u003c/div>\n\n\u003cdiv id=\"page-hangngay\" class=\"tab-page active\">\n\n    \u003cdiv class=\"container\">\n        \u003cdiv class=\"section notes-section\">\n            \u003cdiv class=\"section-title\">📝 Ghi chú nhanh\u003c/div>\n            \u003cdiv class=\"notes-input-container\">\n                \u003cselect id=\"noteCategory\" class=\"notes-select\">\n                    \u003coption value=\"Công việc\">Công việc\u003c/option>\n                    \u003coption value=\"Ý tưởng\">Ý tưởng\u003c/option>\n                    \u003coption value=\"Tình yêu\">Tình yêu\u003c/option>\n                    \u003coption value=\"Sức khỏe\">Sức khỏe\u003c/option>\n                    \u003coption value=\"Suy nghĩ linh tinh\">Suy nghĩ linh tinh\u003c/option>\n                \u003c/select>\n                \u003cinput type=\"text\" id=\"noteInput\" class=\"notes-input\" placeholder=\"Ghi lại suy nghĩ của bạn...\" onkeypress=\"handleNoteKeyPress(event)\">\n                \u003cbutton onclick=\"downloadNotesExcel()\">📥 Tải Excel\u003c/button>\n                \u003cbutton onclick=\"importNotesCSV()\">📤 Nhập CSV\u003c/button>\u003cinput type=\"file\" id=\"notesCsvIn\" accept=\".csv,text/csv\" hidden onchange=\"handleNotesCSV(this)\">\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"quote\">\"Sống trọn từng khoảnh khắc, đừng lãng phí tuổi trẻ.\"\u003c/div>\n        \n        \u003cdiv class=\"section\">\n            \u003cdiv class=\"section-title\">⏰ Countdown Timer - Time is running out\u003c/div>\n            \u003cdiv class=\"countdown-quote\">\"Làm việc chăm chỉ từng giờ từng phút, cuối cùng bạn sẽ không hối hận.\"\u003c/div>\n            \n            \u003cdiv class=\"timer-grid\">\n                \u003cdiv class=\"timer-box\">\n                    \u003cdiv class=\"timer-label\">Số giây còn lại ngày hôm nay\u003c/div>\n                    \u003cdiv class=\"timer-value\" id=\"secondsLeft\">0\u003c/div>\n                    \u003cdiv class=\"timer-unit\">giây\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"timer-box\">\n                    \u003cdiv class=\"timer-label\">Số phút còn lại ngày hôm nay\u003c/div>\n                    \u003cdiv class=\"timer-value\" id=\"minutesLeft\">0\u003c/div>\n                    \u003cdiv class=\"timer-unit\">phút\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"timer-box\">\n                    \u003cdiv class=\"timer-label\">Ngày & giờ hiện tại\u003c/div>\n                    \u003cdiv class=\"timer-value\" id=\"currentDateTime\" style=\"font-size: 16px;\">\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"timer-box\">\n                    \u003cdiv class=\"timer-label\">Số ngày còn lại tới hết năm\u003c/div>\n                    \u003cdiv class=\"timer-value\" id=\"daysLeftYear\">0\u003c/div>\n                    \u003cdiv class=\"timer-unit\">ngày\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"timer-box\">\n                    \u003cdiv class=\"timer-label\">Bạn đã lãng phí bao nhiêu thời gian năm 2025\u003c/div>\n                    \u003cdiv class=\"timer-value\" id=\"yearWastePercent\">0\u003c/div>\n                    \u003cdiv class=\"timer-unit\">%\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"timer-box\">\n                    \u003cdiv class=\"timer-label\">Giờ lãng phí đến cuối năm\u003c/div>\n                    \u003cdiv class=\"timer-value\" id=\"hoursToEndYear\">0\u003c/div>\n                    \u003cdiv class=\"timer-unit\">giờ\u003c/div>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cdiv class=\"wasted-time-section\">\n                \u003cdiv class=\"wasted-time-grid\">\n                    \u003cdiv class=\"timer-box\">\n                        \u003cdiv class=\"timer-label\">Số giây bạn đã lãng phí\u003c/div>\n                        \u003cdiv class=\"timer-value\" id=\"wastedSeconds\">0\u003c/div>\n                        \u003cdiv class=\"timer-unit\">giây\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"timer-box\">\n                        \u003cdiv class=\"timer-label\">Tỷ lệ lãng phí\u003c/div>\n                        \u003cdiv class=\"timer-value\" id=\"wastePercentage\">0\u003c/div>\n                        \u003cdiv class=\"timer-unit\">%\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n                \n                \u003cdiv id=\"wastedTimeDisplay\" class=\"wasted-time\">\n                    \u003cdiv id=\"motivationalMessage\">\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"grid-1col\">\n            \u003cdiv class=\"section\">\n                \u003cdiv class=\"section-title\">📚 Study Timer\u003c/div>\n                \u003cdiv class=\"timer-grid\" style=\"grid-template-columns: 1fr 1fr;\">\n                    \u003cdiv class=\"timer-box\">\n                        \u003cdiv class=\"timer-label\">Thời gian học hôm nay\u003c/div>\n                        \u003cdiv class=\"timer-value\" id=\"studyTime\" style=\"font-size: 18px;\">00:00:00\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"timer-box\">\n                        \u003cdiv class=\"timer-label\">Phiên học hiện tại\u003c/div>\n                        \u003cdiv class=\"timer-value\" id=\"currentSession\" style=\"font-size: 18px;\">00:00:00\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n                \u003cdiv style=\"text-align: center; margin-top: 15px;\">\n                    \u003cbutton id=\"startStudy\" onclick=\"startStudy()\">Bắt đầu học\u003c/button>\n                    \u003cbutton id=\"stopStudy\" onclick=\"stopStudy()\">Dừng học\u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"section todo-section\">\n                \u003cdiv class=\"section-title\">📋 To-do List\u003c/div>\n                \u003cdiv style=\"text-align: center; margin-bottom: 20px;\">\n                    \u003cstrong>Hoàn thành hôm nay: \u003cspan id=\"completionRate\">0/0\u003c/span> (\u003cspan id=\"completionPercent\">0\u003c/span>%)\u003c/strong>\n                \u003c/div>\n\n                \u003cdiv class=\"todo-part\">\n                    \u003cdiv class=\"todo-part-title\">🕐 Nhiệm vụ 30 phút\u003c/div>\n                    \u003cdiv id=\"todoList30\">\u003c/div>\n                    \u003cdiv style=\"text-align: center;\">\n                        \u003cbutton onclick=\"addTodoTask(30)\">+ Thêm nhiệm vụ 30p\u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"todo-part\">\n                    \u003cdiv class=\"todo-part-title\">🕐 Nhiệm vụ 1 tiếng\u003c/div>\n                    \u003cdiv id=\"todoList60\">\u003c/div>\n                    \u003cdiv style=\"text-align: center;\">\n                        \u003cbutton onclick=\"addTodoTask(60)\">+ Thêm nhiệm vụ 1 tiếng\u003c/button>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"section\">\n                \u003cdiv class=\"section-title\">😊 Cảm xúc hôm nay\u003c/div>\n                \u003cdiv style=\"margin-bottom: 20px; text-align: center; color: #993556;\">\n                    \u003cstrong>Hôm nay bạn cảm thấy thế nào? (chọn tối đa 2 cảm xúc)\u003c/strong>\n                \u003c/div>\n                \u003cdiv class=\"emotion-buttons\" style=\"justify-content: center;\">\n                    \u003cbutton class=\"emotion-btn\" onclick=\"selectEmotion('Happy')\">😊 Happy\u003c/button>\n                    \u003cbutton class=\"emotion-btn\" onclick=\"selectEmotion('Normal')\">😐 Normal\u003c/button>\n                    \u003cbutton class=\"emotion-btn\" onclick=\"selectEmotion('Bored')\">😑 Bored\u003c/button>\n                    \u003cbutton class=\"emotion-btn\" onclick=\"selectEmotion('Sad')\">😢 Sad\u003c/button>\n                    \u003cbutton class=\"emotion-btn\" onclick=\"selectEmotion('Angry')\">😠 Angry\u003c/button>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"grid-2col\">\n            \u003cdiv class=\"section\">\n                \u003cdiv class=\"section-title\">📊 Biểu đồ hoàn thành nhiệm vụ (30 ngày)\u003c/div>\n                \u003cdiv class=\"chart-container\">\n                    \u003cdiv class=\"chart-title\">Tỷ lệ hoàn thành nhiệm vụ (%)\u003c/div>\n                    \u003ccanvas id=\"todoChart\">\u003c/canvas>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"section\">\n                \u003cdiv class=\"section-title\">💭 Biểu đồ cảm xúc (30 ngày)\u003c/div>\n                \u003cdiv class=\"chart-container\">\n                    \u003cdiv class=\"chart-title\">Cảm xúc theo ngày\u003c/div>\n                    \u003ccanvas id=\"emotionChart\">\u003c/canvas>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"section\">\n            \u003cdiv class=\"section-title\">🎵 Audio Motivation\u003c/div>\n            \u003cdiv class=\"audio-section\">\n                \u003cinput type=\"file\" id=\"audioUpload\" accept=\"audio/*\" onchange=\"uploadAudio()\">\n                \u003cbutton onclick=\"toggleAudio()\">Phát/Tạm dừng nhạc\u003c/button>\n        \t\u003cbutton onclick=\"resetAudio()\">❌ Xóa nhạc cũ\u003c/button>\n                \u003caudio id=\"motivationAudio\" loop>\u003c/audio>\n            \u003c/div>\n        \u003c/div>\n\n    \u003c/div>\n\n    \n\u003c/div>\n\n\u003cdiv id=\"page-nhatky\" class=\"tab-page\">\n\n\u003cdiv id=\"app\">\n  \u003cheader>\n    \u003cbutton class=\"gift-btn\" id=\"giftBtn\">🎁 Gift\u003c/button>\n    \u003ch1>Nhật kí 2026 của Huyền\u003c/h1>\n    \u003cp>Mỗi ngày là một trang mới ✦\u003c/p>\n  \u003c/header>\n\n  \u003cdiv class=\"overview-row\" id=\"ovRow\">\u003c/div>\n\n  \u003cdiv class=\"stats-row\">\n    \u003cdiv class=\"stat-card\">\n      \u003cdiv class=\"stat-label\">TB hoàn thành / ngày\u003c/div>\n      \u003cdiv class=\"stat-val\" id=\"statPct\">—\u003c/div>\n      \u003cdiv class=\"stat-sub\" id=\"statPctSub\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stat-card\">\n      \u003cdiv class=\"stat-label\">TB điểm cả năm\u003c/div>\n      \u003cdiv class=\"stat-val\" id=\"statScore\">—\u003c/div>\n      \u003cdiv class=\"stat-sub\" id=\"statScoreSub\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stat-card green-card\">\n      \u003cdiv class=\"stat-label\">Tổng giờ học cả năm\u003c/div>\n      \u003cdiv class=\"stat-val gr\" id=\"statHours\">—\u003c/div>\n      \u003cdiv class=\"stat-sub\" id=\"statHoursSub\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stat-card green-card\">\n      \u003cdiv class=\"stat-label\">Ngày đã ghi nhật kí\u003c/div>\n      \u003cdiv class=\"stat-val gr\" id=\"statDays\">—\u003c/div>\n      \u003cdiv class=\"stat-sub\" id=\"statDaysSub\">/ 365 ngày\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"stats-row\" style=\"grid-template-columns:repeat(2,1fr)\">\n    \u003cdiv class=\"stat-card green-card\">\n      \u003cdiv class=\"stat-label\">💰 Tổng tiết kiệm cả năm\u003c/div>\n      \u003cdiv class=\"stat-val gr\" id=\"statGiftEarn\">—\u003c/div>\n      \u003cdiv class=\"stat-sub\" id=\"statGiftEarnSub\">Tính từ 11/10/2026\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stat-card\">\n      \u003cdiv class=\"stat-label\">📉 Tổng bị trừ cả năm\u003c/div>\n      \u003cdiv class=\"stat-val\" id=\"statGiftPenalty\" style=\"color:#c0392b\">—\u003c/div>\n      \u003cdiv class=\"stat-sub\" id=\"statGiftPenaltySub\">Tính từ 11/10/2026\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"days-list\" id=\"daysList\">\u003c/div>\n\u003c/div>\n\n\n\u003c/div>\n\n\u003cscript>\n\n        // ── Kho lưu trữ dùng IndexedDB (dung lượng lớn hơn nhiều so với localStorage),\n        // có giao diện giống localStorage để không phải sửa lại toàn bộ code cũ.\n        const HNG_DB_NAME='HangNgayDB', HNG_STORE='kv';\n        let HNG_CACHE={};\n        let HNG_READY=false;\n        function hngOpenDB(){\n            return new Promise((resolve,reject)=>{\n                const req=indexedDB.open(HNG_DB_NAME,1);\n                req.onupgradeneeded=e=>{\n                    const db=e.target.result;\n                    if(!db.objectStoreNames.contains(HNG_STORE))db.createObjectStore(HNG_STORE);\n                };\n                req.onsuccess=e=>resolve(e.target.result);\n                req.onerror=e=>reject(e.target.error);\n            });\n        }\n        function hngGetAll(){\n            return hngOpenDB().then(db=>new Promise((resolve,reject)=>{\n                const tx=db.transaction(HNG_STORE,'readonly');\n                const store=tx.objectStore(HNG_STORE);\n                const out={};\n                const cReq=store.openCursor();\n                cReq.onsuccess=e=>{\n                    const cursor=e.target.result;\n                    if(cursor){out[cursor.key]=cursor.value;cursor.continue();}\n                    else resolve(out);\n                };\n                cReq.onerror=e=>reject(e.target.error);\n            }));\n        }\n        function hngPutRaw(key,value){\n            return hngOpenDB().then(db=>new Promise((resolve,reject)=>{\n                const tx=db.transaction(HNG_STORE,'readwrite');\n                tx.objectStore(HNG_STORE).put(value,key);\n                tx.oncomplete=()=>resolve(true);\n                tx.onerror=e=>reject(e.target.error);\n            }));\n        }\n        function hngDeleteRaw(key){\n            return hngOpenDB().then(db=>new Promise((resolve,reject)=>{\n                const tx=db.transaction(HNG_STORE,'readwrite');\n                tx.objectStore(HNG_STORE).delete(key);\n                tx.oncomplete=()=>resolve(true);\n                tx.onerror=e=>reject(e.target.error);\n            }));\n        }\n        let __hngSaveErrShown=false;\n        async function hngPreload(){\n            try{\n                HNG_CACHE=await hngGetAll();\n                if(Object.keys(HNG_CACHE).length===0){\n                    /* IndexedDB rỗng -> chuyển toàn bộ dữ liệu cũ từ localStorage sang */\n                    let migrated=0;\n                    for(let i=0;i\u003clocalStorage.length;i++){\n                        const k=localStorage.key(i);\n                        const v=localStorage.getItem(k);\n                        HNG_CACHE[k]=v;\n                        try{ await hngPutRaw(k,v); migrated++; }\n                        catch(e){ console.error('Lỗi chuyển dữ liệu cũ cho key '+k,e); }\n                    }\n                    if(migrated)console.log('Đã chuyển '+migrated+' mục từ localStorage sang IndexedDB.');\n                }\n            }catch(e){\n                console.error('Lỗi tải dữ liệu:',e);\n                alert('⚠️ Không tải được dữ liệu đã lưu: '+e.message);\n            }\n            HNG_READY=true;\n        }\n        const HNG={\n            getItem(key){ const v=HNG_CACHE[key]; return v===undefined?null:v; },\n            setItem(key,value){\n                HNG_CACHE[key]=value;\n                hngPutRaw(key,value).catch(e=>{\n                    console.error('Lưu thất bại cho key \"'+key+'\":',e);\n                    if(!__hngSaveErrShown){\n                        __hngSaveErrShown=true;\n                        alert('⚠️ KHÔNG LƯU ĐƯỢC dữ liệu!\\n\\nLỗi: '+e.name+' - '+e.message+'\\n\\nBộ nhớ trình duyệt có thể đã đầy hoặc bị chặn.');\n                    }\n                });\n            },\n            removeItem(key){\n                delete HNG_CACHE[key];\n                hngDeleteRaw(key).catch(e=>console.error('Xoá thất bại cho key \"'+key+'\":',e));\n            }\n        };\n\n        // Safe localStorage setter: báo lỗi rõ ràng nếu lưu thất bại (vd. hết quota),\n        // thay vì âm thầm mất dữ liệu.\n        function safeSetItem(key, value) {\n            HNG.setItem(key, value);\n            return true;\n        }\n\n        // Global variables\n        let studyStartTime = null;\n        let dailyStudyTime = 0;\n        let currentSessionTime = 0;\n        let wastedTimeStart = null;\n        let selectedEmotions = [];\n        let isAudioPlaying = false;\n        let motivationAudio = null;\n        let todoTasks = { 30: [], 60: [] }; // Each task: {text, completed, elapsedSeconds, rows:[{completed}]}\n        let todoRowIntervals = {}; // key `${type}-${taskIdx}-${rowIdx}` -> {interval, remaining}\n        let todoTaskIntervals = {}; // key `${type}-${taskIdx}` -> interval id (elapsed count-up)\n        let isStudying = false; // Track if any studying is happening\n\n        // Initialize on page load\n        document.addEventListener('DOMContentLoaded', async function() {\n            await hngPreload();\n            loadData();\n            initializePage();\n            updateTimers();\n            setInterval(updateTimers, 1000);\n            \n            // Auto-play audio if waste ratio > 87%\n            checkAutoPlayAudio();\n            \n            // Click anywhere to play audio\n            document.addEventListener('click', function() {\n                if (motivationAudio && !isAudioPlaying) {\n                    motivationAudio.play().catch(e => console.log('Audio play failed:', e));\n                    isAudioPlaying = true;\n                }\n            });\n        });\n\n        function initializePage() {\n            loadTodoTasks();\n            renderTodoTasks(30);\n            renderTodoTasks(60);\n            resumeTodoRowTimers();\n            updateCompletionRate();\n            // Slight delay to ensure containers are laid out before measuring\n            setTimeout(() => {\n                drawTodoChart();\n                drawEmotionChart();\n            }, 50);\n            loadSelectedEmotions();\n        }\n        \n        window.addEventListener('resize', () => {\n            drawTodoChart();\n            drawEmotionChart();\n        });\n\n        // Tự kiểm tra khi sang ngày mới (không cần load lại trang) để reset\n        // \"Thời gian học hôm nay\" và \"tỷ lệ lãng phí\" về 0.\n        let __currentDayStr = new Date().toDateString();\n        function checkDayRollover() {\n            const nowStr = new Date().toDateString();\n            if (nowStr === __currentDayStr) return;\n            __currentDayStr = nowStr;\n\n            // Nếu đang học dở lúc giao ngày thì cộng nốt phần giây đó vào rồi mới reset\n            if (studyStartTime) {\n                dailyStudyTime += Math.floor((Date.now() - studyStartTime) / 1000);\n            }\n\n            dailyStudyTime = 0;\n            wastedTimeStart = null;\n            studyStartTime = null;\n            isStudying = false;\n            currentSessionTime = 0;\n            document.getElementById('startStudy').disabled = false;\n            document.getElementById('stopStudy').disabled = true;\n\n            saveData(); // chỉ lưu 1 lần duy nhất để tránh ghi đè lộn xộn trong IndexedDB\n        }\n\n        function updateTimers() {\n            checkDayRollover();\n            const now = new Date();\n            \n            // Current date time\n            document.getElementById('currentDateTime').textContent = now.toLocaleString('vi-VN');\n            \n            // Seconds and minutes left today\n            const endOfDay = new Date(now);\n            endOfDay.setHours(23, 59, 59, 999);\n            const secondsLeft = Math.floor((endOfDay - now) / 1000);\n            const minutesLeft = Math.floor(secondsLeft / 60);\n            \n            document.getElementById('secondsLeft').textContent = secondsLeft.toLocaleString();\n            document.getElementById('minutesLeft').textContent = minutesLeft.toLocaleString();\n            \n            // Days left in year\n            const endOfYear = new Date(now.getFullYear(), 11, 31, 23, 59, 59);\n            const daysLeft = Math.ceil((endOfYear - now) / (1000 * 60 * 60 * 24));\n            document.getElementById('daysLeftYear').textContent = daysLeft;\n            \n            // Year waste percentage\n            const startOfYear = new Date(now.getFullYear(), 0, 1);\n            const yearProgress = (now - startOfYear) / (endOfYear - startOfYear + 24 * 60 * 60 * 1000);\n            document.getElementById('yearWastePercent').textContent = (yearProgress * 100).toFixed(1);\n            \n            // Hours to end of year\n            const hoursToEnd = Math.floor((endOfYear - now) / (1000 * 60 * 60));\n            document.getElementById('hoursToEndYear').textContent = hoursToEnd.toLocaleString();\n            \n            // Update wasted time\n            updateWastedTime();\n            \n            // Update study timers\n            updateStudyTimers();\n        }\n\n        function updateWastedTime() {\n            if (!wastedTimeStart && !isStudying) {\n                const today = new Date();\n                today.setHours(0, 0, 0, 0);\n                wastedTimeStart = today.getTime();\n                saveData();\n            }\n            \n            const now = Date.now();\n            const todayStart = new Date();\n            todayStart.setHours(0, 0, 0, 0);\n            \n            const totalSecondsToday = Math.floor((now - todayStart.getTime()) / 1000);\n            const studiedSecondsToday = dailyStudyTime;\n            \n            // Only count wasted time when not studying\n            let wastedSeconds;\n            if (isStudying) {\n                // If currently studying, don't add more wasted time\n                wastedSeconds = totalSecondsToday - studiedSecondsToday - Math.floor((now - studyStartTime) / 1000);\n            } else {\n                wastedSeconds = totalSecondsToday - studiedSecondsToday;\n            }\n            \n            const wastePercentage = totalSecondsToday > 0 ? (wastedSeconds / totalSecondsToday * 100) : 0;\n            \n            document.getElementById('wastedSeconds').textContent = Math.max(0, wastedSeconds).toLocaleString();\n            document.getElementById('wastePercentage').textContent = wastePercentage.toFixed(1);\n            \n            updateMotivationalMessage(wastePercentage);\n            \n            // Auto-play audio if waste > 87%\n            if (wastePercentage > 87 && motivationAudio && !isAudioPlaying && !isStudying) {\n                motivationAudio.play().catch(e => console.log('Auto-play failed:', e));\n                isAudioPlaying = true;\n            }\n        }\n\n        function updateMotivationalMessage(percentage) {\n            const messageDiv = document.getElementById('motivationalMessage');\n            const displayDiv = document.getElementById('wastedTimeDisplay');\n            \n            displayDiv.className = 'wasted-time';\n            \n            if (percentage > 87.5) {\n                displayDiv.classList.add('purple-angry');\n                messageDiv.textContent = \"Cố lên 1 chút nữa thôi là Huyền giàu và sống hạnh phúc rồi\";\n            } else if (percentage > 75) {\n                displayDiv.classList.add('blue-motivational');\n                messageDiv.textContent = \"Cố lên làm tốt lắm, chăm chỉ hơn một chút xíu nữa thôi là có thể có tiền đi du lịch, làm đẹp rồi.\";\n            } else if (percentage > 50) {\n                displayDiv.classList.add('pink-proud');\n                messageDiv.textContent = \"T rất tự hào về m Huyền ơi. Bà chủ tương lai tài sản trăm tỷ, đi chơi du lịch ăn uống tẹt ga không cần nhìn giá đang chờ Huyền.\";\n            } else {\n                displayDiv.classList.add('green-excellent');\n                messageDiv.textContent = \"Quá tuyệt vời, quá chăm chỉ, nhưng nhớ giữ gìn sức khỏe, tập thể dục đừng làm nhiều quá nha Huyền ơi.\";\n            }\n        }\n\n        function startStudy() {\n            if (!studyStartTime) {\n                studyStartTime = Date.now();\n                isStudying = true;\n                wastedTimeStart = null; // Stop counting wasted time\n                document.getElementById('startStudy').disabled = true;\n                document.getElementById('stopStudy').disabled = false;\n                \n                // Stop audio when studying starts\n                if (motivationAudio && isAudioPlaying) {\n                    motivationAudio.pause();\n                    isAudioPlaying = false;\n                }\n            }\n        }\n\n        function stopStudy() {\n            if (studyStartTime) {\n                const sessionTime = Math.floor((Date.now() - studyStartTime) / 1000);\n                dailyStudyTime += sessionTime;\n                studyStartTime = null;\n                isStudying = false;\n                currentSessionTime = 0;\n                \n                document.getElementById('startStudy').disabled = false;\n                document.getElementById('stopStudy').disabled = true;\n                \n                // Resume wasted time counting\n                wastedTimeStart = Date.now();\n                \n                saveData();\n            }\n        }\n\n        function updateStudyTimers() {\n            // Update daily study time display\n            const hours = Math.floor(dailyStudyTime / 3600);\n            const minutes = Math.floor((dailyStudyTime % 3600) / 60);\n            const seconds = dailyStudyTime % 60;\n            document.getElementById('studyTime').textContent = \n                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n            \n            // Update current session\n            if (studyStartTime) {\n                const sessionTime = Math.floor((Date.now() - studyStartTime) / 1000);\n                const sHours = Math.floor(sessionTime / 3600);\n                const sMinutes = Math.floor((sessionTime % 3600) / 60);\n                const sSecs = sessionTime % 60;\n                document.getElementById('currentSession').textContent = \n                    `${sHours.toString().padStart(2, '0')}:${sMinutes.toString().padStart(2, '0')}:${sSecs.toString().padStart(2, '0')}`;\n            } else {\n                document.getElementById('currentSession').textContent = '00:00:00';\n            }\n        }\n\n        function makeEmptyTask() {\n            return {\n                text: '',\n                completed: false,\n                elapsedSeconds: 0,\n                rows: Array.from({ length: 6 }, () => ({ completed: false, text: '', startedAt: null }))\n            };\n        }\n\n        function loadTodoTasks() {\n            todoTasks[30] = JSON.parse(HNG.getItem('todoTasks30') || '[]');\n            todoTasks[60] = JSON.parse(HNG.getItem('todoTasks60') || '[]');\n        }\n\n        function saveTodoTasksToStorage() {\n            safeSetItem('todoTasks30', JSON.stringify(todoTasks[30]));\n            safeSetItem('todoTasks60', JSON.stringify(todoTasks[60]));\n        }\n\n        function addTodoTask(type) {\n            todoTasks[type].push(makeEmptyTask());\n            saveTodoTasksToStorage();\n            renderTodoTasks(type);\n            updateCompletionRate();\n        }\n\n        function deleteTodoTask(type, taskIdx) {\n            stopTodoTaskElapsed(type, taskIdx);\n            const rowKeyPrefix = `${type}-${taskIdx}-`;\n            Object.keys(todoRowIntervals).forEach(key => {\n                if (key.startsWith(rowKeyPrefix)) {\n                    clearInterval(todoRowIntervals[key].interval);\n                    delete todoRowIntervals[key];\n                }\n            });\n            todoTasks[type].splice(taskIdx, 1);\n            saveTodoTasksToStorage();\n            renderTodoTasks(type);\n            updateCompletionRate();\n            saveTodoHistory();\n        }\n\n        function updateTodoTaskText(type, taskIdx, text) {\n            todoTasks[type][taskIdx].text = text;\n            saveTodoTasksToStorage();\n        }\n\n        function formatMMSS(totalSeconds) {\n            const m = Math.floor(totalSeconds / 60);\n            const s = totalSeconds % 60;\n            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;\n        }\n\n        function renderTodoTasks(type) {\n            const container = document.getElementById(`todoList${type}`);\n            container.innerHTML = '';\n\n            todoTasks[type].forEach((task, taskIdx) => {\n                const taskEl = document.createElement('div');\n                taskEl.className = 'todo-task';\n\n                const rowsHtml = task.rows.map((row, rowIdx) => {\n                    const timerId = `rowTimer-${type}-${taskIdx}-${rowIdx}`;\n                    const timerText = row.completed ? 'Xong' : formatMMSS(getRowRemaining(type, taskIdx, rowIdx));\n                    return `\n                        \u003cdiv class=\"todo-row\">\n                            \u003cinput type=\"checkbox\" ${row.completed ? 'checked' : ''} ${row.completed ? 'disabled' : ''}\n                                onchange=\"checkTodoRow(${type}, ${taskIdx}, ${rowIdx})\">\n                            \u003cinput type=\"text\" class=\"todo-row-text\" placeholder=\"Nội dung dòng ${rowIdx + 1}...\" value=\"${row.text}\"\n                                ${(row.completed) ? 'disabled' : ''}\n                                onchange=\"updateTodoRowText(${type}, ${taskIdx}, ${rowIdx}, this.value)\">\n                            \u003cspan class=\"todo-row-timer\" id=\"${timerId}\">${timerText}\u003c/span>\n                        \u003c/div>\n                    `;\n                }).join('');\n\n                taskEl.innerHTML = `\n                    \u003cdiv class=\"todo-task-header\">\n                        \u003cinput type=\"checkbox\" ${task.completed ? 'checked' : ''} disabled>\n                        \u003cinput type=\"text\" placeholder=\"Nhiệm vụ ${type === 30 ? '30 phút' : '1 tiếng'}...\" value=\"${task.text}\"\n                            onchange=\"updateTodoTaskText(${type}, ${taskIdx}, this.value)\">\n                        \u003cspan class=\"todo-task-timer\" id=\"taskTimer-${type}-${taskIdx}\">${formatMMSS(task.elapsedSeconds)}\u003c/span>\n                        \u003cbutton class=\"todo-task-delete\" onclick=\"deleteTodoTask(${type}, ${taskIdx})\">×\u003c/button>\n                    \u003c/div>\n                    \u003cdiv class=\"todo-rows\">${rowsHtml}\u003c/div>\n                `;\n                container.appendChild(taskEl);\n            });\n        }\n\n        function updateTodoRowText(type, taskIdx, rowIdx, text) {\n            todoTasks[type][taskIdx].rows[rowIdx].text = text;\n            saveTodoTasksToStorage();\n        }\n\n        function checkTodoRow(type, taskIdx, rowIdx) {            const task = todoTasks[type][taskIdx];\n            const row = task.rows[rowIdx];\n            if (row.completed) return;\n\n            // Starting this row also starts the main study timer and this task's elapsed counter\n            startStudy();\n            startTodoTaskElapsed(type, taskIdx);\n            startTodoRowCountdown(type, taskIdx, rowIdx);\n        }\n\n        function getRowDurationSeconds(type) {\n            return (type === 30 ? 5 : 10) * 60;\n        }\n\n        // Remaining seconds for a row, computed from its persisted start timestamp\n        // so it stays correct even after a page reload.\n        function getRowRemaining(type, taskIdx, rowIdx) {\n            const task = todoTasks[type][taskIdx];\n            const row = task && task.rows[rowIdx];\n            const duration = getRowDurationSeconds(type);\n            if (!row || !row.startedAt) return duration;\n            const elapsed = Math.floor((Date.now() - row.startedAt) / 1000);\n            return Math.max(0, duration - elapsed);\n        }\n\n        function startTodoRowCountdown(type, taskIdx, rowIdx) {\n            const key = `${type}-${taskIdx}-${rowIdx}`;\n            if (todoRowIntervals[key]) return;\n\n            const task = todoTasks[type][taskIdx];\n            const row = task.rows[rowIdx];\n            if (row.completed) return;\n\n            // Only set a fresh start time the first time this row is started;\n            // if it already has one (e.g. resumed after a reload), keep it.\n            if (!row.startedAt) {\n                row.startedAt = Date.now();\n                saveTodoTasksToStorage();\n            }\n\n            todoRowIntervals[key] = {\n                interval: setInterval(() => updateTodoRowCountdown(type, taskIdx, rowIdx), 1000)\n            };\n            updateTodoRowDisplay(type, taskIdx, rowIdx);\n        }\n\n        function updateTodoRowCountdown(type, taskIdx, rowIdx) {\n            const key = `${type}-${taskIdx}-${rowIdx}`;\n            const timer = todoRowIntervals[key];\n            if (!timer) return;\n\n            const remaining = getRowRemaining(type, taskIdx, rowIdx);\n            if (remaining \u003c= 0) {\n                clearInterval(timer.interval);\n                delete todoRowIntervals[key];\n                completeTodoRow(type, taskIdx, rowIdx);\n            } else {\n                updateTodoRowDisplay(type, taskIdx, rowIdx);\n            }\n        }\n\n        function updateTodoRowDisplay(type, taskIdx, rowIdx) {\n            const el = document.getElementById(`rowTimer-${type}-${taskIdx}-${rowIdx}`);\n            if (el) el.textContent = formatMMSS(getRowRemaining(type, taskIdx, rowIdx));\n        }\n\n        // Called once on page load: any row that was already counting down\n        // (has a startedAt and isn't completed yet) picks up right where it\n        // left off instead of restarting from the full 5/10 minutes.\n        function resumeTodoRowTimers() {\n            [30, 60].forEach(type => {\n                todoTasks[type].forEach((task, taskIdx) => {\n                    task.rows.forEach((row, rowIdx) => {\n                        if (row.completed || !row.startedAt) return;\n                        if (getRowRemaining(type, taskIdx, rowIdx) \u003c= 0) {\n                            completeTodoRow(type, taskIdx, rowIdx);\n                        } else {\n                            startTodoTaskElapsed(type, taskIdx);\n                            startTodoRowCountdown(type, taskIdx, rowIdx);\n                        }\n                    });\n                });\n            });\n        }\n\n        function completeTodoRow(type, taskIdx, rowIdx) {\n            const task = todoTasks[type][taskIdx];\n            task.rows[rowIdx].completed = true;\n\n            const allRowsDone = task.rows.every(r => r.completed);\n            if (allRowsDone) {\n                // All 6 rows checked (in any order) -> auto-complete the 30p/1-tiếng task\n                task.completed = true;\n                stopTodoTaskElapsed(type, taskIdx);\n            }\n            // Dòng kế tiếp KHÔNG tự động đếm ngược nữa -> phải tự tick mới bắt đầu.\n            renderTodoTasks(type);\n\n            saveTodoTasksToStorage();\n            updateCompletionRate();\n            saveTodoHistory();\n        }\n\n        function startTodoTaskElapsed(type, taskIdx) {\n            const key = `${type}-${taskIdx}`;\n            if (todoTaskIntervals[key]) return;\n            todoTaskIntervals[key] = setInterval(() => {\n                const task = todoTasks[type][taskIdx];\n                if (!task || task.completed) {\n                    stopTodoTaskElapsed(type, taskIdx);\n                    return;\n                }\n                task.elapsedSeconds++;\n                const el = document.getElementById(`taskTimer-${type}-${taskIdx}`);\n                if (el) el.textContent = formatMMSS(task.elapsedSeconds);\n            }, 1000);\n        }\n\n        function stopTodoTaskElapsed(type, taskIdx) {\n            const key = `${type}-${taskIdx}`;\n            if (todoTaskIntervals[key]) {\n                clearInterval(todoTaskIntervals[key]);\n                delete todoTaskIntervals[key];\n            }\n        }\n        \n        function handleNoteKeyPress(event) {\n            if (event.key === 'Enter') {\n                saveNote();\n            }\n        }\n        \n        function saveNote() {\n            const category = document.getElementById('noteCategory').value;\n            const noteText = document.getElementById('noteInput').value.trim();\n            \n            if (noteText) {\n                const now = new Date();\n                const note = {\n                    category: category,\n                    text: noteText,\n                    date: now.toLocaleDateString('vi-VN'),\n                    time: now.toLocaleTimeString('vi-VN'),\n                    timestamp: now.toISOString()\n                };\n                \n                const notes = JSON.parse(HNG.getItem('notes') || '[]');\n                notes.push(note);\n                safeSetItem('notes', JSON.stringify(notes));\n                \n                document.getElementById('noteInput').value = '';\n            }\n        }\n        \n                function parseCSV(t) {\n            t = t.replace(/^\\uFEFF/, ''); const rows = []; let row = [], f = '', q = false;\n            for (let i = 0; i \u003c t.length; i++) {\n                const c = t[i];\n                if (q) { if (c === '\"') { if (t[i + 1] === '\"') { f += '\"'; i++; } else q = false; } else f += c; }\n                else if (c === '\"') q = true;\n                else if (c === ',') { row.push(f); f = ''; }\n                else if (c === '\\n' || c === '\\r') { if (c === '\\r' && t[i + 1] === '\\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }\n                else f += c;\n            }\n            if (f !== '' || row.length) { row.push(f); rows.push(row); }\n            return rows;\n        }\n        function csvToNotes(text) {\n            const rows = parseCSV(text); rows.shift();\n            const parseDT = (d, t) => { const m = (d || '').match(/^(\\d+)\\/(\\d+)\\/(\\d+)$/), n = (t || '').match(/^(\\d+):(\\d+):(\\d+)$/); return m && n ? new Date(+m[3], +m[2] - 1, +m[1], +n[1], +n[2], +n[3]) : null; };\n            return rows.filter(r => r.length >= 4 && (r[1] || '').trim()).map(r => {\n                const dt = parseDT(r[2], r[3]);\n                let ts = r[4] || ''; if (!/^\\d{4}-\\d\\d-\\d\\dT/.test(ts)) ts = dt ? dt.toISOString() : new Date().toISOString();\n                return { category: r[0], text: r[1], date: r[2], time: r[3], timestamp: ts };\n            });\n        }\n        function importNotesCSV() { document.getElementById('notesCsvIn').click(); }\n        async function handleNotesCSV(input) {\n            const file = input.files[0]; input.value = ''; if (!file) return;\n            try {\n                const incoming = csvToNotes(await file.text());\n                const notes = JSON.parse(HNG.getItem('notes') || '[]');\n                const keyOf = n => [n.category, (n.text || '').trim(), n.date, n.time].join('|');\n                const have = new Set(notes.map(keyOf)); let added = 0;\n                incoming.forEach(n => { if (!have.has(keyOf(n))) { have.add(keyOf(n)); notes.push(n); added++; } });\n                notes.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));\n                safeSetItem('notes', JSON.stringify(notes));\n                alert('Đã thêm ' + added + ' ghi chú' + (incoming.length - added ? ' (bỏ qua ' + (incoming.length - added) + ' ghi chú trùng)' : '') + '.');\n            } catch (e) { alert('Không đọc được file CSV: ' + e.message); }\n        }\n\n        function downloadNotesExcel() {\n            const notes = JSON.parse(HNG.getItem('notes') || '[]');\n            \n            if (notes.length === 0) {\n                alert('Chưa có ghi chú nào để xuất!');\n                return;\n            }\n            \n            // Create CSV content with UTF-8 BOM for proper Vietnamese display\n            let csvContent = '\\uFEFF'; // UTF-8 BOM\n            csvContent += 'Chủ đề,Nội dung,Ngày,Giờ,Thời gian chính xác\\n';\n            \n            notes.forEach(note => {\n                const row = [\n                    `\"${note.category}\"`,\n                    `\"${note.text.replace(/\"/g, '\"\"')}\"`, // Escape quotes\n                    `\"${note.date}\"`,\n                    `\"${note.time}\"`,\n                    `\"${note.timestamp}\"`\n                ].join(',');\n                csvContent += row + '\\n';\n            });\n            \n            // Create and download file\n            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });\n            const url = window.URL.createObjectURL(blob);\n            const link = document.createElement('a');\n            link.href = url;\n            link.download = `Ghi_chu_${new Date().toISOString().split('T')[0]}.csv`;\n            link.click();\n            window.URL.revokeObjectURL(url);\n        }\n\n        function getAllTodoTasksWithText() {\n            return [...todoTasks[30], ...todoTasks[60]].filter(t => t.text.trim());\n        }\n\n        function updateCompletionRate() {\n            const tasks = getAllTodoTasksWithText();\n            const completed = tasks.filter(t => t.completed).length;\n            const total = tasks.length;\n\n            document.getElementById('completionRate').textContent = `${completed}/${total}`;\n            document.getElementById('completionPercent').textContent = total > 0 ? Math.round(completed / total * 100) : 0;\n        }\n\n        function saveTodoHistory() {\n            const today = new Date().toDateString();\n            const tasks = getAllTodoTasksWithText();\n            const completed = tasks.filter(t => t.completed).length;\n            const total = tasks.length;\n            \n            const history = JSON.parse(HNG.getItem('todoHistory') || '{}');\n            history[today] = { completed, total, percentage: total > 0 ? completed / total * 100 : 0 };\n            \n            safeSetItem('todoHistory', JSON.stringify(history));\n            drawTodoChart();\n        }\n\n                /* ===== Biểu đồ pastel (thay bản cũ) ===== */\n        function hngFont(px, w) { return (w || '600') + ' ' + px + 'px \"Baloo 2\",\"Be Vietnam Pro\",\"Segoe UI\",sans-serif'; }\n        function hngSetupCanvas(canvas, h) {\n            const w = canvas.parentElement.clientWidth - 30;\n            if (w \u003c= 0) return null;\n            const dpr = window.devicePixelRatio || 1;\n            canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);\n            canvas.style.height = h + 'px';\n            const ctx = canvas.getContext('2d');\n            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n            ctx.clearRect(0, 0, w, h);\n            return { ctx, w, h };\n        }\n        function hngRR(ctx, x, y, w, h, r) {\n            r = Math.min(r, w / 2, h / 2);\n            ctx.beginPath(); ctx.moveTo(x + r, y);\n            ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n            ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();\n        }\n        function hngTopRound(ctx, x, y, w, h, r) {\n            r = Math.min(r, w / 2, h);\n            ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);\n            ctx.arcTo(x, y, x + r, y, r); ctx.lineTo(x + w - r, y);\n            ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h); ctx.closePath();\n        }\n        function hngRangeDates(dates) {\n            return dates.sort((a, b) => new Date(a) - new Date(b));\n        }\n\n        function drawTodoChart() {\n            const canvas = document.getElementById('todoChart'); if (!canvas) return;\n            const S = hngSetupCanvas(canvas, 270); if (!S) return;\n            const { ctx, w, h } = S;\n            const history = JSON.parse(HNG.getItem('todoHistory') || '{}');\n            const all = hngRangeDates(Object.keys(history));\n            const A = { l: 48, r: w - 10, t: 44, b: h - 38 };\n            const cw = A.r - A.l, ch = A.b - A.t;\n            const yOf = p => A.b - (p / 100) * ch;\n\n            // Chú thích màu\n            const bands = [\n                { c: ['#c4f0d2', '#86d9a6'], t: '≥80%' }, { c: ['#cfe7fb', '#93c8f3'], t: '60–79%' },\n                { c: ['#fff3b0', '#ffd970'], t: '40–59%' }, { c: ['#ffd9e8', '#ffaacb'], t: '\u003c40%' }\n            ];\n            ctx.font = hngFont(13, '600'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';\n            let lx = A.l;\n            bands.forEach(b => {\n                ctx.fillStyle = b.c[1]; ctx.beginPath(); ctx.arc(lx + 6, 16, 6, 0, 7); ctx.fill();\n                ctx.fillStyle = '#a0647f'; ctx.fillText(b.t, lx + 17, 17);\n                lx += ctx.measureText(b.t).width + 36;\n            });\n\n            // Vùng ≥80% + lưới\n            hngRR(ctx, A.l, yOf(100), cw, yOf(80) - yOf(100), 8); ctx.fillStyle = 'rgba(160,226,185,.22)'; ctx.fill();\n            ctx.textAlign = 'right';\n            for (let p = 0; p \u003c= 100; p += 20) {\n                const y = yOf(p);\n                ctx.strokeStyle = p === 0 ? '#f0c9d9' : '#f7e1ea'; ctx.lineWidth = p === 0 ? 2 : 1;\n                ctx.setLineDash(p === 0 ? [] : [4, 5]);\n                ctx.beginPath(); ctx.moveTo(A.l, y); ctx.lineTo(A.r, y); ctx.stroke(); ctx.setLineDash([]);\n                ctx.fillStyle = '#b98aa0'; ctx.font = hngFont(12, '600'); ctx.fillText(p + '%', A.l - 8, y);\n            }\n            if (!all.length) {\n                ctx.fillStyle = '#d9a3b8'; ctx.font = hngFont(16, '600'); ctx.textAlign = 'center';\n                ctx.fillText('Chưa có dữ liệu', w / 2, h / 2); return;\n            }\n\n            const recent = all.slice(-15), old = all.slice(0, all.length - 15), hasOld = old.length >= 2;\n            const items = [];\n            if (hasOld) {\n                const avg = old.reduce((s, d) => s + (history[d].percentage || 0), 0) / old.length;\n                items.push({ pct: avg, label: 'TB cũ', old: true });\n            }\n            const todayKey = new Date().toDateString();\n            recent.forEach(d => { const dt = new Date(d); items.push({ pct: history[d].percentage || 0, label: dt.getDate() + '/' + (dt.getMonth() + 1), today: d === todayKey }); });\n\n            const slotW = cw / items.length, bw = Math.max(10, Math.min(36, slotW * 0.62));\n            const cx = i => A.l + slotW * i + slotW / 2;\n            const small = slotW \u003c 30;\n            const pts = [];\n\n            items.forEach((it, i) => {\n                const x = cx(i);\n                if (it.today) { hngRR(ctx, x - slotW / 2 + 1, A.t - 6, slotW - 2, ch + 6, 10); ctx.fillStyle = 'rgba(255,200,222,.30)'; ctx.fill(); }\n                const band = it.pct >= 80 ? bands[0] : it.pct >= 60 ? bands[1] : it.pct >= 40 ? bands[2] : bands[3];\n                const bh = it.pct > 0 ? Math.max(4, (it.pct / 100) * ch) : 0;\n                const y = A.b - bh;\n                if (bh > 0) {\n                    const g = ctx.createLinearGradient(0, y, 0, A.b);\n                    g.addColorStop(0, band.c[0]); g.addColorStop(1, band.c[1]);\n                    ctx.save(); if (it.old) ctx.globalAlpha = 0.7;\n                    hngTopRound(ctx, x - bw / 2, y, bw, bh, 9); ctx.fillStyle = g; ctx.fill(); ctx.restore();\n                }\n                pts.push({ x, y: it.pct > 0 ? y : A.b });\n                // nhãn trục X\n                ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n                ctx.fillStyle = it.today ? '#d4537e' : '#a0647f';\n                ctx.font = hngFont(small ? 11 : 12, it.today ? '700' : '500');\n                ctx.fillText(it.label, x, h - 12);\n            });\n\n            // đường xu hướng mượt\n            if (pts.length > 1) {\n                ctx.strokeStyle = 'rgba(244,143,177,.85)'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n                ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y - 6);\n                for (let i = 1; i \u003c pts.length; i++) {\n                    const mx = (pts[i - 1].x + pts[i].x) / 2, my = (pts[i - 1].y + pts[i].y) / 2 - 6;\n                    ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y - 6, mx, my);\n                }\n                ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y - 6); ctx.stroke();\n            }\n            // chấm + số %\n            items.forEach((it, i) => {\n                const p = pts[i];\n                ctx.fillStyle = '#fff'; ctx.strokeStyle = '#f48fb1'; ctx.lineWidth = 2.5;\n                ctx.beginPath(); ctx.arc(p.x, p.y - 6, 4.5, 0, 7); ctx.fill(); ctx.stroke();\n                if (slotW >= 28) {\n                    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n                    ctx.fillStyle = '#8c4a69'; ctx.font = hngFont(12, '700');\n                    ctx.fillText(Math.round(it.pct) + '%', p.x, Math.max(A.t - 2, p.y - 16));\n                }\n            });\n            if (hasOld) {\n                const dx = A.l + slotW; ctx.strokeStyle = '#f4b6cc'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);\n                ctx.beginPath(); ctx.moveTo(dx, A.t - 6); ctx.lineTo(dx, A.b + 6); ctx.stroke(); ctx.setLineDash([]);\n            }\n        }\n\n        function selectEmotion(emotion) {\n            const buttons = document.querySelectorAll('.emotion-btn');\n            const button = Array.from(buttons).find(btn => btn.textContent.includes(emotion));\n            \n            if (selectedEmotions.includes(emotion)) {\n                selectedEmotions = selectedEmotions.filter(e => e !== emotion);\n                button.classList.remove('selected');\n            } else if (selectedEmotions.length \u003c 2) {\n                selectedEmotions.push(emotion);\n                button.classList.add('selected');\n            }\n            \n            saveSelectedEmotions();\n            drawEmotionChart();\n        }\n\n        function saveSelectedEmotions() {\n            const today = new Date().toDateString();\n
