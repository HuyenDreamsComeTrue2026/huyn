        const emotionHistory = JSON.parse(HNG.getItem('emotionHistory') || '{}');\n            emotionHistory[today] = [...selectedEmotions];\n            safeSetItem('emotionHistory', JSON.stringify(emotionHistory));\n        }\n\n        function loadSelectedEmotions() {\n            const today = new Date().toDateString();\n            const emotionHistory = JSON.parse(HNG.getItem('emotionHistory') || '{}');\n            selectedEmotions = emotionHistory[today] || [];\n            \n            const buttons = document.querySelectorAll('.emotion-btn');\n            buttons.forEach(button => {\n                const emotion = button.textContent.split(' ')[1];\n                if (selectedEmotions.includes(emotion)) {\n                    button.classList.add('selected');\n                }\n            });\n        }\n\n                function drawEmotionChart() {\n            const canvas = document.getElementById('emotionChart'); if (!canvas) return;\n            const S = hngSetupCanvas(canvas, 300); if (!S) return;\n            const { ctx, w, h } = S;\n            const history = JSON.parse(HNG.getItem('emotionHistory') || '{}');\n            const emotions = ['Happy', 'Normal', 'Bored', 'Sad', 'Angry'];\n            const colors = ['#9be3b4', '#ffe38f', '#d9c8f5', '#a9d4f7', '#ffb3c9'];\n            const deep = ['#4fb877', '#e0b43a', '#9a82cf', '#5aa3e0', '#e8708f'];\n            const emojis = ['😊', '😐', '😑', '😢', '😠'];\n            const A = { l: 104, r: w - 10, t: 8, b: h - 38 };\n            const cw = A.r - A.l, ch = A.b - A.t, rowH = ch / emotions.length;\n            const yOf = i => A.t + rowH * i + rowH / 2;\n\n            // dải màu theo hàng + nhãn trục Y\n            emotions.forEach((e, i) => {\n                hngRR(ctx, A.l, A.t + rowH * i + 2, cw, rowH - 4, 12);\n                ctx.fillStyle = colors[i] + '38'; ctx.fill();\n                ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n                ctx.font = '17px \"Segoe UI Emoji\",\"Apple Color Emoji\",sans-serif'; ctx.fillStyle = '#000';\n                ctx.fillText(emojis[i], A.l - 62, yOf(i));\n                ctx.font = hngFont(14, '700'); ctx.fillStyle = deep[i];\n                ctx.textAlign = 'left'; ctx.fillText(e, A.l - 54, yOf(i) + 1);\n            });\n\n            const all = Object.keys(history).sort((a, b) => new Date(a) - new Date(b));\n            if (!all.length) {\n                ctx.fillStyle = '#d9a3b8'; ctx.font = hngFont(16, '600'); ctx.textAlign = 'center';\n                ctx.fillText('Chưa có dữ liệu', A.l + cw / 2, h / 2); return;\n            }\n            const recent = all.slice(-15), old = all.slice(0, all.length - 15), hasOld = old.length >= 2;\n            const slots = (hasOld ? 1 : 0) + recent.length, slotW = cw / slots;\n            const cx = i => A.l + slotW * i + slotW / 2;\n            const R = Math.max(7, Math.min(15, slotW * 0.42));\n            const todayKey = new Date().toDateString();\n\n            function label(i, text, bold, italic) {\n                ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n                ctx.fillStyle = bold ? '#d4537e' : '#a0647f';\n                ctx.font = (italic ? 'italic ' : '') + hngFont(slotW \u003c 30 ? 11 : 12, bold ? '700' : '500');\n                ctx.fillText(text, cx(i), h - 12);\n            }\n            function dot(x, y, ei, alpha) {\n                ctx.save(); ctx.globalAlpha = alpha || 1;\n                ctx.shadowColor = colors[ei] + 'aa'; ctx.shadowBlur = 8;\n                ctx.fillStyle = colors[ei]; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();\n                ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();\n                ctx.font = Math.round(R * 1.2) + 'px \"Segoe UI Emoji\",\"Apple Color Emoji\",sans-serif';\n                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';\n                ctx.fillText(emojis[ei], x, y + 1); ctx.restore();\n            }\n\n            let off = 0;\n            if (hasOld) {\n                emotions.forEach((e, ei) => { if (old.some(d => history[d] && history[d].includes(e))) dot(cx(0), yOf(ei), ei, 0.65); });\n                label(0, 'Cũ', false, true);\n                const dx = A.l + slotW; ctx.strokeStyle = '#f4b6cc'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);\n                ctx.beginPath(); ctx.moveTo(dx, A.t); ctx.lineTo(dx, A.b + 6); ctx.stroke(); ctx.setLineDash([]);\n                off = 1;\n            }\n            recent.forEach((d, i) => {\n                if (d === todayKey) { hngRR(ctx, cx(off + i) - slotW / 2 + 1, A.t, slotW - 2, ch, 10); ctx.fillStyle = 'rgba(255,200,222,.30)'; ctx.fill(); }\n            });\n            // nối các ngày liên tiếp cùng cảm xúc\n            emotions.forEach((e, ei) => {\n                let prev = null;\n                recent.forEach((d, i) => {\n                    const has = history[d] && history[d].includes(e);\n                    if (has && prev !== null) {\n                        ctx.strokeStyle = colors[ei]; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.globalAlpha = 0.8;\n                        ctx.beginPath(); ctx.moveTo(cx(off + prev), yOf(ei)); ctx.lineTo(cx(off + i), yOf(ei)); ctx.stroke(); ctx.globalAlpha = 1;\n                    }\n                    prev = has ? i : null;\n                });\n            });\n            recent.forEach((d, i) => {\n                (history[d] || []).forEach(e => { const ei = emotions.indexOf(e); if (ei !== -1) dot(cx(off + i), yOf(ei), ei); });\n                const dt = new Date(d); label(off + i, dt.getDate() + '/' + (dt.getMonth() + 1), d === todayKey);\n            });\n        }\n\n        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { try { drawTodoChart(); drawEmotionChart(); } catch (e) {} });\n\n        function uploadAudio() {\n            const fileInput = document.getElementById('audioUpload');\n            const file = fileInput.files[0];\n            \n            if (file) {\n                const reader = new FileReader();\n                reader.onload = function(e) {\n                    safeSetItem('motivationAudioData', e.target.result);\n                    setupAudio();\n                };\n                reader.readAsDataURL(file);\n            }\n        }\n\n        function setupAudio() {\n            const audioData = HNG.getItem('motivationAudioData');\n            if (audioData) {\n                motivationAudio = document.getElementById('motivationAudio');\n                motivationAudio.src = audioData;\n                motivationAudio.loop = true;\n            }\n        }\n\n        function toggleAudio() {\n            if (motivationAudio) {\n                if (isAudioPlaying) {\n                    motivationAudio.pause();\n                    isAudioPlaying = false;\n                } else {\n                    motivationAudio.play().catch(e => console.log('Audio play failed:', e));\n                    isAudioPlaying = true;\n                }\n            }\n        }\n\n        function checkAutoPlayAudio() {\n            setupAudio();\n            // Check if waste ratio > 87% and auto-play if needed\n            setTimeout(() => {\n                const wasteElement = document.getElementById('wastePercentage');\n                if (wasteElement && parseFloat(wasteElement.textContent) > 87) {\n                    if (motivationAudio && !isAudioPlaying) {\n                        motivationAudio.play().catch(e => console.log('Auto-play on load failed:', e));\n                        isAudioPlaying = true;\n                    }\n                }\n            }, 1000);\n        }\n\n        function loadData() {\n            const savedData = JSON.parse(HNG.getItem('dailyData') || '{}');\n            const today = new Date().toDateString();\n            \n            // Restore audio data if exists\n            const audioData = HNG.getItem('motivationAudioData') || HNG.getItem('motivationAudioBackup');\n            if (audioData) {\n                safeSetItem('motivationAudioData', audioData);\n            }\n            \n            // Restore emotion and todo data\n            const emotionHistory = HNG.getItem('emotionHistory') || HNG.getItem('emotionHistoryBackup');\n            const todoHistory = HNG.getItem('todoHistory') || HNG.getItem('todoHistoryBackup');\n            const todoTasks30Saved = HNG.getItem('todoTasks30') || HNG.getItem('todoTasks30Backup');\n            const todoTasks60Saved = HNG.getItem('todoTasks60') || HNG.getItem('todoTasks60Backup');\n            \n            if (emotionHistory && !HNG.getItem('emotionHistory')) {\n                safeSetItem('emotionHistory', emotionHistory);\n            }\n            if (todoHistory && !HNG.getItem('todoHistory')) {\n                safeSetItem('todoHistory', todoHistory);\n            }\n            if (todoTasks30Saved && !HNG.getItem('todoTasks30')) {\n                safeSetItem('todoTasks30', todoTasks30Saved);\n            }\n            if (todoTasks60Saved && !HNG.getItem('todoTasks60')) {\n                safeSetItem('todoTasks60', todoTasks60Saved);\n            }\n            \n            if (savedData.date === today) {\n                dailyStudyTime = savedData.studyTime || 0;\n                wastedTimeStart = savedData.wastedTimeStart;\n            } else {\n                // New day - reset daily data\n                dailyStudyTime = 0;\n                wastedTimeStart = null;\n                \n                // Reset todo tasks for new day but save yesterday's to history first\n                loadTodoTasks();\n                if (getAllTodoTasksWithText().length > 0) {\n                    saveTodoHistory();\n                }\n                HNG.removeItem('todoTasks30');\n                HNG.removeItem('todoTasks60');\n                todoTasks = { 30: [], 60: [] };\n            }\n        }\n\n        function saveData() {\n            const today = new Date().toDateString();\n            const dataToSave = {\n                date: today,\n                studyTime: dailyStudyTime,\n                wastedTimeStart: wastedTimeStart,\n                secondsPassed: Math.floor((Date.now() - new Date().setHours(0,0,0,0)) / 1000)\n            };\n            safeSetItem('dailyData', JSON.stringify(dataToSave));\n            \n            // Also save historical seconds data\n            const secondsHistory = JSON.parse(HNG.getItem('secondsHistory') || '{}');\n            secondsHistory[today] = dataToSave.secondsPassed;\n            safeSetItem('secondsHistory', JSON.stringify(secondsHistory));\n            \n            // Ensure audio data is preserved\n            const audioData = HNG.getItem('motivationAudioData');\n            if (audioData) {\n                safeSetItem('motivationAudioBackup', audioData);\n            }\n            \n            // Ensure emotion and todo data are preserved\n            const emotionHistory = HNG.getItem('emotionHistory');\n            const todoHistory = HNG.getItem('todoHistory');\n            const todoTasks30Saved = HNG.getItem('todoTasks30');\n            const todoTasks60Saved = HNG.getItem('todoTasks60');\n            \n            if (emotionHistory) safeSetItem('emotionHistoryBackup', emotionHistory);\n            if (todoHistory) safeSetItem('todoHistoryBackup', todoHistory);\n            if (todoTasks30Saved) safeSetItem('todoTasks30Backup', todoTasks30Saved);\n            if (todoTasks60Saved) safeSetItem('todoTasks60Backup', todoTasks60Saved);\n        }\n\n        // Save data periodically\n        setInterval(saveData, 30000); // Save every 30 seconds\n\tfunction resetAudio() {\n    HNG.removeItem('motivationAudioData');\n    HNG.removeItem('motivationAudioBackup');\n    const audio = document.getElementById('motivationAudio');\n    audio.src = \"\";\n    isAudioPlaying = false;\n    alert(\"Đã xóa nhạc cũ, hãy upload file mới!\");\n}\n    \n\u003c/script>\n\n\u003cscript>\n\n/* ── CONSTANTS ── */\nconst DAYS=[];\nconst Y0=new Date(2026,0,1);\nfor(let i=0;i\u003c365;i++){const d=new Date(Y0);d.setDate(Y0.getDate()+i);DAYS.push(d);}\nconst WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];\nconst pad=n=>String(n).padStart(2,'0');\nconst fmtDate=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/2026`;\nconst fmtFull=d=>`${WD[d.getDay()]}, ${fmtDate(d)}`;\nconst dayKey=d=>`nk26_${d.getMonth()}_${d.getDate()}`;\nconst tsKey=(dk,sec,i)=>`ts_${dk}_${sec}_${i}`;\n\n/* 3 sections metadata */\nconst SECTIONS=[\n  {key:'s1',cls:'s1',icon:'🌸',label:'Nhanh – dưới 5 phút',sub:'(việc nhỏ, nhanh gọn)',unitMin:5,light:'light-green'},\n  {key:'s2',cls:'s2',icon:'🔴',label:'Trung bình – khoảng 30 phút',sub:'(cần tập trung vừa)',unitMin:30,light:'light-pink'},\n  {key:'s3',cls:'s3',icon:'🔺',label:'Dài – trên 1 tiếng',sub:'(cần tập trung cao)',unitMin:60,light:'light-red'},\n];\n\n/* ── GIFT / TIẾT KIỆM ── */\nconst GIFT_START=new Date(2026,9,11); GIFT_START.setHours(0,0,0,0); /* 11/10/2026 */\nconst GIFT_EARN=[2000,5000,10000];    /* theo section index: Nhanh, Trung bình, Dài */\nconst GIFT_PENALTY=[1000,3000,5000];  /* theo section index: Nhanh, Trung bình, Dài */\nconst EMPTY_DAY_PENALTY_START=new Date(2026,8,14); EMPTY_DAY_PENALTY_START.setHours(0,0,0,0); /* 14/9/2026 */\nconst EMPTY_DAY_PENALTY=10000; /* phạt khi cả ngày không ghi nhiệm vụ nào (cả 3 mục đều trống) */\nconst GIFT_KEY='gift_items';\nfunction fmtVnd(n){\n  n=Math.round(n||0);\n  const neg=n\u003c0;n=Math.abs(n);\n  const s=n.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.');\n  return (neg?'-':'')+s+'đ';\n}\nfunction dayIsPast(d){\n  const today=new Date();today.setHours(0,0,0,0);\n  const dd=new Date(d);dd.setHours(0,0,0,0);\n  return dd\u003ctoday;\n}\nfunction dayCountsForGift(d){\n  const dd=new Date(d);dd.setHours(0,0,0,0);\n  return dd>=GIFT_START;\n}\n/* số tiền tiết kiệm được trong ngày (từ các nhiệm vụ đã tích hoàn thành) */\nfunction dayGiftEarned(data,d){\n  if(!dayCountsForGift(d))return 0;\n  let sum=0;\n  (data.sections||[]).forEach((sec,si)=>{\n    (sec.tasks||[]).forEach(t=>{if(t.text&&t.text.trim()&&t.done)sum+=GIFT_EARN[si]||0;});\n  });\n  return sum;\n}\n/* số tiền bị trừ trong ngày (nhiệm vụ có nhập nhưng không hoàn thành, chỉ tính khi ngày đã qua) */\nfunction dayGiftPenalty(data,d){\n  if(!dayCountsForGift(d))return 0;\n  if(!dayIsPast(d))return 0;\n  let sum=0;\n  (data.sections||[]).forEach((sec,si)=>{\n    (sec.tasks||[]).forEach(t=>{if(t.text&&t.text.trim()&&!t.done)sum+=GIFT_PENALTY[si]||0;});\n  });\n  const dd=new Date(d);dd.setHours(0,0,0,0);\n  if(dd>=EMPTY_DAY_PENALTY_START){\n    const noTaskAtAll=!(data.sections||[]).some(sec=>(sec.tasks||[]).some(t=>t.text&&t.text.trim()));\n    if(noTaskAtAll) sum+=EMPTY_DAY_PENALTY;\n  }\n  return sum;\n}\n/* totalEarn/totalPenalty: tổng thô cả năm (chỉ để tham khảo)\n   pool: tổng tiết kiệm thực tế dùng để góp quà — mỗi ngày lấy hiệu (làm được - chưa làm được),\n         ngày nào hiệu dương mới cộng vào pool, ngày nào âm/0 thì bỏ qua (không trừ vào pool)\n   yearPenalty: tổng các hiệu ÂM của từng ngày cộng lại (mỗi ngày âm bao nhiêu cộng dồn bấy nhiêu),\n                ngày nào hiệu dương thì bỏ qua (không cộng vào đây) */\nfunction computeGiftTotals(){\n  let totalEarn=0,totalPenalty=0,pool=0,yearPenalty=0;\n  DAYS.forEach(d=>{\n    if(!dayCountsForGift(d))return;\n    const data=ensureData(loadDay(d));\n    const earn=dayGiftEarned(data,d);\n    const pen=dayGiftPenalty(data,d);\n    totalEarn+=earn;totalPenalty+=pen;\n    const net=earn-pen;\n    if(net\u003c0)yearPenalty+=net;\n  });\n  /* pool = tổng làm xong (+) trừ tổng không xong (−), rồi trừ tiền của các gift đã gạch */\n  const spent=(loadGiftData().spent)||0;\n  pool=totalEarn-totalPenalty-spent;\n  return {totalEarn,totalPenalty,balance:totalEarn-totalPenalty,pool,yearPenalty,spent};\n}\n/* phân bổ số dư hiện có cho từng quà: mục đã tích được rót tiền trước (theo thứ tự),\n   tối đa bằng số tiền cần góp; nếu còn thừa mới rót tiếp sang mục CHƯA tích (theo thứ tự);\n   mục chưa tích mà chưa tới lượt thì Hiện tại = 0 */\nfunction computeGiftAllocations(gd,balance){\n  const items=gd.items||[];\n  let remaining=Math.max(0,balance||0);\n  const currents=items.map(it=>it.done?(+it.target)||0:0);\n  items.forEach((it,idx)=>{\n    if(it.done||!it.active||remaining\u003c=0)return;\n    const target=(+it.target)||0;\n    const cap=target>0?target:Infinity;\n    const alloc=Math.min(remaining,cap);\n    currents[idx]=alloc;remaining-=alloc;\n  });\n  return currents;\n}\n/* tự gạch gift đã đủ tiền (theo thứ tự tích), tiền thừa chảy sang gift tích kế tiếp */\nfunction settleGifts(gd){\n  gd.spent=gd.spent||0;\n  let avail=computeGiftTotals().pool;\n  for(let i=0;i\u003cgd.items.length;i++){\n    const it=gd.items[i];\n    if(it.done||!it.active)continue;\n    const target=(+it.target)||0;\n    if(target>0&&avail>=target){it.done=true;gd.spent+=target;avail-=target;}\n    else break;\n  }\n  return gd;\n}\nfunction allGiftsDone(gd){return gd.items.length===5&&gd.items.every(it=>it.done);}\nfunction loadGiftData(){\n  const raw=DAY_CACHE[GIFT_KEY];\n  if(raw&&Array.isArray(raw.items)&&raw.items.length===5){\n    if(typeof raw.spent!=='number')raw.spent=0;\n    if(raw.startKey!=='2026-10-11'){ /* mốc mới 11/10/2026: bỏ tiền đã dùng và dấu gạch cũ, giữ tên + số tiền gift */\n      raw.startKey='2026-10-11';raw.spent=0;\n      raw.items.forEach(it=>{it.done=false;});\n    }\n    return raw;\n  }\n  return {startKey:'2026-10-11',spent:0,items:[0,1,2,3,4].map(()=>({name:'',target:'',active:false,done:false}))};\n}\nfunction saveGiftData(gd){\n  DAY_CACHE[GIFT_KEY]=gd;\n  nkPut(GIFT_KEY,gd).catch(e=>console.error('saveGiftData lỗi:',e));\n}\n\n/* ── ESTIMATE TIME HELPERS (dựa trên số nhiệm vụ × thời lượng chuẩn mỗi mục) ── */\nfunction fmtMinutes(min){\n  if(!min)return'0p';\n  const h=Math.floor(min/60),m=min%60;\n  if(h&&m)return`${h}g ${m}p`;\n  if(h)return`${h}g`;\n  return`${m}p`;\n}\nfunction countFilledTasks(sec){return (sec.tasks||[]).filter(t=>t.text&&t.text.trim()).length;}\nfunction sectionEstMinutes(sec,meta){return countFilledTasks(sec)*meta.unitMin;}\nfunction dayEstMinutes(data){let t=0;data.sections.forEach((sec,i)=>{t+=sectionEstMinutes(sec,SECTIONS[i]);});return t;}\n\n/* ── TIME HELPERS ── */\nconst secsToHMS=s=>({h:Math.floor(s/3600),m:Math.floor((s%3600)/60),s:s%60});\nconst hmsToSecs=(h,m,s)=>Math.max(0,+h||0)*3600+Math.max(0,+m||0)*60+Math.max(0,+s||0);\nfunction fmtStudyFull(secs){\n  if(!secs)return'—';\n  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;\n  const p=[];if(h)p.push(`${h} giờ`);if(m)p.push(`${m} phút`);if(s&&!h)p.push(`${s} giây`);\n  return p.join(' ')||'0 giây';\n}\nconst fmtHoursShort=secs=>secs?(Math.floor(secs/3600)?`${Math.floor(secs/3600)}g ${Math.floor((secs%3600)/60)}p`:`${Math.floor((secs%3600)/60)}p`):'0g';\n\n/* ── STORAGE (IndexedDB, với cache trong bộ nhớ để đọc/ghi đồng bộ) ── */\nconst NK_DB_NAME='NhatKy2026DB', NK_STORE='days';\nlet DAY_CACHE={};\nlet __saveErrShown=false;\n\nfunction nkOpenDB(){\n  return new Promise((resolve,reject)=>{\n    const req=indexedDB.open(NK_DB_NAME,1);\n    req.onupgradeneeded=e=>{\n      const db=e.target.result;\n      if(!db.objectStoreNames.contains(NK_STORE))db.createObjectStore(NK_STORE);\n    };\n    req.onsuccess=e=>resolve(e.target.result);\n    req.onerror=e=>reject(e.target.error);\n  });\n}\nfunction nkGetAll(){\n  return nkOpenDB().then(db=>new Promise((resolve,reject)=>{\n    const tx=db.transaction(NK_STORE,'readonly');\n    const store=tx.objectStore(NK_STORE);\n    const out={};\n    const cReq=store.openCursor();\n    cReq.onsuccess=e=>{\n      const cursor=e.target.result;\n      if(cursor){out[cursor.key]=cursor.value;cursor.continue();}\n      else resolve(out);\n    };\n    cReq.onerror=e=>reject(e.target.error);\n  }));\n}\nfunction nkPut(key,value){\n  return nkOpenDB().then(db=>new Promise((resolve,reject)=>{\n    const tx=db.transaction(NK_STORE,'readwrite');\n    tx.objectStore(NK_STORE).put(value,key);\n    tx.oncomplete=()=>resolve(true);\n    tx.onerror=e=>reject(e.target.error);\n  }));\n}\n\nasync function nkPreload(){\n  try{\n    DAY_CACHE=await nkGetAll();\n    if(Object.keys(DAY_CACHE).length===0){\n      /* IndexedDB rỗng -> thử chuyển dữ liệu cũ từ localStorage (nk26_*) nếu có */\n      let migrated=0;\n      for(let i=0;i\u003clocalStorage.length;i++){\n        const k=localStorage.key(i);\n        if(k&&k.startsWith('nk26_')){\n          try{\n            const val=JSON.parse(localStorage.getItem(k));\n            DAY_CACHE[k]=val;\n            await nkPut(k,val);\n            migrated++;\n          }catch(e){console.error('Lỗi chuyển dữ liệu cũ cho key '+k,e);}\n        }\n      }\n      if(migrated)console.log('Đã chuyển '+migrated+' ngày từ localStorage sang IndexedDB.');\n    }\n  }catch(e){\n    console.error('Lỗi tải dữ liệu từ IndexedDB:',e);\n    alert('⚠️ Không tải được dữ liệu đã lưu (IndexedDB lỗi): '+e.message);\n  }\n}\n\nfunction loadDay(d){return DAY_CACHE[dayKey(d)]||null;}\nfunction saveDay(d,data){\n  const k=dayKey(d);\n  DAY_CACHE[k]=data;\n  nkPut(k,data).catch(e=>{\n    console.error('saveDay lỗi:',e);\n    if(!__saveErrShown){\n      __saveErrShown=true;\n      alert('⚠️ KHÔNG LƯU ĐƯỢC dữ liệu!\\n\\nLỗi: '+e.name+' - '+e.message+'\\n\\nBộ nhớ trình duyệt có thể đã đầy hoặc bị chặn.');\n    }\n  });\n}\n/* gõ checkStorage() trong Console (F12) để xem dung lượng localStorage đang dùng (không tính IndexedDB) */\nwindow.checkStorage=function(){\n  let total=0,byPrefix={};\n  for(let i=0;i\u003clocalStorage.length;i++){\n    const k=localStorage.key(i);\n    const v=localStorage.getItem(k)||'';\n    const size=(k.length+v.length)*2; /* rough UTF-16 byte estimate */\n    total+=size;\n    const prefix=k.split('_')[0];\n    byPrefix[prefix]=(byPrefix[prefix]||0)+size;\n  }\n  console.log('Tổng dung lượng localStorage đang dùng: '+(total/1024).toFixed(1)+' KB (giới hạn thường là ~5-10MB tuỳ trình duyệt)');\n  console.log('Chi tiết theo prefix key:',byPrefix);\n  return {totalKB:(total/1024).toFixed(1),byPrefix};\n};\n\nfunction defSection(){return{tasks:[{text:'',done:false}],results:[''],timers:[0]}}\nfunction defData(){return{sections:[defSection(),defSection(),defSection()],score:'',note:''}}\n\n/* migrate old format (flat tasks array) → new sections format */\nfunction ensureData(raw){\n  if(!raw)return defData();\n  if(raw.sections)return raw; /* already new format */\n  /* old format had: tasks, results, timers at top level → put into section 0 */\n  const d=defData();\n  d.sections[0].tasks=raw.tasks||[{text:'',done:false}];\n  d.sections[0].results=raw.results||[''];\n  d.sections[0].timers=raw.timers||[0];\n  d.score=raw.score||'';d.note=raw.note||'';\n  return d;\n}\n\n/* calc % across all 3 sections */\nfunction calcPct(data){\n  let done=0,total=0;\n  (data.sections||[]).forEach(sec=>{\n    (sec.tasks||[]).forEach(t=>{if(t.text.trim()){total++;if(t.done)done++;}});\n  });\n  return total?Math.round(done/total*100):null;\n}\n\n/* live seconds for one timer row */\nfunction liveSeconds(sec,dk,sIdx,i){\n  const base=sec.timers[i]||0;\n  const tsRaw=localStorage.getItem(tsKey(dk,sIdx,i));\n  if(!tsRaw)return base;\n  return base+Math.max(0,Math.floor((Date.now()-parseInt(tsRaw,10))/1000));\n}\n\n/* total live seconds across all sections */\nfunction totalLiveSecs(data,dk){\n  let t=0;\n  (data.sections||[]).forEach((sec,si)=>(sec.timers||[]).forEach((_,i)=>{t+=liveSeconds(sec,dk,si,i);}));\n  return t;\n}\n\n/* ── YEARLY STATS ── */\nconst IV={};\nfunction updateStats(){\n  let ps=0,pc=0,ss=0,sc=0,totalStudy=0,daysLogged=0;\n  DAYS.forEach(d=>{\n    const dk=dayKey(d);const raw=loadDay(d);if(!raw)return;\n    const data=ensureData(raw);daysLogged++;\n    const p=calcPct(data);if(p!==null){ps+=p;pc++;}\n    const s=parseFloat(data.score);if(!isNaN(s)&&data.score!==''){ss+=s;sc++;}\n    totalStudy+=totalLiveSecs(data,dk);\n  });\n  const g=id=>document.getElementById(id);\n  g('statPct').textContent=pc?Math.round(ps/pc)+'%':'—';\n  g('statPctSub').textContent=pc?`${pc} ngày có dữ liệu`:'';\n  g('statScore').textContent=sc?(ss/sc).toFixed(1)+' / 10':'—';\n  g('statScoreSub').textContent=sc?`${sc} ngày đã chấm`:'';\n  g('statHours').textContent=fmtHoursShort(totalStudy);\n  g('statHoursSub').textContent=totalStudy?fmtStudyFull(totalStudy):'';\n  g('statDays').textContent=daysLogged;\n\n  const gt=computeGiftTotals();\n  g('statGiftEarn').textContent=fmtVnd(gt.totalEarn);\n  g('statGiftPenalty').textContent=fmtVnd(gt.totalEarn-gt.totalPenalty);\n  g('statGiftPenalty').style.color=(gt.totalEarn-gt.totalPenalty)\u003c0?'#c0392b':'#3b6d11';\n}\n\nfunction relDay(off){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+off);return t}\n\nfunction buildOverview(){\n  const ov=document.getElementById('ovRow');ov.innerHTML='';\n  [{label:'Hôm qua',offset:-1},{label:'Hôm nay',offset:0},{label:'Ngày mai',offset:1}].forEach(({label,offset})=>{\n    const d=relDay(offset);const raw=loadDay(d);const pct=raw?calcPct(ensureData(raw)):null;\n    const card=document.createElement('div');card.className='ov-card'+(offset===0?' ov-today':'');\n    card.innerHTML=`\u003cdiv class=\"ov-label\">${label}\u003c/div>\u003cdiv class=\"ov-date\">${fmtDate(d)}\u003c/div>\n      \u003cdiv class=\"ov-pct\">${pct!==null?'Hoàn thành: \u003cspan>'+pct+'%\u003c/span>':'\u003cspan style=\"color:var(--t2)\">Chưa có dữ liệu\u003c/span>'}\u003c/div>`;\n    card.addEventListener('click',()=>{\n      const key=dayKey(d);const el=document.getElementById('block_'+key);\n      if(el){el.scrollIntoView({behavior:'smooth',block:'center'});\n        const b=document.getElementById('body_'+key);if(b&&!b.classList.contains('open')){b.classList.add('open');}\n        const tog=document.getElementById('tog_'+key);if(tog)tog.textContent='▲';}\n    });\n    ov.appendChild(card);\n  });\n}\n\n/* ── beforeunload: flush all running timers ── */\nwindow.addEventListener('beforeunload',()=>{\n  DAYS.forEach(d=>{\n    const dk=dayKey(d);const raw=loadDay(d);if(!raw)return;\n    const data=ensureData(raw);let changed=false;\n    (data.sections||[]).forEach((sec,si)=>{\n      (sec.timers||[]).forEach((_,i)=>{\n        const tk=tsKey(dk,si,i);const tsRaw=localStorage.getItem(tk);\n        if(tsRaw){\n          const el=Math.floor((Date.now()-parseInt(tsRaw,10))/1000);\n          if(el>0){sec.timers[i]=(sec.timers[i]||0)+el;changed=true;}\n          localStorage.removeItem(tk);\n        }\n      });\n    });\n    if(changed)saveDay(d,data);\n  });\n});\n\n/* ── BUILD DAY BLOCK ── */\nfunction buildDayBlock(d){\n  const today=new Date();today.setHours(0,0,0,0);\n  const isToday=d.toDateString()===today.toDateString();\n  const dk=dayKey(d);\n  const data=ensureData(loadDay(d));\n\n  const block=document.createElement('div');block.className='day-block'+(isToday?' today-hl':'');block.id='block_'+dk;\n  const hdr=document.createElement('div');hdr.className='day-header';block.appendChild(hdr);\n  const body=document.createElement('div');body.className='day-body'+(isToday?' open':'');body.id='body_'+dk;\n\n  const persist=()=>saveDay(d,data);\n\n  function renderHdr(){\n    const pct=calcPct(data);\n    const badge=pct!==null?`\u003cspan class=\"day-badge\">\u003cspan class=\"bp\">${pct}%\u003c/span> hoàn thành\u003c/span>`:`\u003cspan class=\"day-badge\" style=\"color:var(--t2)\">Chưa nhập\u003c/span>`;\n    const todayTag=isToday?`\u003cspan class=\"today-badge\">Hôm nay\u003c/span>`:'';\n    const arr=body.classList.contains('open')?'▲':'▼';\n    hdr.innerHTML=`\u003cspan class=\"day-title\">${fmtFull(d)}${todayTag}\u003c/span>\n      \u003cspan style=\"display:flex;align-items:center;gap:8px\">${badge}\u003cspan id=\"tog_${dk}\" style=\"font-size:11px;color:var(--t2)\">${arr}\u003c/span>\u003c/span>`;\n  }\n\n  function refreshDayEst(){\n    const el=document.getElementById('sv_est_'+dk);\n    if(!el)return;\n    el.textContent=fmtMinutes(dayEstMinutes(data));\n  }\n\n  function refreshSummary(){\n    const pct=calcPct(data);\n    const secs=totalLiveSecs(data,dk);\n    const hms=secsToHMS(secs);\n    const ep=document.getElementById('sv_pct_'+dk);\n    const eps=document.getElementById('sv_pct_sub_'+dk);\n    const et=document.getElementById('sv_time_'+dk);\n    const ets=document.getElementById('sv_time_sub_'+dk);\n    if(ep){\n      ep.textContent=pct!==null?pct+'%':'—';\n      if(eps){\n        let done=0,total=0;\n        data.sections.forEach(sec=>sec.tasks.forEach(t=>{if(t.text.trim()){total++;if(t.done)done++;}}));\n        eps.textContent=total?`${done} / ${total} nhiệm vụ`:'Chưa có nhiệm vụ';\n      }\n    }\n    if(et){\n      et.textContent=secs?`${pad(hms.h)}:${pad(hms.m)}:${pad(hms.s)}`:'—';\n      if(ets)ets.textContent=secs?fmtStudyFull(secs):'Chưa bấm giờ';\n    }\n    const eg=document.getElementById('sv_gearn_'+dk);\n    const ep2=document.getElementById('sv_gpen_'+dk);\n    if(eg||ep2){\n      const countsForGift=dayCountsForGift(d);\n      if(eg)eg.textContent=countsForGift?fmtVnd(dayGiftEarned(data,d)):'—';\n      if(ep2)ep2.textContent=countsForGift?fmtVnd(dayGiftPenalty(data,d)):'—';\n    }\n  }\n\n  /* build timer cells for section sIdx, row i */\n  function makeTimerCells(sec,sIdx,i){\n    const tKey=`${dk}_${sIdx}_${i}`;\n    clearInterval(IV[tKey]);delete IV[tKey];\n    const wasRunning=!!localStorage.getItem(tsKey(dk,sIdx,i));\n    const hms=secsToHMS(liveSeconds(sec,dk,sIdx,i));\n\n    const tdH=document.createElement('div');tdH.className='td td-h';\n    const inH=document.createElement('input');inH.type='number';inH.className='hms';inH.min=0;inH.value=hms.h;inH.placeholder='0';\n    tdH.appendChild(inH);\n\n    const tdM=document.createElement('div');tdM.className='td td-m';\n    const inM=document.createElement('input');inM.type='number';inM.className='hms';inM.min=0;inM.value=hms.m;inM.placeholder='0';\n    tdM.appendChild(inM);\n\n    const tdS=document.createElement('div');tdS.className='td td-s';\n    const inS=document.createElement('input');inS.type='number';inS.className='hms';inS.min=0;inS.value=hms.s;inS.placeholder='0';\n    tdS.appendChild(inS);\n\n    function syncDisplay(){const c=secsToHMS(liveSeconds(sec,dk,sIdx,i));inH.value=c.h;inM.value=c.m;inS.value=c.s;}\n    function syncFromInputs(){\n      clearInterval(IV[tKey]);delete IV[tKey];\n      localStorage.removeItem(tsKey(dk,sIdx,i));\n      sec.timers[i]=hmsToSecs(inH.value,inM.value,inS.value);\n      setRunning(false);persist();refreshSummary();\n    }\n    inH.addEventListener('change',syncFromInputs);\n    inM.addEventListener('change',syncFromInputs);\n    inS.addEventListener('change',syncFromInputs);\n\n    const tdBtn=document.createElement('div');tdBtn.className='td td-btn';\n    const btnS=document.createElement('button');btnS.className='tbtn ts';btnS.title='Bắt đầu';btnS.textContent='▶';\n    const btnP=document.createElement('button');btnP.className='tbtn tp';btnP.title='Dừng';btnP.textContent='⏸';btnP.style.display='none';\n    const btnR=document.createElement('button');btnR.className='tbtn tr2';btnR.title='Đặt lại';btnR.textContent='↺';\n\n    function setRunning(on){\n      [tdH,tdM,tdS].forEach(el=>el.classList.toggle('running',on));\n      btnS.style.display=on?'none':'flex';btnP.style.display=on?'flex':'none';\n    }\n    function startTimer(){\n      if(IV[tKey])return;\n      localStorage.setItem(tsKey(dk,sIdx,i),Date.now().toString());\n      setRunning(true);\n      IV[tKey]=setInterval(()=>{\n        syncDisplay();refreshSummary();\n        const live=liveSeconds(sec,dk,sIdx,i);\n        if(live%10===0){\n          const ts=localStorage.getItem(tsKey(dk,sIdx,i));\n          if(ts){const el=Math.floor((Date.now()-parseInt(ts,10))/1000);sec.timers[i]=(sec.timers[i]||0)+el;localStorage.setItem(tsKey(dk,sIdx,i),Date.now().toString());persist();}\n        }\n      },1000);\n    }\n    function stopTimer(){\n      const ts=localStorage.getItem(tsKey(dk,sIdx,i));\n      if(ts){const el=Math.floor((Date.now()-parseInt(ts,10))/1000);if(el>0)sec.timers[i]=(sec.timers[i]||0)+el;}\n      clearInterval(IV[tKey]);delete IV[tKey];\n      localStorage.removeItem(tsKey(dk,sIdx,i));\n      syncDisplay();setRunning(false);persist();refreshSummary();\n    }\n    btnS.addEventListener('click',startTimer);\n    btnP.addEventListener('click',stopTimer);\n    btnR.addEventListener('click',()=>{stopTimer();sec.timers[i]=0;syncDisplay();setRunning(false);persist();refreshSummary();});\n    tdBtn.appendChild(btnS);tdBtn.appendChild(btnP);tdBtn.appendChild(btnR);\n    if(wasRunning)startTimer();\n    return[tdH,tdM,tdS,tdBtn];\n  }\n\n  /* build one section table */\n  function buildSectionTable(sec,sIdx,meta){\n    const wrap=document.createElement('div');wrap.className=`section-wrap ${meta.cls} tbl-cols`;\n\n    /* label */\n    const lbl=document.createElement('div');lbl.className='section-label';\n    lbl.innerHTML=`\u003cspan class=\"section-dot\">\u003c/span>\u003cspan>${meta.icon} ${meta.label}\u003c/span>\u003cspan class=\"section-sub\">${meta.sub}\u003c/span>\u003cspan class=\"section-light ${meta.light}\" id=\"light_${dk}_${sIdx}\" title=\"Nháy đến khi hoàn thành hết nhiệm vụ trong mục\">\u003c/span>\u003cspan class=\"section-est\" id=\"est_${dk}_${sIdx}\">\u003c/span>`;\n    wrap.appendChild(lbl);\n    const estEl=lbl.querySelector('.section-est');\n    const lightEl=lbl.querySelector('.section-light');\n\n    function refreshEst(){\n      if(!estEl)return;\n      const n=countFilledTasks(sec);\n      const min=sectionEstMinutes(sec,meta);\n      estEl.textContent=n?`${n} việc × ${meta.unitMin}p = ${fmtMinutes(min)}`:'—';\n    }\n\n    function refreshLight(){\n      if(!lightEl)return;\n      const filled=(sec.tasks||[]).filter(t=>t.text&&t.text.trim());\n      const hasIncomplete=filled.some(t=>!t.done);\n      lightEl.style.display=filled.length?'inline-block':'none';\n      lightEl.classList.toggle('blink',hasIncomplete);\n    }\n\n    /* thead */\n    const thead=document.createElement('div');thead.className='tbl-thead';\n    ['Nhiệm vụ','Giờ','Phút','Giây','','Kết quả'].forEach((txt,ci)=>{\n      const th=document.createElement('div');\n      th.className='th '+['th-task','th-h','th-m','th-s','th-btn','th-res'][ci];\n      th.textContent=txt;thead.appendChild(th);\n    });\n    wrap.appendChild(thead);\n\n    /* data rows */\n    function renderRows(){\n      /* remove old rows */\n      wrap.querySelectorAll('.tbl-row').forEach(r=>r.remove());\n      const foot=wrap.querySelector('.tbl-foot');\n\n      sec.tasks.forEach((t,i)=>{\n        const row=document.createElement('div');row.className='tbl-row';\n\n        const tdTask=document.createElement('div');tdTask.className='td td-task'+(t.done?' done':'');\n        const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;\n        const inp=document.createElement('input');inp.type='text';inp.className='fi';inp.placeholder=`Nhiệm vụ ${i+1}`;inp.value=t.text;\n        cb.addEventListener('change',()=>{sec.tasks[i].done=cb.checked;tdTask.classList.toggle('done',cb.checked);persist();renderHdr();refreshSummary();refreshLight();updateStats();});\n        inp.addEventListener('input',()=>{sec.tasks[i].text=inp.value;persist();renderHdr();refreshSummary();refreshEst();refreshLight();refreshDayEst();updateStats();});\n        tdTask.appendChild(cb);tdTask.appendChild(inp);\n\n        const[tdH,tdM,tdS,tdBtn]=makeTimerCells(sec,sIdx,i);\n\n        const tdRes=document.createElement('div');tdRes.className='td td-res';\n        const ri=document.createElement('input');ri.type='text';ri.className='fi';ri.placeholder=`Kết quả ${i+1}`;ri.value=sec.results[i]||'';\n        ri.addEventListener('input',()=>{sec.results[i]=ri.value;persist();});\n        tdRes.appendChild(ri);\n\n        row.appendChild(tdTask);row.appendChild(tdH);row.appendChild(tdM);row.appendChild(tdS);row.appendChild(tdBtn);row.appendChild(tdRes);\n        wrap.insertBefore(row,foot);\n      });\n    }\n\n    /* foot */\n    const foot=document.createElement('div');foot.className='tbl-foot tbl-cols';\n    const fcs=['td-task','td-h','td-m','td-s','td-btn','td-res'].map(c=>{const el=document.createElement('div');el.className='td '+c;return el;});\n    const addBtn=document.createElement('button');addBtn.className='add-row-btn';addBtn.textContent='+ Thêm hàng';\n    addBtn.addEventListener('click',()=>{\n      sec.tasks.push({text:'',done:false});sec.results.push('');sec.timers.push(0);\n      persist();renderRows();renderHdr();refreshEst();refreshLight();refreshDayEst();updateStats();\n    });\n    fcs[0].appendChild(addBtn);fcs.forEach(fc=>foot.appendChild(fc));\n    wrap.appendChild(foot);\n\n    renderRows();\n    refreshEst();\n    refreshLight();\n    return wrap;\n  }\n\n  function renderBody(){\n    body.innerHTML='';\n    Object.keys(IV).forEach(k=>{if(k.startsWith(dk+'_')){clearInterval(IV[k]);delete IV[k];}});\n\n    /* 3 section tables */\n    SECTIONS.forEach((meta,sIdx)=>{\n      while(data.sections[sIdx].timers.length\u003cdata.sections[sIdx].tasks.length)data.sections[sIdx].timers.push(0);\n      body.appendChild(buildSectionTable(data.sections[sIdx],sIdx,meta));\n    });\n\n    /* summary */\n    const sum=document.createElement('div');sum.className='day-summary';\n    const pct=calcPct(data);\n    const secs=totalLiveSecs(data,dk);\n    const hms=secsToHMS(secs);\n    let done=0,total=0;\n    data.sections.forEach(sec=>sec.tasks.forEach(t=>{if(t.text.trim()){total++;if(t.done)done++;}}));\n\n    const s1el=document.createElement('div');s1el.className='sum-item';\n    s1el.innerHTML=`\u003cdiv class=\"sum-label\">Hoàn thành\u003c/div>\n      \u003cdiv class=\"sum-val\" id=\"sv_pct_${dk}\">${pct!==null?pct+'%':'—'}\u003c/div>\n      \u003cdiv class=\"sum-sub\" id=\"sv_pct_sub_${dk}\">${total?`${done} / ${total} nhiệm vụ`:'Chưa có nhiệm vụ'}\u003c/div>`;\n\n    const s2el=document.createElement('div');s2el.className='sum-item';\n    s2el.innerHTML=`\u003cdiv class=\"sum-label\">Thời gian học\u003c/div>\n      \u003cdiv class=\"sum-val gr\" id=\"sv_time_${dk}\">${secs?`${pad(hms.h)}:${pad(hms.m)}:${pad(hms.s)}`:'—'}\u003c/div>\n      \u003cdiv class=\"sum-sub\" id=\"sv_time_sub_${dk}\">${secs?fmtStudyFull(secs):'Chưa bấm giờ'}\u003c/div>`;\n\n    const s3el=document.createElement('div');s3el.className='sum-item';\n    s3el.innerHTML=`\u003cdiv class=\"sum-label\">Điểm ngày\u003c/div>\n      \u003cdiv class=\"score-wrap\">\n        \u003cinput class=\"score-input\" type=\"number\" min=\"0\" max=\"10\" step=\"0.1\" placeholder=\"—\" value=\"${data.score||''}\">\n        \u003cspan style=\"font-size:14px;color:var(--t2)\">/ 10\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"sum-sub\">Tự đánh giá\u003c/div>`;\n    s3el.querySelector('.score-input').addEventListener('input',function(){data.score=this.value;persist();updateStats();});\n\n    const s4el=document.createElement('div');s4el.className='sum-item';\n    s4el.innerHTML=`\u003cdiv class=\"sum-label\">Thời gian cần dành\u003c/div>\n      \u003cdiv class=\"sum-val gr\" id=\"sv_est_${dk}\">${fmtMinutes(dayEstMinutes(data))}\u003c/div>\n      \u003cdiv class=\"sum-sub\">Dự kiến theo nhiệm vụ\u003c/div>`;\n\n    const countsForGift=dayCountsForGift(d);\n    const gearn=dayGiftEarned(data,d);\n    const gpen=dayGiftPenalty(data,d);\n\n    const s5el=document.createElement('div');s5el.className='sum-item';\n    s5el.innerHTML=`\u003cdiv class=\"sum-label\">Tiết kiệm được\u003c/div>\n      \u003cdiv class=\"sum-val gr\" id=\"sv_gearn_${dk}\">${countsForGift?fmtVnd(gearn):'—'}\u003c/div>\n      \u003cdiv class=\"sum-sub\" id=\"sv_gearn_sub_${dk}\">${countsForGift?'Nhiệm vụ đã hoàn thành':'Trước 11/10 không tính'}\u003c/div>`;\n\n    const s6el=document.createElement('div');s6el.className='sum-item';\n    s6el.innerHTML=`\u003cdiv class=\"sum-label\">Bị trừ\u003c/div>\n      \u003cdiv class=\"sum-val\" id=\"sv_gpen_${dk}\" style=\"color:#c0392b\">${countsForGift?fmtVnd(gpen):'—'}\u003c/div>\n      \u003cdiv class=\"sum-sub\" id=\"sv_gpen_sub_${dk}\">${countsForGift?'Nhiệm vụ chưa hoàn thành':'Trước 11/10 không tính'}\u003c/div>`;\n\n    sum.appendChild(s1el);sum.appendChild(s2el);sum.appendChild(s3el);sum.appendChild(s4el);sum.appendChild(s5el);sum.appendChild(s6el);\n    body.appendChild(sum);\n\n    /* note */\n    const nw=document.createElement('div');\n    nw.innerHTML='\u003cdiv class=\"note-label\">Ghi chú / cảm xúc hôm nay\u003c/div>';\n    const ta=document.createElement('textarea');ta.className='day-note';\n    ta.placeholder='Viết gì đó về ngày hôm nay...';ta.value=data.note||'';\n    ta.addEventListener('input',()=>{data.note=ta.value;persist();});\n    nw.appendChild(ta);body.appendChild(nw);\n  }\n\n  hdr.addEventListener('click',()=>{\n    body.classList.toggle('open');\n    const tog=document.getElementById('tog_'+dk);\n    if(tog)tog.textContent=body.classList.contains('open')?'▲':'▼';\n  });\n\n  renderHdr();renderBody();block.appendChild(body);\n  return block;\n}\n\n/* ── INIT ── */\n(async function main(){\n  await nkPreload();\n  buildOverview();\n  const list=document.getElementById('daysList');\n  DAYS.forEach(d=>list.appendChild(buildDayBlock(d)));\n  updateStats();\n  setInterval(updateStats,1000);\n  setInterval(()=>buildOverview(),60000);\n\n  window.dispatchEvent(new Event('nkReady'));\n})();\n\nwindow.addEventListener('nkReady',()=>{\n  const today=new Date();today.setHours(0,0,0,0);\n  if(today.getFullYear()===2026){\n    const el=document.getElementById('block_'+dayKey(today));\n    if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),300);\n  }\n  checkYearEnd();\n});\n\n/* ── YEAR-END BANNER + PDF MODAL ── */\nfunction checkYearEnd(){\n  const today=new Date();today.setHours(0,0,0,0);\n  const dec29=new Date(2026,11,29); /* 29/12/2026 */\n  const jan1=new Date(2027,0,1);\n  if(today\u003cdec29||today>=jan1)return;\n\n  /* banner already shown? */\n  if(document.getElementById('yearEndBanner'))return;\n\n  const daysLeft=Math.ceil((jan1-today)/86400000);\n  const banner=document.createElement('div');\n  banner.id='yearEndBanner';\n  banner.style.cssText=`\n    position:fixed;bottom:24px;right:24px;z-index:9999;\n    background:linear-gradient(135deg,#fbeaf0,#e6f1fb);\n    border:1.5px solid #f4a7c3;border-radius:16px;\n    padding:18px 22px;max-width:320px;\n    box-shadow:0 8px 32px rgba(212,83,126,.18);\n    font-family:'Be Vietnam Pro',sans-serif;\n    animation:slideUp .4s ease;\n  `;\n  banner.innerHTML=`\n    \u003cstyle>@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}\u003c/style>\n    \u003cdiv style=\"display:flex;align-items:flex-start;gap:10px\">\n      \u003cspan style=\"font-size:28px;line-height:1\">🎊\u003c/span>\n      \u003cdiv>\n        \u003cdiv style=\"font-size:14px;font-weight:600;color:#993556;margin-bottom:4px\">Sắp kết thúc năm 2026!\u003c/div>\n        \u003cdiv style=\"font-size:12px;color:#6b6b68;line-height:1.5\">Còn \u003cstrong style=\"color:#d4537e\">${daysLeft} ngày\u003c/strong> nữa là hết năm.\u003cbr>Bạn có muốn lưu toàn bộ nhật kí thành file PDF không?\u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:12px\">\n          \u003cbutton id=\"btnSavePdf\" style=\"flex:1;padding:7px 12px;background:#d4537e;color:#fff;border:none;border-radius:8px;font-size:13px;font-family:'Be Vietnam Pro',sans-serif;font-weight:600;cursor:pointer;transition:background .15s\">📄 Lưu PDF\u003c/button>\n          \u003cbutton id=\"btnDismiss\" style=\"padding:7px 12px;background:transparent;color:#6b6b68;border:1px solid #f4c0d1;border-radius:8px;font-size:12px;font-family:'Be Vietnam Pro',sans-serif;cursor:pointer\">Để sau\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n  document.body.appendChild(banner);\n\n  document.getElementById('btnDismiss').addEventListener('click',()=>banner.remove());\n  document.getElementById('btnSavePdf').addEventListener('click',()=>{banner.remove();showPdfModal();});\n}\n\nfunction showPdfModal(){\n  const overlay=document.createElement('div');\n  overlay.id='pdfOverlay';\n  overlay.style.cssText=`position:fixed;inset:0;background:rgba(44,44,42,.45);z-index:10000;display:flex;align-items:center;justify-content:center;font-family:'Be Vietnam Pro',sans-serif`;\n\n  overlay.innerHTML=`\n    \u003cdiv id=\"pdfBox\" style=\"background:#fff;border-radius:18px;padding:32px 28px;max-width:420px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.18);text-align:center\">\n      \u003cdiv style=\"font-size:40px;margin-bottom:12px\">📔\u003c/div>\n      \u003cdiv style=\"font-size:18px;font-weight:600;color:#993556;margin-bottom:8px\">Tải Nhật kí 2026\u003c/div>\n      \u003cdiv style=\"font-size:13px;color:#6b6b68;line-height:1.6;margin-bottom:6px\">\n        Bấm \u003cstrong>Tải PDF\u003c/strong> để tải file \u003ccode>nhat-ki-2026-huyen.pdf\u003c/code> về máy.\u003cbr>\n        File gồm toàn bộ 365 ngày, trình bày sạch gọn.\n      \u003c/div>\n      \u003cdiv style=\"font-size:12px;color:#b06080;margin-bottom:20px\">⏳ Quá trình tạo file có thể mất 10–30 giây.\u003c/div>\n\n      \u003c!-- progress bar (hidden until export starts) -->\n      \u003cdiv id=\"pdfProgressWrap\" style=\"display:none;margin-bottom:18px\">\n        \u003cdiv style=\"font-size:12px;color:#6b6b68;margin-bottom:6px\" id=\"pdfProgressLabel\">Đang chuẩn bị…\u003c/div>\n        \u003cdiv style=\"background:#f4c0d1;border-radius:20px;height:8px;overflow:hidden\">\n          \u003cdiv id=\"pdfProgressBar\" style=\"background:#d4537e;height:8px;width:0%;border-radius:20px;transition:width .3s\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"pdfBtns\" style=\"display:flex;gap:10px;justify-content:center\">\n        \u003cbutton id=\"btnConfirmPdf\" style=\"padding:10px 24px;background:#d4537e;color:#fff;border:none;border-radius:10px;font-size:14px;font-family:'Be Vietnam Pro',sans-serif;font-weight:600;cursor:pointer\">📥 Tải PDF\u003c/button>\n        \u003cbutton id=\"btnCancelPdf\" style=\"padding:10px 18px;background:transparent;color:#6b6b68;border:1px solid #ddd;border-radius:10px;font-size:13px;font-family:'Be Vietnam Pro',sans-serif;cursor:pointer\">Huỷ\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `;\n  document.body.appendChild(overlay);\n\n  document.getElementById('btnCancelPdf').addEventListener('click',()=>overlay.remove());\n\n  document.getElementById('btnConfirmPdf').addEventListener('click',async()=>{\n    /* show progress */\n    document.getElementById('pdfBtns').style.display='none';\n    document.getElementById('pdfProgressWrap').style.display='block';\n    const setProgress=(pct,label)=>{\n      document.getElementById('pdfProgressBar').style.width=pct+'%';\n      document.getElementById('pdfProgressLabel').textContent=label;\n    };\n\n    setProgress(5,'Đang tải thư viện…');\n\n    /* load jsPDF + html2canvas from CDN */\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');\n\n    setProgress(15,'Đang mở tất cả các ngày…');\n    await sleep(100);\n\n    /* open all bodies, hide UI chrome */\n    document.querySelectorAll('.day-body').forEach(b=>b.classList.add('open'));\n    document.querySelectorAll('.tbtn,.add-row-btn,.td-btn,.th-btn,#yearEndBanner').forEach(el=>el.style.display='none');\n    document.querySelector('.overview-row').style.display='none';\n    await sleep(400); /* let DOM reflow */\n\n    setProgress(30,'Đang chụp nội dung (có thể mất lúc)…');\n\n    const {jsPDF}=window.jspdf;\n    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});\n    const pageW=210,pageH=297,margin=10;\n    const contentW=pageW-margin*2;\n\n    /* capture app div */\n    const appEl=document.getElementById('app');\n    let canvas;\n    try{\n      canvas=await html2canvas(appEl,{\n        scale:1.5,\n        useCORS:true,\n        backgroundColor:'#fdf4f8',\n        logging:false,\n        onclone:(doc)=>{\n          /* in cloned doc hide buttons too */\n          doc.querySelectorAll('.tbtn,.add-row-btn,.td-btn,.th-btn').forEach(e=>e.style.display='none');\n        }\n      });\n    }catch(e){\n      setProgress(100,'Lỗi khi chụp nội dung. Vui lòng thử lại.');\n      restoreUI();return;\n    }\n\n    setProgress(80,'Đang tạo file PDF…');\n    await sleep(100);\n\n    const imgData=canvas.toDataURL('image/jpeg',0.85);\n    const imgH=(canvas.height/canvas.width)*contentW; /* actual height in mm */\n    let yOffset=0;\n    let firstPage=true;\n\n    while(yOffset\u003cimgH){\n      if(!firstPage)pdf.addPage();\n      firstPage=false;\n      const sliceH=Math.min(pageH-margin*2, imgH-yOffset);\n      /* srcY and srcH in pixels */\n      const scale=canvas.width/contentW;\n      pdf.addImage(\n        imgData,'JPEG',\n        margin, margin,\n        contentW, sliceH,\n        '','FAST',\n        0,\n        -(yOffset) /* shift image up by yOffset mm */\n      );\n      /* clip: re-add with correct source slice */\n      yOffset+=pageH-margin*2;\n    }\n\n    /* better approach: slice canvas per page */\n    /* redo with proper slicing */\n    const pdf2=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});\n    const pxPerMm=canvas.width/contentW;\n    const pageHpx=(pageH-margin*2)*pxPerMm;\n    let py=0;let pg=0;\n    while(py\u003ccanvas.height){\n      if(pg>0)pdf2.addPage();\n      const sliceCanvas=document.createElement('canvas');\n      sliceCanvas.width=canvas.width;\n      sliceCanvas.height=Math.min(pageHpx,canvas.height-py);\n      const ctx=sliceCanvas.getContext('2d');\n      ctx.drawImage(canvas,0,py,canvas.width,sliceCanvas.height,0,0,canvas.width,sliceCanvas.height);\n      const sliceImg=sliceCanvas.toDataURL('image/jpeg',0.88);\n      const sliceHmm=sliceCanvas.height/pxPerMm;\n      pdf2.addImage(sliceImg,'JPEG',margin,margin,contentW,sliceHmm);\n      py+=pageHpx;pg++;\n    }\n\n    setProgress(97,'Đang lưu file…');\n    await sleep(100);\n    pdf2.save('nhat-ki-2026-huyen.pdf');\n\n    setProgress(100,'✅ Đã tải xong!');\n    restoreUI();\n    setTimeout(()=>overlay.remove(),1500);\n  });\n\n  function restoreUI(){\n    document.querySelectorAll('.tbtn,.add-row-btn,.td-btn,.th-btn').forEach(el=>el.style.display='');\n    document.querySelector('.overview-row').style.display='';\n    /* close all bodies except today */\n    const today=new Date();today.setHours(0,0,0,0);\n    document.querySelectorAll('.day-body').forEach(b=>{\n      const block=b.closest('.day-block');\n      if(block&&!block.classList.contains('today-hl'))b.classList.remove('open');\n    });\n  }\n}\n\n/* ── GIFT MODAL ── */\nfunction showGiftModal(){\n  const gd=loadGiftData();\n  if(allGiftsDone(gd)){ /* đủ 5 gift rồi -> làm mới để điền gift mới, tiền thừa vẫn giữ (spent đã trừ) */\n    gd.items=[0,1,2,3,4].map(()=>({name:'',target:'',active:false,done:false}));\n  }\n  settleGifts(gd);saveGiftData(gd);\n  const overlay=document.createElement('div');\n  overlay.id='giftOverlay';\n  overlay.style.cssText=`position:fixed;inset:0;background:rgba(44,44,42,.45);z-index:10000;display:flex;align-items:center;justify-content:center;font-family:'Be Vietnam Pro',sans-serif;padding:16px`;\n\n  overlay.innerHTML=`\n    \u003cdiv id=\"giftBox\" style=\"background:#fff;border-radius:18px;padding:26px 22px;max-width:600px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.18);max-height:88vh;overflow:auto\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px\">\n        \u003cdiv style=\"font-size:18px;font-weight:600;color:#993556\">🎁 Quà tặng\u003c/div>\n        \u003cbutton id=\"giftCloseX\" style=\"background:none;border:none;font-size:18px;color:#6b6b68;cursor:pointer;line-height:1\">✕\u003c/button>\n      \u003c/div>\n      \u003cdiv style=\"font-size:12px;color:#6b6b68;margin-bottom:16px\">Hoàn thành nhiệm vụ trong ngày để tiết kiệm tiền mua quà. Bỏ lỡ nhiệm vụ sẽ bị trừ tiền.\u003c/div>\n      \u003cdiv id=\"giftTableWrap\">\u003c/div>\n      \u003cdiv style=\"margin-top:18px;display:flex;justify-content:flex-end\">\n        \u003cbutton id=\"giftCloseBtn\" style=\"padding:9px 20px;background:#d4537e;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif\">Xong\u003c/button>\n      \u003c/div>\n    \u003c/div>`;\n  document.body.appendChild(overlay);\n\n  function renderGiftTable(){\n    const wrap=document.getElementById('giftTableWrap');\n    const {pool}=computeGiftTotals();\n    const currents=computeGiftAllocations(gd,pool);\n    let html=`\u003cdiv style=\"display:grid;grid-template-columns:1.8fr 1.2fr 1.2fr .6fr;gap:8px 8px;align-items:center\">\n      \u003cdiv style=\"font-size:10px;font-weight:600;color:#993556;text-transform:uppercase;letter-spacing:.4px\">Quà\u003c/div>\n      \u003cdiv style=\"font-size:10px;font-weight:600;color:#993556;text-transform:uppercase;letter-spacing:.4px\">Cần góp\u003c/div>\n      \u003cdiv style=\"font-size:10px;font-weight:600;color:#993556;text-transform:uppercase;letter-spacing:.4px\">Hiện tại\u003c/div>\n      \u003cdiv style=\"font-size:10px;font-weight:600;color:#993556;text-transform:uppercase;letter-spacing:.4px;text-align:center\">Đang góp\u003c/div>`;\n    gd.items.forEach((it,idx)=>{\n      const cur=currents[idx];\n      const target=(+it.target)||0;\n      const reached=it.done||(target>0&&cur>=target);\n      const dis=it.done?'disabled':'';\n      const strike=it.done?';text-decoration:line-through;opacity:.6':'';\n      html+=`\n        \u003cinput class=\"fi gift-name\" data-idx=\"${idx}\" type=\"text\" placeholder=\"Tên quà ${idx+1}\" value=\"${(it.name||'').replace(/\"/g,'&quot;')}\" ${dis} style=\"border-color:#f4c0d1${strike}\">\n        \u003cinput class=\"fi gift-target\" data-idx=\"${idx}\" type=\"number\" min=\"0\" step=\"1000\" placeholder=\"0\" value=\"${it.target||''}\" ${dis} style=\"border-color:#f4c0d1${strike}\">\n        \u003cdiv style=\"font-size:13px;font-weight:600;color:${reached?'#3b6d11':cur>0?'#185fa5':'#6b6b68'}${strike}\">${fmtVnd(cur)}\u003c/div>\n        \u003cdiv style=\"display:flex;justify-content:center\">\u003cinput class=\"gift-active\" data-idx=\"${idx}\" type=\"checkbox\" ${(it.active||it.done)?'checked':''} ${dis} title=\"Mục cần tiết kiệm hiện tại\">\u003c/div>`;\n    });\n    html+='\u003c/div>';\n    wrap.innerHTML=html;\n\n    wrap.querySelectorAll('.gift-name').forEach(el=>el.addEventListener('input',function(){\n      gd.items[+this.dataset.idx].name=this.value;saveGiftData(gd);\n    }));\n    wrap.querySelectorAll('.gift-target').forEach(el=>el.addEventListener('input',function(){\n      gd.items[+this.dataset.idx].target=this.value;settleGifts(gd);saveGiftData(gd);renderGiftTable();\n    }));\n    wrap.querySelectorAll('.gift-active').forEach(el=>el.addEventListener('change',function(){\n      gd.items[+this.dataset.idx].active=this.checked;settleGifts(gd);saveGiftData(gd);renderGiftTable();\n    }));\n  }\n  renderGiftTable();\n\n  document.getElementById('giftCloseX').addEventListener('click',()=>overlay.remove());\n  document.getElementById('giftCloseBtn').addEventListener('click',()=>overlay.remove());\n  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});\n}\ndocument.getElementById('giftBtn').addEventListener('click',showGiftModal);\n\nfunction loadScript(src){\n  return new Promise((res,rej)=>{\n    if(document.querySelector(`script[src=\"${src}\"]`)){res();return;}\n    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;\n    document.head.appendChild(s);\n  });\n}\nfunction sleep(ms){return new Promise(r=>setTimeout(r,ms))}\n\n\u003c/script>\n\n\u003cscript>\n\n/* ══════════════════════════════════════════════════════════════\n   ĐỒNG BỘ GIỮA \"HÀNG NGÀY\" VÀ \"NHẬT KÝ\" (chỉ đồng bộ, không đổi\n   chức năng gốc của 2 phần):\n\n   1) Gõ tên nhiệm vụ vào mục 30 phút / 1 tiếng bên NHẬT KÝ (ngày\n      hôm nay) → tự điền tên đó vào to-do list 30 phút / 1 tiếng\n      bên HÀNG NGÀY. (Mục 5 phút bên Nhật ký giữ nguyên, không sync.)\n   2) Tích bắt đầu đếm ngược (5p / 10p) một dòng trong to-do list\n      bên HÀNG NGÀY → đồng thời chạy đồng hồ đếm giờ của nhiệm vụ\n      tương ứng bên NHẬT KÝ (mục 30 phút / 1 tiếng, hôm nay); dừng\n      lại khi nhiệm vụ hoàn thành / bị xoá bên Hàng ngày.\n   ══════════════════════════════════════════════════════════════ */\n(function(){\n\n  function ready(fn){\n    if(document.readyState==='loading'){\n      document.addEventListener('DOMContentLoaded',fn);\n    }else{\n      fn();\n    }\n  }\n\n  /* map: loại nhiệm vụ Hàng ngày (30/60) ↔ section index bên Nhật ký\n     (0 = 5 phút — không sync, 1 = 30 phút, 2 = 1 tiếng) */\n  function hngTypeToSectionIdx(type){ return type===30 ? 1 : 2; }\n\n  function nkToday(){\n    const d=new Date(); d.setHours(0,0,0,0);\n    return d;\n  }\n\n  /* ── (1) NHẬT KÝ (hôm nay, mục 30p/1 tiếng) → HÀNG NGÀY ── */\n  function syncNhatKyToHangNgay(){\n    if(typeof loadDay!=='function'||typeof ensureData!=='function') return;\n    if(typeof todoTasks==='undefined'||typeof makeEmptyTask!=='function') return;\n\n    const today=nkToday();\n    const raw=loadDay(today);\n    if(!raw) return; // chưa có dữ liệu Nhật ký hôm nay -> không có gì để sync\n    const data=ensureData(raw);\n\n    const map=[{sIdx:1,type:30},{sIdx:2,type:60}];\n    let changed=false;\n\n    map.forEach(({sIdx,type})=>{\n      const tasks=(data.sections&&data.sections[sIdx]&&data.sections[sIdx].tasks)||[];\n      tasks.forEach((t,i)=>{\n        const text=(t.text||'').trim();\n        if(!text) return;\n        while(todoTasks[type].length\u003c=i) todoTasks[type].push(makeEmptyTask());\n        if(todoTasks[type][i].text!==t.text){\n          todoTasks[type][i].text=t.text;\n          changed=true;\n        }\n      });\n    });\n\n    if(changed){\n      saveTodoTasksToStorage();\n      renderTodoTasks(30);\n      renderTodoTasks(60);\n      updateCompletionRate();\n    }\n  }\n\n  /* theo dõi thay đổi ô nhập tên nhiệm vụ (mục 30p / 1 tiếng, ngày hôm nay) bên Nhật ký */\n  function watchNhatKyTaskInputs(){\n    const list=document.getElementById('daysList');\n    if(!list) return;\n    list.addEventListener('input',function(e){\n      const inp=e.target;\n      if(!inp.classList || !inp.classList.contains('fi')) return;\n      if(!inp.closest('.td-task')) return; // chỉ ô tên nhiệm vụ, không phải ô kết quả\n      const wrap=inp.closest('.section-wrap');\n      if(!wrap || !(wrap.classList.contains('s2')||wrap.classList.contains('s3'))) return; // chỉ 30p/1 tiếng\n      const block=inp.closest('.day-block');\n      if(!block || !block.classList.contains('today-hl')) return; // chỉ ngày hôm nay\n      syncNhatKyToHangNgay();\n    });\n  }\n\n  /* tích hoàn thành nhiệm vụ (30p / 1 tiếng, hôm nay) bên Nhật ký → đánh dấu xong bên Hàng ngày + cập nhật biểu đồ % */\n  function watchNhatKyDoneChecks(){\n    const list=document.getElementById('daysList');\n    if(!list) return;\n    list.addEventListener('change',function(e){\n      const cb=e.target;\n      if(!cb||cb.type!=='checkbox') return;\n      const cell=cb.closest('.td-task');\n      if(!cell) return;\n      const wrap=cb.closest('.section-wrap');\n      if(!wrap) return;\n      const type=wrap.classList.contains('s2')?30:(wrap.classList.contains('s3')?60:0);\n      if(!type) return;\n      const block=cb.closest('.day-block');\n      if(!block||!block.classList.contains('today-hl')) return;\n      const rows=Array.from(wrap.querySelectorAll('.tbl-row'));\n      const idx=rows.indexOf(cell.closest('.tbl-row'));\n      if(idx\u003c0) return;\n      if(typeof todoTasks==='undefined'||typeof makeEmptyTask!=='function') return;\n      while(todoTasks[type].length\u003c=idx) todoTasks[type].push(makeEmptyTask());\n      const t=todoTasks[type][idx];\n      const name=(cell.querySelector('input[type=text]')||{}).value||'';\n      if(!t.text&&name) t.text=name;\n      t.completed=cb.checked;\n      saveTodoTasksToStorage();\n      renderTodoTasks(type);\n      updateCompletionRate();\n      saveTodoHistory();\n    });\n  }\n\n  /* ── (2) HÀNG NGÀY (tích đếm ngược) → NHẬT KÝ (đồng hồ đếm giờ) ── */\n  function nkEnsureTaskSlot(data,sIdx,idx,fallbackText){\n    const sec=data.sections[sIdx];\n    while(sec.tasks.length\u003c=idx) sec.tasks.push({text:'',done:false});\n    while(sec.results.length\u003c=idx) sec.results.push('');\n    while(sec.timers.length\u003c=idx) sec.timers.push(0);\n    if(!sec.tasks[idx].text && fallbackText) sec.tasks[idx].text=fallbackText;\n  }\n\n  function nkRerenderToday(dk,today){\n    if(typeof buildDayBlock!=='function') return;\n    const old=document.getElementById('block_'+dk);\n    if(old) old.replaceWith(buildDayBlock(today));\n  }\n\n  function nkStartTimerFor(type,taskIdx){\n    if(typeof loadDay!=='function'||typeof dayKey!=='function'||typeof tsKey!=='function') return;\n    const today=nkToday();\n    const dk=dayKey(today);\n    const sIdx=hngTypeToSectionIdx(type);\n    const data=ensureData(loadDay(today));\n    const fallbackText=(todoTasks[type][taskIdx]&&todoTasks[type][taskIdx].text)||'';\n    nkEnsureTaskSlot(data,sIdx,taskIdx,fallbackText);\n    saveDay(today,data);\n\n    const key=tsKey(dk,sIdx,taskIdx);\n    if(!localStorage.getItem(key)){\n      localStorage.setItem(key,Date.now().toString());\n    }\n    nkRerenderToday(dk,today);\n  }\n\n  function nkStopTimerFor(type,taskIdx){\n    if(typeof loadDay!=='function'||typeof dayKey!=='function'||typeof tsKey!=='function') return;\n    const today=nkToday();\n    const dk=dayKey(today);\n    const sIdx=hngTypeToSectionIdx(type);\n    const key=tsKey(dk,sIdx,taskIdx);\n    const ts=localStorage.getItem(key);\n    if(!ts) return; // hiện không chạy -> không cần làm gì\n\n    const data=ensureData(loadDay(today));\n    nkEnsureTaskSlot(data,sIdx,taskIdx,'');\n    const elapsed=Math.floor((Date.now()-parseInt(ts,10))/1000);\n    if(elapsed>0) data.sections[sIdx].timers[taskIdx]=(data.sections[sIdx].timers[taskIdx]||0)+elapsed;\n    localStorage.removeItem(key);\n    saveDay(today,data);\n    nkRerenderToday(dk,today);\n  }\n\n  function hookHangNgayTimers(){\n    if(typeof startTodoTaskElapsed!=='function'||typeof stopTodoTaskElapsed!=='function') return;\n\n    const origStart=startTodoTaskElapsed;\n    startTodoTaskElapsed=function(type,taskIdx){\n      origStart(type,taskIdx);\n      nkStartTimerFor(type,taskIdx);\n    };\n\n    const origStop=stopTodoTaskElapsed;\n    stopTodoTaskElapsed=function(type,taskIdx){\n      origStop(type,taskIdx);\n      nkStopTimerFor(type,taskIdx);\n    };\n  }\n\n  /* ── TAB SWITCHING ── */\n  function initTabs(){\n    const btns=document.querySelectorAll('.tab-btn');\n    const pages=document.querySelectorAll('.tab-page');\n    btns.forEach(btn=>{\n      btn.addEventListener('click',()=>{\n        const target=btn.dataset.tab;\n        btns.forEach(b=>b.classList.toggle('active',b===btn));\n        pages.forEach(p=>p.classList.toggle('active',p.id==='page-'+target));\n      });\n    });\n  }\n\n  ready(function(){\n    initTabs();\n    hookHangNgayTimers();\n    watchNhatKyTaskInputs();\n    watchNhatKyDoneChecks();\n    // đồng bộ 1 lần khi mở trang, chờ cả 2 phần tải xong dữ liệu (IndexedDB)\n    let tries=0;\n    const iv=setInterval(function(){\n      tries++;\n      if(typeof todoTasks!=='undefined' && typeof loadDay==='function'){\n        syncNhatKyToHangNgay();\n        clearInterval(iv);\n      }else if(tries>50){\n        clearInterval(iv);\n      }\n    },100);\n  });\n\n})();\n\n\u003c/script>\n\n\u003cstyle>\n/* ── PRINT fallback styles (not used for PDF but kept for Ctrl+P) ── */\n@media print{\n  body{background:#fff;font-size:11px}\n  header{margin-bottom:8px;padding:14px}\n  .overview-row,.stats-row{display:none!important}\n  .day-block{border:1px solid #eee;margin-bottom:10px;break-inside:avoid;box-shadow:none!important}\n  .day-body{display:flex!important;padding:8px}\n  .day-header{padding:6px 10px;background:#fbeaf0!important}\n  .section-wrap{break-inside:avoid}\n  #yearEndBanner,#pdfOverlay,button{display:none!important}\n  .tbtn,.add-row-btn,.td-btn,.th-btn{display:none!important}\n  @page{margin:15mm 12mm;size:A4}\n}\n\u003c/style>\n\n\u003cscript>window.addEventListener('message',function(e){var t=e.data&&e.data.tab;if(!t)return;var b=document.querySelector('.tab-btn[data-tab=\"'+t+'\"]');if(b)b.click();});\u003c/script>\n\u003c/body>\n\u003c/html>\n", "suynghi": "\u003c!DOCTYPE html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Theo dõi suy nghĩ bản thân hàng ngày\u003c/title>\n\u003cstyle>\n  :root{\n    --bg: #FFF7F9;\n    --bg-card: #FFFFFF;\n    --pink-pale: #FFE4EC;\n    --pink-soft: #FBC7D6;\n    --pink-mid: #F49BB6;\n    --pink-deep: #E06A8F;\n    --ink: #3A2C31;\n    --ink-soft: #8B7480;\n    --line: #F5D9E2;\n    --font-serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Songti SC', serif;\n    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;\n  }\n\n  *{ box-sizing: border-box; }\n\n  body{\n    margin:0;\n    background: radial-gradient(circle at 15% 0%, var(--pink-pale) 0%, var(--bg) 45%);\n    font-family: var(--font-sans);\n    color: var(--ink);\n    min-height:100vh;\n    padding: 32px 16px 64px;\n  }\n\n  .wrap{\n    max-width: 900px;\n    margin: 0 auto;\n  }\n\n  header{\n    text-align:center;\n    margin-bottom: 36px;\n    position:relative;\n  }\n\n  .eyebrow{\n    display:inline-block;\n    font-size: 12px;\n    letter-spacing: .16em;\n    text-transform: uppercase;\n    color: var(--pink-deep);\n    background: var(--pink-pale);\n    padding: 5px 14px;\n    border-radius: 20px;\n    margin-bottom: 14px;\n  }\n\n  h1{\n    font-family: var(--font-serif);\n    font-weight: 600;\n    font-size: clamp(26px, 4.4vw, 38px);\n    margin: 0 0 8px;\n    color: var(--ink);\n    letter-spacing: .01em;\n  }\n\n  .sub{\n    color: var(--ink-soft);\n    font-size: 14.5px;\n    margin: 0;\n  }\n\n  .today-pill{\n    margin-top: 18px;\n    display:inline-flex;\n    align-items:center;\n    gap: 8px;\n    background: var(--bg-card);\n    border: 1px solid var(--line);\n    padding: 8px 16px;\n    border-radius: 999px;\n    font-size: 13.5px;\n    color: var(--pink-deep);\n    box-shadow: 0 2px 8px rgba(224,106,143,.08);\n  }\n  .today-pill .dot{\n    width:7px; height:7px; border-radius:50%;\n    background: var(--pink-mid);\n    display:inline-block;\n  }\n\n  .board{\n    background: var(--bg-card);\n    border-radius: 22px;\n    border: 1px solid var(--line);\n    box-shadow: 0 10px 30px rgba(224,106,143,.09);\n    overflow: hidden;\n  }\n\n  table{\n    width:100%;\n    border-collapse: collapse;\n  }\n\n  thead th{\n    text-align:left;\n    font-size: 12px;\n    letter-spacing: .08em;\n    text-transform: uppercase;\n    color: var(--pink-deep);\n    background: var(--pink-pale);\n    padding: 14px 18px;\n    font-weight: 600;\n  }\n\n  thead th:first-child{ border-top-left-radius: 0; }\n\n  col.col-date{ width: 118px; }\n  col.col-solution{ width: 40%; }\n\n  tbody tr{\n    border-top: 1px solid var(--line);\n  }\n  tbody tr.day-start{\n    border-top: 2px solid var(--pink-soft);\n  }\n\n  tbody td{\n    padding: 12px 18px;\n    vertical-align: top;\n  }\n\n  .date-cell{\n    font-family: var(--font-serif);\n    font-weight: 600;\n    color: var(--pink-deep);\n    font-size: 15px;\n    padding-top: 18px;\n    white-space: nowrap;\n  }\n\n  .cell-inputwrap{\n    position: relative;\n  }\n\n  textarea.field{\n    width:100%;\n    resize: vertical;\n    min-height: 40px;\n    border: 1.5px solid transparent;\n    background: #FFF9FB;\n    border-radius: 12px;\n    padding: 9px 12px;\n    font-family: var(--font-sans);\n    font-size: 16.5px;\n    font-weight: 600;\n    color: var(--ink);\n    line-height: 1.45;\n    transition: border-color .15s ease, background .15s ease;\n  }\n  textarea.field:focus{\n    outline:none;\n    border-color: var(--pink-mid);\n    background: #fff;\n  }\n  textarea.field::placeholder{ color: #C9AFB9; }\n\n  .row-actions{\n    display:flex;\n    align-items: flex-start;\n    justify-content: flex-end;\n    padding-top: 18px;\n    width: 36px;\n  }\n  .del-btn{\n    border:none;\n    background: transparent;\n    color: #D9AEBB;\n    font-size: 18px;\n    line-height:1;\n    cursor:pointer;\n    border-radius: 8px;\n    width: 26px;\n    height: 26px;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    transition: background .15s ease, color .15s ease;\n  }\n  .del-btn:hover{ background: var(--pink-pale); color: var(--pink-deep); }\n\n  .suggest-box{\n    position:absolute;\n    top: calc(100% + 4px);\n    left: 0;\n    right: 0;\n    background: #fff;\n    border: 1px solid var(--pink-soft);\n    border-radius: 12px;\n    box-shadow: 0 8px 20px rgba(224,106,143,.16);\n    z-index: 20;\n    max-height: 220px;\n    overflow-y:auto;\n    display:none;\n  }\n  .suggest-box.open{ display:block; }\n  .suggest-item{\n    padding: 9px 13px;\n    cursor:pointer;\n    border-bottom: 1px solid #FCEEF2;\n  }\n  .suggest-item:last-child{ border-bottom:none; }\n  .suggest-item:hover, .suggest-item.active{\n    background: var(--pink-pale);\n  }\n  .suggest-item .sp{\n    font-size: 13.5px;\n    font-weight:600;\n    color: var(--ink);\n  }\n  .suggest-item .ss{\n    font-size: 12.5px;\n    color: var(--ink-soft);\n    margin-top: 2px;\n    overflow:hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .add-row-wrap{\n    padding: 18px;\n    display:flex;\n    justify-content:center;\n    background: linear-gradient(180deg, transparent, #FFF3F7);\n  }\n\n  .add-btn{\n    border: 1.5px dashed var(--pink-mid);\n    background: #fff;\n    color: var(--pink-deep);\n    font-size: 14px;\n    font-weight: 600;\n    padding: 10px 20px;\n    border-radius: 999px;\n    cursor:pointer;\n    transition: background .15s ease, transform .1s ease;\n  }\n  .add-btn:hover{ background: var(--pink-pale); }\n  .add-btn:active{ transform: scale(.97); }\n\n  .empty-state{\n    text-align:center;\n    padding: 50px 20px;\n    color: var(--ink-soft);\n  }\n\n  .autosave-hint{\n    text-align:center;\n    font-size: 12.5px;\n    color: var(--ink-soft);\n    margin-top: 14px;\n    min-height: 16px;\n    transition: opacity .3s ease;\n  }\n\n  footer{\n    text-align:center;\n    margin-top: 42px;\n  }\n  footer .tagline{\n    font-family: var(--font-serif);\n    font-style: italic;\n    color: var(--pink-deep);\n    font-size: 15px;\n  }\n  footer .leaf{\n    display:block;\n    margin: 0 auto 10px;\n    width: 26px;\n    height: 26px;\n    opacity: .8;\n  }\n\n  @media (max-width: 640px){\n    thead{ display:none; }\n    table, tbody, tr, td{ display:block; width:100%; }\n    tbody tr{\n      border-top: none;\n      border-bottom: 1px solid var(--line);\n      padding: 14px 16px 6px;\n      position: relative;\n    }\n    tbody tr.day-start{\n      border-top: 2px solid var(--pink-soft);\n      margin-top: 6px;\n    }\n    .date-cell{\n      padding: 0 0 8px;\n      font-size: 14px;\n    }\n    tbody td{ padding: 6px 0; }\n    td[data-label]::before{\n      content: attr(data-label);\n      display:block;\n      font-size: 11px;\n      letter-spacing: .07em;\n      text-transform: uppercase;\n      color: var(--pink-deep);\n      margin-bottom: 4px;\n      font-weight: 600;\n    }\n    .row-actions{\n      position:absolute;\n      top: 12px;\n      right: 10px;\n      padding-top:0;\n    }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\n  \u003cheader>\n    \u003cspan class=\"eyebrow\">Nhật ký nội tâm\u003c/span>\n    \u003ch1>Theo dõi suy nghĩ bản thân hàng ngày\u003c/h1>\n    \u003cp class=\"sub\">Ghi lại vấn đề gặp phải và cách bạn đã vượt qua &mdash; để lần sau không phải bắt đầu lại từ đầu.\u003c/p>\n    \u003cdiv class=\"today-pill\">\u003cspan class=\"dot\">\u003c/span>\u003cspan id=\"todayLabel\">\u003c/span>\u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"board\">\n    \u003ctable id=\"mainTable\">\n      \u003ccolgroup>\n        \u003ccol class=\"col-date\">\n        \u003ccol>\n        \u003ccol class=\"col-solution\">\n        \u003ccol style=\"width:36px\">\n      \u003c/colgroup>\n      \u003cthead>\n        \u003ctr>\n          \u003cth>Ngày\u003c/th>\n          \u003cth>Vấn đề gặp phải\u003c/th>\n          \u003cth>Giải pháp\u003c/th>\n          \u003cth>\u003c/th>\n        \u003c/tr>\n      \u003c/thead>\n      \u003ctbody id=\"tbody\">\u003c/tbody>\n    \u003c/table>\n    \u003cdiv class=\"add-row-wrap\">\n      \u003cbutton class=\"add-btn\" id=\"addEntryBtn\">+ Thêm vấn đề trong ngày\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"autosave-hint\" id=\"saveHint\">\u003c/div>\n\n  \u003cfooter>\n    \u003csvg class=\"leaf\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n      \u003cpath d=\"M12 21C12 21 4 16.5 4 9.5C4 5.9 6.9 3 10.5 3C11.9 3 13.2 3.6 14.1 4.6C15 3.6 16.3 3 17.7 3C21.1 3 21.9 6.5 19.5 9.5C16.8 12.9 12 21 12 21Z\" stroke=\"#E06A8F\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>\n    \u003c/svg>\n    \u003cp class=\"tagline\">“Mỗi ngày hiểu bản thân thêm một chút.”\u003c/p>\n  \u003c/footer>\n\n\u003c/div>\n\n\u003cscript>\n(function(){\n  const LS_DAYS = 'suyNghi_days_v1';\n  const LS_KB   = 'suyNghi_kb_v1';\n\n  function pad(n){ return n\u003c10 ? '0'+n : ''+n; }\n  function todayISO(){\n    const d = new Date();\n    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());\n  }\n  function isoToDisplay(iso){\n    const [y,m,d] = iso.split('-');\n    return d + '/' + m + '/' + y;\n  }\n  function normalize(s){\n    return (s||'').trim().toLowerCase().replace(/\\s+/g,' ');\n  }\n  function uid(){\n    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);\n  }\n\n  function loadDays(){\n    try{\n      const raw = localStorage.getItem(LS_DAYS);\n      return raw ? JSON.parse(raw) : [];\n    }catch(e){ return []; }\n  }\n  function saveDays(days){\n    try{\n      localStorage.setItem(LS_DAYS, JSON.stringify(days));\n      flashSaved();\n    }catch(e){\n      console.error('Không thể lưu dữ liệu:', e);\n      showHint('Không lưu được dữ liệu (bộ nhớ trình duyệt đầy?)', true);\n    }\n  }\n  function loadKB(){\n    try{\n      const raw = localStorage.getItem(LS_KB);\n      return raw ? JSON.parse(raw) : {};\n    }catch(e){ return {}; }\n  }\n  function saveKB(kb){\n    try{ localStorage.setItem(LS_KB, JSON.stringify(kb)); }\n    catch(e){ console.error('Không thể lưu kho vấn đề:', e); }\n  }\n\n  let days = loadDays();\n  let kb = loadKB();\n\n  // Xóa các ngày (không phải hôm nay) mà mọi dòng đều trống —\n  // tức là lỡ mở file nhưng không viết gì\n  function isEntryEmpty(entry){\n    return !(entry.problem || '').trim() && !(entry.solution || '').trim();\n  }\n  function cleanupEmptyDays(){\n    const iso = todayISO();\n    const before = days.length;\n    days = days.filter(day => day.date === iso || !day.entries.every(isEntryEmpty));\n    if(days.length !== before) saveDays(days);\n  }\n  cleanupEmptyDays();\n\n  // Đảm bảo có hàng cho ngày hôm nay, không tạo trùng\n  function ensureToday(){\n    const iso = todayISO();\n    const last = days[days.length-1];\n    if(!last || last.date !== iso){\n      days.push({ id: uid(), date: iso, entries: [{ id: uid(), problem:'', solution:'' }] });\n      saveDays(days);\n    }\n  }\n  ensureToday();\n\n  document.getElementById('todayLabel').textContent = 'Hôm nay: ' + isoToDisplay(todayISO());\n\n  const tbody = document.getElementById('tbody');\n  let saveTimer = null;\n\n  function showHint(text, isError){\n    const el = document.getElementById('saveHint');\n    el.textContent = text;\n    el.style.color = isError ? '#C24B6E' : '';\n  }\n  function flashSaved(){\n    showHint('Đã lưu ✓');\n    clearTimeout(showHint._t);\n    showHint._t = setTimeout(()=>{ showHint(''); }, 1200);\n  }\n\n  function debouncedSave(){\n    clearTimeout(saveTimer);\n    saveTimer = setTimeout(()=> saveDays(days), 350);\n  }\n\n  function updateKB(problemText, solutionText){\n    const key = normalize(problemText);\n    if(!key) return;\n    kb[key] = { display: problemText.trim(), solution: solutionText };\n    saveKB(kb);\n  }\n\n  function findSuggestions(query){\n    const q = normalize(query);\n    if(!q) return [];\n    const entries = Object.keys(kb).map(k => ({ key:k, ...kb[k] }));\n    return entries\n      .filter(e => e.key.includes(q))\n      .sort((a,b)=> a.key.indexOf(q) - b.key.indexOf(q))\n      .slice(0, 6);\n  }\n\n  function autoResize(ta){\n    ta.style.height = 'auto';\n    ta.style.height = (ta.scrollHeight) + 'px';\n  }\n\n  function render(){\n    tbody.innerHTML = '';\n    days.forEach(day => {\n      day.entries.forEach((entry, idx) => {\n        const tr = document.createElement('tr');\n        if(idx === 0) tr.classList.add('day-start');\n\n        // Date cell\n        const tdDate = document.createElement('td');\n        tdDate.className = 'date-cell';\n        tdDate.textContent = idx === 0 ? isoToDisplay(day.date) : '';\n        tr.appendChild(tdDate);\n\n        // Problem cell\n        const tdProblem = document.createElement('td');\n        tdProblem.dataset.label = 'Vấn đề gặp phải';\n        const problemWrap = document.createElement('div');\n        problemWrap.className = 'cell-inputwrap';\n        const taProblem = document.createElement('textarea');\n        taProblem.className = 'field';\n        taProblem.rows = 1;\n        taProblem.placeholder = 'Hôm nay bạn gặp vấn đề gì?';\n        taProblem.value = entry.problem || '';\n        problemWrap.appendChild(taProblem);\n\n        const suggestBox = document.createElement('div');\n        suggestBox.className = 'suggest-box';\n        problemWrap.appendChild(suggestBox);\n        tdProblem.appendChild(problemWrap);\n        tr.appendChild(tdProblem);\n\n        // Solution cell\n        const tdSolution = document.createElement('td');\n        tdSolution.dataset.label = 'Giải pháp';\n        const taSolution = document.createElement('textarea');\n        taSolution.className = 'field';\n        taSolution.rows = 1;\n        taSolution.placeholder = 'Bạn đã (hoặc sẽ) giải quyết thế nào?';\n        taSolution.value = entry.solution || '';\n        tdSolution.appendChild(taSolution);\n        tr.appendChild(tdSolution);\n\n        // Delete action\n        const tdActions = document.createElement('td');\n        tdActions.className = 'row-actions';\n        const delBtn = document.createElement('button');\n        delBtn.className = 'del-btn';\n        delBtn.title = 'Xoá dòng này';\n        delBtn.innerHTML = '&times;';\n        delBtn.addEventListener('click', () => {\n          if(day.entries.length === 1){\n            entry.problem = '';\n            entry.solution = '';\n            render();\n            debouncedSave();\n            return;\n          }\n          day.entries.splice(day.entries.indexOf(entry), 1);\n          render();\n          debouncedSave();\n        });\n        tdActions.appendChild(delBtn);\n        tr.appendChild(tdActions);\n\n        tbody.appendChild(tr);\n\n        // ---- Wire up behavior ----\n        requestAnimationFrame(()=> { autoResize(taProblem); autoResize(taSolution); });\n\n        taProblem.addEventListene
