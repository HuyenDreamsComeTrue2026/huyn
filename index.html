')\">\u003cspan class=\"swot-icon\">💼\u003c/span>\u003cspan class=\"swot-nav-label\">Sự nghiệp\u003c/span>\u003c/button>\n        \u003cbutton class=\"swot-nav-btn\" onclick=\"goTo('swot-love')\">\u003cspan class=\"swot-icon\">💗\u003c/span>\u003cspan class=\"swot-nav-label\">Tình duyên\u003c/span>\u003c/button>\n        \u003cbutton class=\"swot-nav-btn\" onclick=\"goTo('swot-look')\">\u003cspan class=\"swot-icon\">✨\u003c/span>\u003cspan class=\"swot-nav-label\">Ngoại hình\u003c/span>\u003c/button>\n        \u003cbutton class=\"swot-nav-btn\" onclick=\"goTo('swot-wealth')\">\u003cspan class=\"swot-icon\">🌱\u003c/span>\u003cspan class=\"swot-nav-label\">Tài sản\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"swot-career\">\u003c/div>\n      \u003cdiv id=\"swot-love\">\u003c/div>\n      \u003cdiv id=\"swot-look\">\u003c/div>\n      \u003cdiv id=\"swot-wealth\">\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"section\" id=\"sec-me\">\n      \u003cdiv class=\"section-title\">Phần 3 — Những Điều Về Bản Thân\u003c/div>\n\n      \u003cdiv class=\"swot-block\">\n        \u003cdiv class=\"swot-block-title\">3.1 — Nhu cầu ẩn giấu\u003c/div>\n        \u003cdiv class=\"table-wrap\">\u003ctable>\n          \u003cthead>\u003ctr>\n            \u003cth class=\"w-stt\">STT\u003c/th>\n            \u003cth>Nhu cầu ẩn giấu\u003c/th>\n            \u003cth>Động lực phát triển\u003c/th>\n          \u003c/tr>\u003c/thead>\n          \u003ctbody id=\"tb-need\">\u003c/tbody>\n        \u003c/table>\u003c/div>\n        \u003cbutton class=\"add-row-btn\" onclick=\"addRow('tb-need','need')\">+ Thêm hàng\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"swot-block\">\n        \u003cdiv class=\"swot-block-title\">3.2 — Vòng lặp gặp phải\u003c/div>\n        \u003cdiv class=\"table-wrap\">\u003ctable>\n          \u003cthead>\u003ctr>\n            \u003cth class=\"w-time\">Thời gian\u003c/th>\n            \u003cth>Sự kiện\u003c/th>\n            \u003cth>Chi tiết\u003c/th>\n            \u003cth>Nguyên nhân\u003c/th>\n            \u003cth>Cách giải quyết\u003c/th>\n          \u003c/tr>\u003c/thead>\n          \u003ctbody id=\"tb-loop\">\u003c/tbody>\n        \u003c/table>\u003c/div>\n        \u003cbutton class=\"add-row-btn\" onclick=\"addRow('tb-loop','loop')\">+ Thêm hàng\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"swot-block\">\n        \u003cdiv class=\"swot-block-title\">3.3 — Tiên đoán sự kiện\u003c/div>\n        \u003cdiv class=\"table-wrap\">\u003ctable>\n          \u003cthead>\u003ctr>\n            \u003cth class=\"w-stt\">STT\u003c/th>\n            \u003cth>Sự kiện có thể xảy ra\u003c/th>\n            \u003cth>Cách giải quyết\u003c/th>\n            \u003cth>Sự thật\u003c/th>\n          \u003c/tr>\u003c/thead>\n          \u003ctbody id=\"tb-pred\">\u003c/tbody>\n        \u003c/table>\u003c/div>\n        \u003cbutton class=\"add-row-btn\" onclick=\"addRow('tb-pred','pred')\">+ Thêm hàng\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n  \u003c/main>\n\n  \u003cdiv class=\"save-bar\">\n    \u003cdiv class=\"saved-toast\" id=\"toast\">Đã lưu ✓\u003c/div>\n    \u003cbutton class=\"save-btn\" onclick=\"saveAll()\">💾 Lưu dữ liệu\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nfunction goTo(id) {\n  const el = document.getElementById(id);\n  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n\nconst lifeRows = [\n  { label: '0 – 5 tuổi', count: 2 },\n  { label: '6 – 10 tuổi', count: 2 },\n  { label: '11 – 15 tuổi', count: 2 },\n  { label: '16 – 18 tuổi', count: 2 },\n  { label: '19 – 22 tuổi', count: 4 },\n  { label: '23 – 26 tuổi', count: 4 },\n  { label: '27 – 29 tuổi', count: 4 },\n];\n\nfunction buildLifeTable() {\n  const tbody = document.getElementById('life-body');\n  const saved = loadData('life') || {};\n  lifeRows.forEach((period, pi) => {\n    for (let r = 0; r \u003c period.count; r++) {\n      const tr = document.createElement('tr');\n      const cols = ['sukien','tinhcach','tinhduyén'];\n      let labelCell = r === 0 ? `\u003ctd class=\"row-label\" rowspan=\"${period.count}\">${period.label}\u003c/td>` : '';\n      let cells = cols.map(c => {\n        const key = `life_${pi}_${r}_${c}`;\n        return `\u003ctd>\u003ctextarea class=\"cell-input\" data-key=\"${key}\" rows=\"2\" placeholder=\"...\">${saved[key]||''}\u003c/textarea>\u003c/td>`;\n      }).join('');\n      tr.innerHTML = labelCell + cells;\n      tbody.appendChild(tr);\n    }\n  });\n}\n\nconst swotItems = [\n  { id: 'career', label: 'Sự nghiệp', icon: '💼' },\n  { id: 'love',   label: 'Tình duyên', icon: '💗' },\n  { id: 'look',   label: 'Ngoại hình', icon: '✨' },\n  { id: 'wealth', label: 'Tài sản',    icon: '🌱' },\n];\nconst swotLabels = ['Ưu điểm', 'Nhược điểm', 'Cơ hội', 'Khó khăn'];\n\nfunction buildSwot() {\n  swotItems.forEach(item => {\n    const el = document.getElementById('swot-' + item.id);\n    const savedSwot = loadData('swot_' + item.id) || {};\n    const savedGoals = loadData('goals_' + item.id) || [{}];\n    let cells = swotLabels.map((lbl, i) => {\n      const key = `swot_${item.id}_${i}`;\n      return `\u003cdiv class=\"swot-cell\">\n        \u003cdiv class=\"swot-cell-label\">${lbl}\u003c/div>\n        \u003ctextarea data-key=\"${key}\" placeholder=\"Nhập nội dung...\">${savedSwot[key]||''}\u003c/textarea>\n      \u003c/div>`;\n    }).join('');\n    let goalRows = savedGoals.map((g, i) => buildGoalRow(item.id, i, g)).join('');\n    el.innerHTML = `\n      \u003cdiv class=\"swot-block\" id=\"swot-${item.id}-block\">\n        \u003cdiv class=\"swot-block-title\">${item.icon} ${item.label}\u003c/div>\n        \u003cdiv class=\"swot-2x2\">${cells}\u003c/div>\n        \u003cdiv class=\"goals-label\">Hướng phát triển\u003c/div>\n        \u003cdiv class=\"table-wrap\">\u003ctable>\n          \u003cthead>\u003ctr>\n            \u003cth class=\"w-time\">Thời gian\u003c/th>\n            \u003cth>Mục tiêu\u003c/th>\n            \u003cth class=\"w-status\">Trạng thái\u003c/th>\n            \u003cth class=\"w-del\">\u003c/th>\n          \u003c/tr>\u003c/thead>\n          \u003ctbody id=\"goals-${item.id}\">${goalRows}\u003c/tbody>\n        \u003c/table>\u003c/div>\n        \u003cbutton class=\"add-row-btn\" onclick=\"addGoalRow('${item.id}')\">+ Thêm mục tiêu\u003c/button>\n      \u003c/div>`;\n  });\n}\n\nfunction buildGoalRow(id, idx, data) {\n  const st = data.status || 'todo';\n  return `\u003ctr>\n    \u003ctd>\u003ctextarea class=\"cell-input w-time\" data-goal=\"${id}\" data-idx=\"${idx}\" data-field=\"time\" rows=\"2\" placeholder=\"VD: 2025 Q3\">${data.time||''}\u003c/textarea>\u003c/td>\n    \u003ctd>\u003ctextarea class=\"cell-input\" data-goal=\"${id}\" data-idx=\"${idx}\" data-field=\"goal\" rows=\"2\" placeholder=\"Mục tiêu...\">${data.goal||''}\u003c/textarea>\u003c/td>\n    \u003ctd class=\"w-status\" style=\"text-align:center\">\n      \u003cselect class=\"status-sel\" data-goal=\"${id}\" data-idx=\"${idx}\" data-field=\"status\" onchange=\"saveGoalRow('${id}')\">\n        \u003coption value=\"todo\"     ${st==='todo'?'selected':''}>Chưa xong\u003c/option>\n        \u003coption value=\"progress\" ${st==='progress'?'selected':''}>Đang dở\u003c/option>\n        \u003coption value=\"done\"     ${st==='done'?'selected':''}>Đã xong\u003c/option>\n      \u003c/select>\n    \u003c/td>\n    \u003ctd class=\"w-del\">\u003cbutton type=\"button\" class=\"del-row-btn\" onclick=\"deleteGoalRow('${id}', this)\">✕\u003c/button>\u003c/td>\n  \u003c/tr>`;\n}\n\nfunction addGoalRow(id) {\n  const tbody = document.getElementById('goals-' + id);\n  const idx = tbody.querySelectorAll('tr').length;\n  tbody.insertAdjacentHTML('beforeend', buildGoalRow(id, idx, {}));\n}\n\nfunction deleteGoalRow(id, btn) {\n  const tbody = document.getElementById('goals-' + id);\n  if (tbody.querySelectorAll('tr').length \u003c= 1) {\n    btn.closest('tr').querySelectorAll('textarea').forEach(t => t.value = '');\n    btn.closest('tr').querySelector('select').value = 'todo';\n  } else {\n    btn.closest('tr').remove();\n  }\n  saveGoalRow(id);\n}\n\nlet __saveErrShown = false;\nconst MT_DB_NAME='MucTieuDB', MT_STORE='kv';\nlet MT_CACHE={};\nfunction mtOpenDB(){\n  return new Promise((resolve,reject)=>{\n    const req=indexedDB.open(MT_DB_NAME,1);\n    req.onupgradeneeded=e=>{\n      const db=e.target.result;\n      if(!db.objectStoreNames.contains(MT_STORE))db.createObjectStore(MT_STORE);\n    };\n    req.onsuccess=e=>resolve(e.target.result);\n    req.onerror=e=>reject(e.target.error);\n  });\n}\nfunction mtGetAll(){\n  return mtOpenDB().then(db=>new Promise((resolve,reject)=>{\n    const tx=db.transaction(MT_STORE,'readonly');\n    const store=tx.objectStore(MT_STORE);\n    const out={};\n    const cReq=store.openCursor();\n    cReq.onsuccess=e=>{\n      const cursor=e.target.result;\n      if(cursor){out[cursor.key]=cursor.value;cursor.continue();}\n      else resolve(out);\n    };\n    cReq.onerror=e=>reject(e.target.error);\n  }));\n}\nfunction mtPut(key,value){\n  return mtOpenDB().then(db=>new Promise((resolve,reject)=>{\n    const tx=db.transaction(MT_STORE,'readwrite');\n    tx.objectStore(MT_STORE).put(value,key);\n    tx.oncomplete=()=>resolve(true);\n    tx.onerror=e=>reject(e.target.error);\n  }));\n}\nasync function mtPreload(){\n  try{\n    MT_CACHE=await mtGetAll();\n    if(Object.keys(MT_CACHE).length===0){\n      let migrated=0;\n      for(let i=0;i\u003clocalStorage.length;i++){\n        const k=localStorage.key(i);\n        if(k&&k.startsWith('huyen_')){\n          try{\n            const val=JSON.parse(localStorage.getItem(k));\n            MT_CACHE[k]=val;\n            await mtPut(k,val);\n            migrated++;\n          }catch(e){console.error('Lỗi chuyển dữ liệu cũ cho key '+k,e);}\n        }\n      }\n      if(migrated)console.log('Đã chuyển '+migrated+' mục từ localStorage sang IndexedDB.');\n    }\n  }catch(e){\n    console.error('Lỗi tải dữ liệu:',e);\n    alert('⚠️ Không tải được dữ liệu đã lưu: '+e.message);\n  }\n}\nfunction safeSetItem(key, value) {\n  let parsed;\n  try{ parsed = JSON.parse(value); }catch{ parsed = value; }\n  MT_CACHE[key]=parsed;\n  mtPut(key,parsed).catch(e=>{\n    console.error('Lưu thất bại cho key \"' + key + '\":', e);\n    if (!__saveErrShown) {\n      __saveErrShown = true;\n      alert('⚠️ KHÔNG LƯU ĐƯỢC dữ liệu!\\n\\nLỗi: ' + e.name + ' - ' + e.message + '\\n\\nBộ nhớ trình duyệt có thể đã đầy hoặc bị chặn.');\n    }\n  });\n  return true;\n}\n\nfunction saveGoalRow(id) {\n  const tbody = document.getElementById('goals-' + id);\n  const data = [];\n  tbody.querySelectorAll('tr').forEach(tr => {\n    const obj = {};\n    tr.querySelectorAll('[data-field]').forEach(el => { obj[el.dataset.field] = el.value; });\n    data.push(obj);\n  });\n  safeSetItem('huyen_goals_' + id, JSON.stringify(data));\n}\n\nconst rowTemplates = {\n  need: (n, d={}) => `\u003ctd class=\"w-stt\" style=\"text-align:center;color:#7a2e4e;font-family:'Poppins',sans-serif;font-size:0.88rem;font-weight:600\">${n}\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"need\" data-field=\"demand\" rows=\"2\" placeholder=\"Nhu cầu...\">${d.demand||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"need\" data-field=\"motivation\" rows=\"2\" placeholder=\"Động lực...\">${d.motivation||''}\u003c/textarea>\u003c/td>`,\n  loop: (n, d={}) => `\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"loop\" data-field=\"time\" rows=\"2\" placeholder=\"Thời gian...\">${d.time||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"loop\" data-field=\"event\" rows=\"2\" placeholder=\"Sự kiện...\">${d.event||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"loop\" data-field=\"result\" rows=\"2\" placeholder=\"Chi tiết...\">${d.result||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"loop\" data-field=\"reason\" rows=\"2\" placeholder=\"Nguyên nhân...\">${d.reason||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"loop\" data-field=\"solution\" rows=\"2\" placeholder=\"Cách giải...\">${d.solution||''}\u003c/textarea>\u003c/td>`,\n  pred: (n, d={}) => `\u003ctd class=\"w-stt\" style=\"text-align:center;color:#7a2e4e;font-family:'Poppins',sans-serif;font-size:0.88rem;font-weight:600\">${n}\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"pred\" data-field=\"event\" rows=\"2\" placeholder=\"Sự kiện...\">${d.event||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"pred\" data-field=\"solution\" rows=\"2\" placeholder=\"Cách giải quyết...\">${d.solution||''}\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea class=\"cell-input\" data-type=\"pred\" data-field=\"truth\" rows=\"2\" placeholder=\"Sự thật...\">${d.truth||''}\u003c/textarea>\u003c/td>`,\n};\n\nfunction addRow(tbodyId, type, data={}) {\n  const tbody = document.getElementById(tbodyId);\n  const n = tbody.querySelectorAll('tr').length + 1;\n  const tr = document.createElement('tr');\n  tr.innerHTML = rowTemplates[type](n, data);\n  tbody.appendChild(tr);\n}\n\nfunction buildSpecialTable(tbodyId, type) {\n  const saved = loadData(type);\n  const rows = (saved && saved.length) ? saved : [{}];\n  rows.forEach(data => addRow(tbodyId, type, data));\n}\n\nfunction initSpecialTables() {\n  buildSpecialTable('tb-need', 'need');\n  buildSpecialTable('tb-loop', 'loop');\n  buildSpecialTable('tb-pred', 'pred');\n}\n\nfunction saveSpecialTable(tbodyId, type) {\n  const tbody = document.getElementById(tbodyId);\n  const data = [];\n  tbody.querySelectorAll('tr').forEach(tr => {\n    const obj = {};\n    tr.querySelectorAll('[data-field]').forEach(el => { obj[el.dataset.field] = el.value; });\n    data.push(obj);\n  });\n  safeSetItem('huyen_' + type, JSON.stringify(data));\n}\n\nfunction saveAll() {\n  const lifeData = {};\n  document.querySelectorAll('[data-key]').forEach(el => { lifeData[el.dataset.key] = el.value; });\n  let ok = safeSetItem('huyen_life', JSON.stringify(lifeData));\n  swotItems.forEach(item => {\n    saveGoalRow(item.id);\n    const d = {};\n    document.querySelectorAll(`[data-key^=\"swot_${item.id}\"]`).forEach(el => { d[el.dataset.key] = el.value; });\n    if (!safeSetItem('huyen_swot_' + item.id, JSON.stringify(d))) ok = false;\n  });\n  saveSpecialTable('tb-need', 'need');\n  saveSpecialTable('tb-loop', 'loop');\n  saveSpecialTable('tb-pred', 'pred');\n  if (!ok) return; /* lỗi đã được báo bởi safeSetItem, không hiện toast \"đã lưu\" gây hiểu lầm */\n  const toast = document.getElementById('toast');\n  toast.style.display = 'block';\n  setTimeout(() => toast.style.display = 'none', 2000);\n}\n\nfunction loadData(key) {\n  const v = MT_CACHE['huyen_'+key];\n  return v === undefined ? null : v;\n}\n\nfunction resizeAllTextareas() {\n  document.querySelectorAll('textarea').forEach(ta => {\n    ta.style.height = 'auto';\n    ta.style.height = ta.scrollHeight + 'px';\n  });\n}\n\ndocument.addEventListener('DOMContentLoaded', async () => {\n  await mtPreload();\n  buildLifeTable();\n  buildSwot();\n  initSpecialTables();\n  resizeAllTextareas();\n  document.addEventListener('input', e => {\n    if (e.target.classList.contains('cell-input') || e.target.tagName === 'TEXTAREA') {\n      e.target.style.height = 'auto';\n      e.target.style.height = e.target.scrollHeight + 'px';\n    }\n  });\n});\n\u003c/script>\n", "number": "\u003c!DOCTYPE html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Number — To do list Huyền's life\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap\" rel=\"stylesheet\">\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\">\u003c/script>\n\u003cstyle>\n  :root{\n    --bg: #FFF9FA;\n    --bg-deep: #FFEEF3;\n    --card: #FFFFFF;\n    --card-tint: #FFF2F6;\n    --accent: #F8BBD0;\n    --accent-strong: #F48FB1;\n    --accent-deep: #E8799F;\n    --text: #6B4C56;\n    --text-soft: #B08D97;\n    --text-faint: #D8BFC7;\n    --green: #7FC29B;\n    --green-bg: #E7F6EE;\n    --line: #F3D9E0;\n    --shadow: 0 10px 30px -12px rgba(232,121,159,0.25);\n    --radius: 20px;\n  }\n\n  *{box-sizing:border-box;}\n\n  body{\n    margin:0;\n    background:\n      radial-gradient(circle at 8% 4%, #FFE3EC 0%, transparent 45%),\n      radial-gradient(circle at 95% 12%, #FFE9EF 0%, transparent 40%),\n      var(--bg);\n    font-family:'Be Vietnam Pro', sans-serif;\n    color: var(--text);\n    min-height:100vh;\n    padding: 28px 16px 80px;\n  }\n\n  h1,h2,h3, .display{\n    font-family:'Baloo 2', sans-serif;\n  }\n\n  /* ===== Top bar ===== */\n  .topbar{\n    max-width: 980px;\n    margin: 0 auto 6px;\n    display:flex;\n    justify-content:flex-end;\n  }\n  .lock-btn{\n    width:46px; height:46px;\n    border-radius:50%;\n    border:none;\n    background: var(--card);\n    box-shadow: var(--shadow);\n    font-size:20px;\n    cursor:pointer;\n    display:flex; align-items:center; justify-content:center;\n    transition: transform .15s ease, background .2s ease;\n  }\n  .lock-btn:hover{ transform: scale(1.06); }\n  .lock-btn.locked{ background: var(--accent-strong); color:#fff; }\n\n  .lock-hint{\n    max-width:980px;\n    margin: 4px auto 0;\n    text-align:right;\n    font-size:12.5px;\n    color: var(--text-soft);\n    min-height: 16px;\n  }\n\n  /* ===== Header ===== */\n  .hero{\n    max-width: 980px;\n    margin: 8px auto 34px;\n    text-align:center;\n  }\n  .number-big{\n    font-family:'Baloo 2', sans-serif;\n    font-weight:800;\n    font-size: clamp(64px, 16vw, 118px);\n    line-height:1;\n    background: linear-gradient(180deg, var(--accent-deep), var(--accent-strong));\n    -webkit-background-clip:text;\n    background-clip:text;\n    color: transparent;\n    letter-spacing: -2px;\n  }\n  .number-sub{\n    margin-top: 2px;\n    font-size: 12.5px;\n    letter-spacing: 3px;\n    text-transform: uppercase;\n    color: var(--text-soft);\n    font-weight:600;\n  }\n  .hero-title{\n    margin: 10px 0 0;\n    font-size: clamp(22px, 4vw, 30px);\n    font-weight:700;\n    color: var(--text);\n  }\n  .hero-title .charm{ font-size: 0.75em; vertical-align: 2px; opacity:.8;}\n  .hero-deco{\n    margin-top:10px;\n    letter-spacing: 6px;\n    color: var(--accent-deep);\n    font-size:14px;\n  }\n\n  /* ===== Grid ===== */\n  .grid{\n    max-width: 980px;\n    margin: 0 auto;\n    display:grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 22px;\n  }\n  @media (max-width: 720px){\n    .grid{ grid-template-columns: 1fr; }\n  }\n\n  .card{\n    background: var(--card);\n    border-radius: var(--radius);\n    box-shadow: var(--shadow);\n    padding: 22px 20px 18px;\n    border: 1px solid var(--line);\n    position:relative;\n  }\n  .card::before{\n    content:\"\";\n    position:absolute;\n    top:0; left:24px; right:24px; height:1px;\n  }\n\n  /* Bảng màu pastel riêng cho từng mục */\n  .card[data-cat=\"doi_thuong\"]{\n    --cat-a: #F8BBD0; --cat-b: #F2799E; --cat-tint: #FFF2F6; --cat-icon-bg:#FFE1EA; --cat-line:#FBD3E0;\n  }\n  .card[data-cat=\"trai_nghiem\"]{\n    --cat-a: #C9D9F6; --cat-b: #7FA6E8; --cat-tint: #F1F5FD; --cat-icon-bg:#E1EBFB; --cat-line:#D7E4FA;\n  }\n  .card[data-cat=\"uoc_mo\"]{\n    --cat-a: #FFE3A3; --cat-b: #F3B84E; --cat-tint: #FFFAF0; --cat-icon-bg:#FFF1D2; --cat-line:#FBE5B4;\n  }\n  .card[data-cat=\"doi_nay\"]{\n    --cat-a: #C9EBD7; --cat-b: #6FC498; --cat-tint: #F2FBF6; --cat-icon-bg:#DFF6E8; --cat-line:#D3F0DF;\n  }\n\n  .card-head{\n    display:flex;\n    align-items:center;\n    gap:10px;\n    margin-bottom: 14px;\n  }\n  .card-icon{\n    width:38px; height:38px;\n    border-radius:50%;\n    background: var(--cat-icon-bg, var(--bg-deep));\n    display:flex; align-items:center; justify-content:center;\n    font-size:18px;\n    flex-shrink:0;\n  }\n  .card-title{\n    font-size: 17px;\n    font-weight:700;\n    color: var(--text);\n  }\n  .card-count{\n    margin-left:auto;\n    font-size:12px;\n    color: var(--text-soft);\n    background: var(--cat-icon-bg, var(--bg-deep));\n    padding: 3px 10px;\n    border-radius: 999px;\n    font-weight:600;\n    font-family:'Be Vietnam Pro',sans-serif;\n  }\n\n  .todo-list{\n    display:flex;\n    flex-direction:column;\n    gap: 10px;\n  }\n\n  .todo-row{\n    background: var(--cat-tint, var(--card-tint));\n    border-radius: 14px;\n    padding: 10px 12px;\n    border: 1px solid transparent;\n    transition: border-color .15s ease;\n  }\n  .todo-row:hover{ border-color: var(--cat-line, var(--line)); }\n\n  .todo-main{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n  }\n\n  .badge{\n    flex-shrink:0;\n    width: 28px; height:28px;\n    border-radius:50%;\n    background: linear-gradient(160deg, var(--cat-a, var(--accent)), var(--cat-b, var(--accent-strong)));\n    color:#fff;\n    font-family:'Baloo 2', sans-serif;\n    font-weight:700;\n    font-size:13px;\n    display:flex; align-items:center; justify-content:center;\n    box-shadow: 0 3px 6px rgba(150,120,140,0.28);\n  }\n\n  .todo-text{\n    flex: 1;\n    border:none;\n    background:transparent;\n    font-family:'Baloo 2', sans-serif;\n    font-size: 16.5px;\n    font-weight: 600;\n    color: var(--text);\n    padding: 4px 2px;\n    outline:none;\n    min-width:0;\n  }\n  .todo-text::placeholder{ color: var(--text-faint); }\n  .todo-row.done .todo-text{\n    color: var(--text-faint);\n    text-decoration: line-through;\n    text-decoration-color: var(--green);\n  }\n\n  .icon-btn{\n    flex-shrink:0;\n    width:26px; height:26px;\n    border-radius:50%;\n    border:1px solid var(--cat-line, var(--line));\n    background:#fff;\n    color: var(--cat-b, var(--accent-deep));\n    font-size:14px;\n    line-height:1;\n    cursor:pointer;\n    display:flex; align-items:center; justify-content:center;\n    font-family:'Be Vietnam Pro', sans-serif;\n    transition: background .15s ease;\n  }\n  .icon-btn:hover{ background: var(--cat-icon-bg, var(--bg-deep)); }\n\n  .check-btn{\n    flex-shrink:0;\n    width:28px; height:28px;\n    border-radius:50%;\n    border:2px solid var(--line);\n    background:#fff;\n    cursor:pointer;\n    display:flex; align-items:center; justify-content:center;\n    color: transparent;\n    font-size:14px;\n    transition: all .18s ease;\n  }\n  .check-btn.checked{\n    background: var(--green);\n    border-color: var(--green);\n    color:#fff;\n  }\n\n  .journal{\n    display:none;\n    margin-top: 8px;\n    padding-top: 8px;\n    border-top: 1px dashed var(--cat-line, var(--line));\n  }\n  .journal.open{ display:block; }\n  .journal textarea{\n    width:100%;\n    min-height: 56px;\n    resize: vertical;\n    border: 1px solid var(--line);\n    border-radius: 10px;\n    padding: 8px 10px;\n    font-family:'Baloo 2', sans-serif;\n    font-weight: 500;\n    font-size: 13px;\n    color: var(--text);\n    background: #fff;\n    outline:none;\n  }\n  .journal textarea::placeholder{ color: var(--text-faint); font-style: italic; }\n\n  .add-row{\n    margin-top: 14px;\n    width:100%;\n    padding: 9px;\n    border-radius: 12px;\n    border: 1.5px dashed var(--cat-b, var(--accent-strong));\n    background: transparent;\n    color: var(--cat-b, var(--accent-deep));\n    font-family:'Be Vietnam Pro', sans-serif;\n    font-weight:600;\n    font-size: 13.5px;\n    cursor:pointer;\n    transition: background .15s ease;\n  }\n  .add-row:hover{ background: var(--cat-icon-bg, var(--bg-deep)); }\n\n  .empty-hint{\n    font-size:13px;\n    color: var(--text-faint);\n    font-style: italic;\n    padding: 6px 2px;\n  }\n\n  [data-locked=\"true\"] .add-row{ display:none; }\n  [data-locked=\"true\"] .todo-text{ pointer-events:none; }\n  [data-locked=\"true\"] .check-btn{ pointer-events:none; opacity:.85; }\n  [data-locked=\"true\"] .del-btn{ pointer-events:none; opacity:.5; }\n  [data-locked=\"true\"] .journal textarea{ pointer-events:none; background: var(--bg-deep); }\n\n  /* ===== Year timeline ===== */\n  .timeline-wrap{\n    max-width: 980px;\n    margin: 40px auto 0;\n    text-align:center;\n  }\n  .timeline-label{\n    font-size:12px;\n    letter-spacing:3px;\n    text-transform:uppercase;\n    color: var(--text-soft);\n    font-weight:600;\n    margin-bottom: 14px;\n  }\n  .timeline{\n    display:flex;\n    justify-content:center;\n    flex-wrap:wrap;\n    gap: 14px;\n  }\n  .year-chip{\n    background: var(--card);\n    border: 1px solid var(--line);\n    border-radius: 16px;\n    padding: 14px 22px;\n    box-shadow: var(--shadow);\n    min-width: 108px;\n  }\n  .year-chip:nth-of-type(4n+1){ --yc: #F2799E; --yc-bg:#FFF2F6; }\n  .year-chip:nth-of-type(4n+2){ --yc: #7FA6E8; --yc-bg:#F1F5FD; }\n  .year-chip:nth-of-type(4n+3){ --yc: #E3A93E; --yc-bg:#FFFAF0; }\n  .year-chip:nth-of-type(4n+4){ --yc: #4FA97A; --yc-bg:#F2FBF6; }\n  .year-chip.current{\n    background: linear-gradient(180deg, #fff, var(--yc-bg, var(--card-tint)));\n    border-color: var(--yc, var(--accent-strong));\n  }\n  .year-num{\n    font-family:'Baloo 2', sans-serif;\n    font-weight:700;\n    font-size: 20px;\n    color: var(--yc, var(--accent-deep));\n  }\n  .year-frac{\n    margin-top:4px;\n    font-size: 13px;\n    color: var(--text-soft);\n    font-weight:600;\n  }\n\n  .footer-note{\n    text-align:center;\n    margin-top: 46px;\n    color: var(--text-soft);\n    font-size: 13px;\n    letter-spacing: .5px;\n  }\n\n  @media (max-width: 480px){\n    .todo-main{ gap:8px; }\n    .card{ padding: 18px 14px 14px; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"topbar\">\n  \u003cbutton class=\"lock-btn\" id=\"lockBtn\" title=\"Khóa / Mở khóa\">🔓\u003c/button>\n\u003c/div>\n\u003cdiv class=\"lock-hint\" id=\"lockHint\">\u003c/div>\n\n\u003cdiv class=\"hero\">\n  \u003cdiv class=\"number-big\" id=\"numberBig\">0\u003c/div>\n  \u003cdiv class=\"number-sub\">Number\u003c/div>\n  \u003ch1 class=\"hero-title\">To do list \u003cspan class=\"charm\">✦\u003c/span> Huyền's life \u003cspan class=\"charm\">♡\u003c/span>\u003c/h1>\n  \u003cdiv class=\"hero-deco\">˚₊‧ 🎀 ‧₊˚\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\n\n\u003cdiv class=\"timeline-wrap\">\n  \u003cdiv class=\"timeline-label\">Hành trình từng năm\u003c/div>\n  \u003cdiv class=\"timeline\" id=\"timeline\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"footer-note\">Mỗi năm là một trang trong cuốn sổ cuộc đời 🌷\u003c/div>\n\n\u003cscript>\nconst STORAGE_KEY = 'huyenLifeData_v1';\n\nconst CATEGORY_META = [\n  { key: 'doi_thuong',  icon: '🌷', title: 'Đời thường' },\n  { key: 'trai_nghiem', icon: '✈️', title: 'Rất muốn làm' },\n  { key: 'uoc_mo',      icon: '✨', title: 'Ước mơ đạt được' },\n  { key: 'doi_nay',     icon: '🎀', title: 'Đời này phải thử' },\n];\n\nlet openNotes = new Set(); // in-memory only: which todo ids have journal expanded\n\nfunction defaultData(){\n  const d = { categories: {}, locked: false };\n  CATEGORY_META.forEach(c => d.categories[c.key] = []);\n  return d;\n}\n\nfunction loadData(){\n  try{\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if(!raw) return defaultData();\n    const parsed = JSON.parse(raw);\n    if(!parsed.categories) return defaultData();\n    CATEGORY_META.forEach(c => { if(!parsed.categories[c.key]) parsed.categories[c.key] = []; });\n    return parsed;\n  }catch(e){\n    console.error('Lỗi đọc dữ liệu, dùng dữ liệu mới:', e);\n    return defaultData();\n  }\n}\n\nfunction saveData(){\n  try{\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));\n  }catch(e){\n    alert('Không thể lưu dữ liệu (bộ nhớ trình duyệt có thể đã đầy). Thay đổi mới nhất có thể chưa được lưu.');\n    console.error(e);\n  }\n}\n\nlet data = loadData();\nlet idCounter = Date.now();\nfunction nextId(){ idCounter += 1; return 'td_' + idCounter; }\n\nfunction totalCount(){\n  return CATEGORY_META.reduce((sum, c) => sum + data.categories[c.key].length, 0);\n}\n\nfunction currentYear(){ return new Date().getFullYear(); }\n\nfunction yearStats(){\n  const stats = {};\n  CATEGORY_META.forEach(c => {\n    data.categories[c.key].forEach(t => {\n      const y = t.year || currentYear();\n      if(!stats[y]) stats[y] = { total: 0, done: 0 };\n      stats[y].total += 1;\n      if(t.done) stats[y].done += 1;\n    });\n  });\n  // luôn đảm bảo năm hiện tại xuất hiện dù chưa có to-do nào\n  const cy = currentYear();\n  if(!stats[cy]) stats[cy] = { total: 0, done: 0 };\n  return stats;\n}\n\nfunction addTodo(catKey){\n  data.categories[catKey].push({\n    id: nextId(),\n    text: '',\n    done: false,\n    note: '',\n    year: currentYear()\n  });\n  saveData();\n  render();\n  // focus vào ô vừa thêm\n  const rows = document.querySelectorAll(`.card[data-cat=\"${catKey}\"] .todo-text`);\n  if(rows.length) rows[rows.length - 1].focus();\n}\n\nfunction toggleDone(catKey, id){\n  const item = data.categories[catKey].find(t => t.id === id);\n  if(!item) return;\n  item.done = !item.done;\n  saveData();\n  render();\n}\n\nfunction updateText(catKey, id, value){\n  const item = data.categories[catKey].find(t => t.id === id);\n  if(!item) return;\n  item.text = value;\n  saveData();\n  updateNumberOnly();\n}\n\nfunction updateNote(catKey, id, value){\n  const item = data.categories[catKey].find(t => t.id === id);\n  if(!item) return;\n  item.note = value;\n  saveData();\n}\n\nfunction deleteTodo(catKey, id){\n  const list = data.categories[catKey];\n  const idx = list.findIndex(t => t.id === id);\n  if(idx === -1) return;\n  list.splice(idx, 1);\n  openNotes.delete(id);\n  saveData();\n  render();\n}\n\nfunction toggleLock(){\n  if(!data.locked){\n    // đang mở khóa -> chuẩn bị khóa lại: chụp ảnh trước rồi khóa\n    downloadSnapshot(() => {\n      data.locked = true;\n      saveData();\n      render();\n    });\n  } else {\n    data.locked = false;\n    saveData();\n    render();\n  }\n}\n\nfunction downloadSnapshot(afterDone){\n  const target = document.body;\n  html2canvas(target, { backgroundColor: '#FFF9FA', scale: 2, useCORS: true }).then(canvas => {\n    const link = document.createElement('a');\n    link.download = `Huyens-Life-${currentYear()}.png`;\n    link.href = canvas.toDataURL('image/png');\n    link.click();\n    if(afterDone) afterDone();\n  }).catch(err => {\n    console.error('Không thể tạo ảnh:', err);\n    if(afterDone) afterDone();\n  });\n}\n\nfunction updateNumberOnly(){\n  document.getElementById('numberBig').textContent = totalCount();\n}\n\nfunction render(){\n  document.body.setAttribute('data-locked', data.locked ? 'true' : 'false');\n\n  const lockBtn = document.getElementById('lockBtn');\n  lockBtn.textContent = data.locked ? '🔒' : '🔓';\n  lockBtn.classList.toggle('locked', data.locked);\n\n  document.getElementById('lockHint').textContent = data.locked\n    ? 'Đã khóa. Nhấn Ctrl + M để mở khóa.'\n    : '';\n\n  document.getElementById('numberBig').textContent = totalCount();\n\n  const grid = document.getElementById('grid');\n  grid.innerHTML = '';\n\n  CATEGORY_META.forEach(cat => {\n    const items = data.categories[cat.key];\n\n    const card = document.createElement('div');\n    card.className = 'card';\n    card.setAttribute('data-cat', cat.key);\n\n    const head = document.createElement('div');\n    head.className = 'card-head';\n    head.innerHTML = `\n      \u003cdiv class=\"card-icon\">${cat.icon}\u003c/div>\n      \u003cdiv class=\"card-title\">${cat.title}\u003c/div>\n      \u003cdiv class=\"card-count\">${items.filter(t=>t.done).length}/${items.length}\u003c/div>\n    `;\n    card.appendChild(head);\n\n    const list = document.createElement('div');\n    list.className = 'todo-list';\n\n    if(items.length === 0){\n      const empty = document.createElement('div');\n      empty.className = 'empty-hint';\n      empty.textContent = 'Chưa có điều gì ở đây — bắt đầu ghi lại nhé.';\n      list.appendChild(empty);\n    }\n\n    items.forEach((item, idx) => {\n      const row = document.createElement('div');\n      row.className = 'todo-row' + (item.done ? ' done' : '');\n\n      const isOpen = openNotes.has(item.id);\n\n      const main = document.createElement('div');\n      main.className = 'todo-main';\n\n      const badge = document.createElement('div');\n      badge.className = 'badge';\n      badge.textContent = idx + 1;\n\n      const input = document.createElement('input');\n      input.type = 'text';\n      input.className = 'todo-text';\n      input.value = item.text;\n      input.placeholder = 'Nhập điều bạn muốn làm…';\n      input.addEventListener('input', e => updateText(cat.key, item.id, e.target.value));\n\n      const noteBtn = document.createElement('button');\n      noteBtn.className = 'icon-btn';\n      noteBtn.textContent = isOpen ? '−' : '+';\n      noteBtn.title = 'Mở/đóng nhật ký trải nghiệm';\n      noteBtn.addEventListener('click', () => {\n        if(openNotes.has(item.id)) openNotes.delete(item.id);\n        else openNotes.add(item.id);\n        render();\n      });\n\n      const checkBtn = document.createElement('button');\n      checkBtn.className = 'check-btn' + (item.done ? ' checked' : '');\n      checkBtn.textContent = item.done ? '✓' : '';\n      checkBtn.title = 'Đánh dấu hoàn thành';\n      checkBtn.addEventListener('click', () => toggleDone(cat.key, item.id));\n\n      const delBtn = document.createElement('button');\n      delBtn.className = 'icon-btn del-btn';\n      delBtn.textContent = '🗑';\n      delBtn.title = 'Xóa mục này';\n      delBtn.addEventListener('click', () => {\n        if(confirm('Xóa mục này khỏi danh sách?')) deleteTodo(cat.key, item.id);\n      });\n\n      main.appendChild(badge);\n      main.appendChild(input);\n      main.appendChild(noteBtn);\n      main.appendChild(checkBtn);\n      main.appendChild(delBtn);\n\n      row.appendChild(main);\n\n      const journal = document.createElement('div');\n      journal.className = 'journal' + (isOpen ? ' open' : '');\n      const ta = document.createElement('textarea');\n      ta.placeholder = 'Viết lại trải nghiệm, cảm xúc hoặc kỷ niệm về việc này…';\n      ta.value = item.note || '';\n      ta.addEventListener('input', e => updateNote(cat.key, item.id, e.target.value));\n      journal.appendChild(ta);\n      row.appendChild(journal);\n\n      list.appendChild(row);\n    });\n\n    card.appendChild(list);\n\n    const addBtn = document.createElement('button');\n    addBtn.className = 'add-row';\n    addBtn.textContent = '＋ Thêm To-do list';\n    addBtn.addEventListener('click', () => addTodo(cat.key));\n    card.appendChild(addBtn);\n\n    grid.appendChild(card);\n  });\n\n  renderTimeline();\n}\n\nfunction renderTimeline(){\n  const stats = yearStats();\n  const years = Object.keys(stats).map(Number).sort((a,b) => a - b);\n  const cy = currentYear();\n\n  const wrap = document.getElementById('timeline');\n  wrap.innerHTML = '';\n\n  years.forEach(y => {\n    const s = stats[y];\n    const chip = document.createElement('div');\n    chip.className = 'year-chip' + (y === cy ? ' current' : '');\n    chip.innerHTML = `\n      \u003cdiv class=\"year-num\">${y}\u003c/div>\n      \u003cdiv class=\"year-frac\">${s.done} / ${s.total}\u003c/div>\n    `;\n    wrap.appendChild(chip);\n  });\n}\n\ndocument.getElementById('lockBtn').addEventListener('click', toggleLock);\n\ndocument.addEventListener('keydown', e => {\n  if(data.locked && (e.ctrlKey || e.metaKey) && (e.key === 'm' || e.key === 'M')){\n    e.preventDefault();\n    data.locked = false;\n    saveData();\n    render();\n  }\n});\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "vision": "\u003c!DOCT x;\n            opacity: 0.7;\n        }\n\n        .resize-handle:hover {\n            opacity: 1;\n        }\n\n        /* Rotation handle for images */\n        .rotate-handle {\n            position: absolute;\n            top: -15px;\n            right: -15px;\n            width: 24px;\n            height: 24px;\n            background: #E78CA3;\n            border-radius: 50%;\n            cursor: grab;\n            display: none;\n            align-items: center;\n            justify-content: center;\n            color: white;\n            font-size: 12px;\n            opacity: 0.8;\n            transition: opacity 0.2s;\n        }\n\n        .content-node.selected .rotate-handle,\n        .polaroid-frame.selected .rotate-handle,\n        .arrow-node.selected .rotate-handle {\n            display: flex;\n        }\n\n        .rotate-handle:hover {\n            opacity: 1;\n        }\n\n        .rotate-handle:active {\n            cursor: grabbing;\n        }\n\n        /* Timeline Nodes */\n        .timeline-node {\n            position: absolute;\n            background: white;\n            border: 1px solid #f3e8ff;\n            border-radius: 8px;\n            padding: 12px;\n            box-shadow: 0 2px 6px rgba(231, 140, 163, 0.08);\n            font-family: 'Inter', sans-serif;\n            min-width: 120px;\n            cursor: move;\n        }\n\n        .timeline-node.selected {\n            border-color: #E78CA3;\n            box-shadow: 0 0 0 2px rgba(231, 140, 163, 0.3);\n        }\n\n        .timeline-label {\n            font-size: 0.7rem;\n            text-transform: uppercase;\n            letter-spacing: 0.1em;\n            color: #E78CA3;\n            font-weight: 600;\n            font-family: 'Inter', sans-serif;\n            margin-bottom: 4px;\n        }\n\n        .timeline-input {\n            font-size: 1.1rem;\n\t    font-weight: 700;\n            background: transparent;\n            outline: none;\n            border: none;\n            font-family: 'Inter', sans-serif;\n            font-weight: 500;\n            color: #73C6D9;\n            width: 100%;\n\t    text-align: center;\n        }\n\n        /* Arrow Nodes */\n        .arrow-node {\n            position: absolute;\n            cursor: move;\n            user-select: none;\n            transition: transform 0.2s ease;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n        }\n\n        .arrow-node.selected {\n            filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.5));\n        }\n\n        .arrow-svg {\n            width: 60px;\n            height: 20px;\n        }\n\n        .arrow-svg path {\n            stroke: #dc2626;\n            stroke-width: 2;\n            fill: none;\n        }\n\n        .arrow-svg polygon {\n            fill: #dc2626;\n        }\n\n        /* Resize handle for arrows */\n        .arrow-resize-handle {\n            position: absolute;\n            right: -8px;\n            top: 50%;\n            transform: translateY(-50%);\n            width: 12px;\n            height: 12px;\n            background: #dc2626;\n            cursor: ew-resize;\n            border-radius: 2px;\n            opacity: 0;\n            transition: opacity 0.2s;\n        }\n\n        .arrow-node.selected .arrow-resize-handle {\n            opacity: 0.7;\n        }\n\n        .arrow-resize-handle:hover {\n            opacity: 1;\n        }\n\n        /* Content resize handles */\n        .content-resize-handle {\n            position: absolute;\n            background: #E78CA3;\n            opacity: 0;\n            transition: opacity 0.2s;\n        }\n\n        .content-node.selected .content-resize-handle,\n        .timeline-node.selected .content-resize-handle {\n            opacity: 0.7;\n        }\n\n        .content-resize-handle:hover {\n            opacity: 1;\n        }\n\n        .content-resize-se {\n            bottom: 2px;\n            right: 2px;\n            width: 12px;\n            height: 12px;\n            cursor: nw-resize;\n            border-radius: 2px;\n        }\n\n        .content-resize-e {\n            top: 50%;\n            right: -6px;\n            width: 12px;\n            height: 20px;\n            cursor: ew-resize;\n            border-radius: 2px;\n            transform: translateY(-50%);\n        }\n\n        .content-resize-s {\n            bottom: -6px;\n            left: 50%;\n            width: 20px;\n            height: 12px;\n            cursor: ns-resize;\n            border-radius: 2px;\n            transform: translateX(-50%);\n        }\n\n        /* Mobile responsive */\n        @media (max-width: 768px) {\n            .header {\n                padding: 24px 16px 12px;\n            }\n\n            .main-title {\n                font-size: 2rem;\n            }\n\n            .subtitle {\n                right: 16px;\n                font-size: 1.2rem;\n            }\n\n            .toolbar-container {\n                padding: 0 16px;\n            }\n\n            .toolbar {\n                gap: 8px;\n                padding: 8px;\n            }\n\n            .toolbar textarea {\n                min-width: 180px;\n            }\n\n            .content-node {\n                width: 200px;\n                padding: 12px;\n            }\n        }\n\n        .hidden {\n            display: none;\n        }\n\n        .fullscreen-slide {\n            height: 100vh !important;\n        }\n    \u003c/style>\n    \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n    \u003cdiv class=\"container\">\n        \u003c!-- Header -->\n        \u003cheader class=\"header\">\n            \u003ch1 class=\"main-title\">\n                Vision Board \u003cspan class=\"black-text\">2025–2030\u003c/span>\n            \u003c/h1>\n            \u003cdiv class=\"subtitle\">Sống một cuộc đời đáng giá\u003c/div>\n        \u003c/header>\n\n        \u003c!-- Toolbar -->\n        \u003cdiv class=\"toolbar-container\">\n            \u003cdiv class=\"toolbar\">\n                \u003ctextarea id=\"contentInput\" placeholder=\"Nhập nội dung từng mục (ô đã chọn)…\">\u003c/textarea>\n                \u003cdiv class=\"font-controls\">\n                    \u003cbutton class=\"font-size-btn\" onclick=\"changeFontSize(-2)\" title=\"Giảm font\">A-\u003c/button>\n                    \u003cbutton class=\"font-size-btn\" onclick=\"changeFontSize(2)\" title=\"Tăng font\">A+\u003c/button>\n                \u003c/div>\n                \u003cdiv class=\"rotation-controls\">\n                    \u003cbutton class=\"rotation-btn\" onclick=\"rotateImage(-15)\" title=\"Xoay trái\">↺\u003c/button>\n                    \u003cbutton class=\"rotation-btn\" onclick=\"rotateImage(15)\" title=\"Xoay phải\">↻\u003c/button>\n                    \u003cbutton class=\"rotation-btn\" onclick=\"resetRotation()\" title=\"Reset xoay\">⟲\u003c/button>\n                \u003c/div>\n                \u003cbutton class=\"pink\" onclick=\"updateContent()\">Cập nhật\u003c/button>\n                \u003cbutton onclick=\"addImage()\">Thêm ảnh\u003c/button>\n                \u003cbutton onclick=\"addChild()\">Thêm nhánh\u003c/button>\n                \u003cbutton onclick=\"addSibling()\">Thêm ô\u003c/button>\n                \u003cbutton onclick=\"addTimeline()\">Thêm thời gian\u003c/button>\n                \u003cbutton onclick=\"addArrow('straight')\">→\u003c/button>\n                \u003cbutton onclick=\"addArrow('left')\">↰\u003c/button>\n                \u003cbutton onclick=\"addArrow('right')\">↱\u003c/button>\n                \u003cbutton onclick=\"bringToFront()\">Lên trên\u003c/button>\n                \u003cbutton class=\"red\" onclick=\"removeNode()\">Xóa\u003c/button>\n                \u003cbutton onclick=\"saveData()\">Lưu\u003c/button>\n                \u003cbutton onclick=\"toggleLock()\">Khóa\u003c/button>\n            \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Canvas -->\n        \u003cdiv class=\"canvas-container\">\n            \u003cdiv class=\"canvas\">\n                \u003cdiv class=\"mindmap-area\" id=\"mindmapArea\">\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cinput type=\"file\" id=\"fileInput\" accept=\"image/*\" class=\"hidden\">\n\n    \u003cscript>\n        // State management\n        let selectedNodeId = null;\n        let nodeCounter = 1;\n        let nodes = {};\n        let isDragging = false;\n        let isResizing = false;\n        let isRotating = false;\n        let dragOffset = { x: 0, y: 0 };\n\n        // Initialize with root node\n        async function init() {\n            await loadDataFromStorage();\n            if (Object.keys(nodes).length === 0) {\n                const rootId = generateId();\n                createContentNode(rootId, null, 'Tầm nhìn tổng quát', { x: 400, y: 50 });\n                saveDataToStorage();\n            }\n        }\n\n        function generateId() {\n            return 'node_' + (nodeCounter++);\n        }\n\n        // Create Content Node\n        function createContentNode(id, parentId, content = '', position = { x: 0, y: 0 }, fontSize = 14, rotation = 0, width = 240, height = 120) {\n            nodes[id] = {\n                id,\n                parentId,\n                type: 'content',\n                content,\n                position,\n                fontSize: fontSize || 14,\n                rotation: rotation || 0,\n                width: width || 240,\n                height: height || 120\n            };\n\n            const nodeElement = document.createElement('div');\n            nodeElement.id = id;\n            nodeElement.className = 'content-node';\n            nodeElement.style.left = position.x + 'px';\n            nodeElement.style.top = position.y + 'px';\n            nodeElement.style.width = width + 'px';\n            nodeElement.style.minHeight = height + 'px';\n            nodeElement.style.transform = `rotate(${rotation}deg)`;\n            nodeElement.innerHTML = `\n                \u003cdiv class=\"node-type\">Mục tiêu\u003c/div>\n                \u003ctextarea class=\"node-textarea\" style=\"font-size: ${fontSize}px;\" oninput=\"autoResizeNodeTextarea('${id}')\" onchange=\"updateNodeContent('${id}', this.value)\" placeholder=\"Nhập nội dung...\">${content}\u003c/textarea>\n                \u003cdiv class=\"node-footer\">✦ Ước mơ của tôi ✦\u003c/div>\n                \u003cdiv class=\"rotate-handle\" onmousedown=\"startRotate(event, '${id}')\" title=\"Kéo để xoay\">⟲\u003c/div>\n                \u003cdiv class=\"content-resize-handle content-resize-se\" onmousedown=\"startContentResize(event, '${id}', 'se')\">\u003c/div>\n                \u003cdiv class=\"content-resize-handle content-resize-e\" onmousedown=\"startContentResize(event, '${id}', 'e')\">\u003c/div>\n                \u003cdiv class=\"content-resize-handle content-resize-s\" onmousedown=\"startContentResize(event, '${id}', 's')\">\u003c/div>\n            `;\n\n            addNodeEventListeners(nodeElement, id);\n            document.getElementById('mindmapArea').appendChild(nodeElement);\n            setTimeout(() => autoResizeNodeTextarea(id), 0);\n            return nodeElement;\n        }\n\n        // Tự động giãn khung theo số dòng chữ, không cắt mất chữ; ô nhập chữ luôn lấp đầy khung (kéo to bao nhiêu cũng được)\n        function autoResizeNodeTextarea(nodeId) {\n            const nodeElement = document.getElementById(nodeId);\n            if (!nodeElement) return;\n            const textarea = nodeElement.querySelector('.node-textarea');\n            if (!textarea) return;\n\n            // Đo tạm chiều cao cần thiết để hiện hết nội dung, rồi trả lại quyền điều khiển cho flexbox\n            const prevHeight = textarea.style.height;\n            textarea.style.height = 'auto';\n            const neededTextareaHeight = textarea.scrollHeight;\n            textarea.style.height = prevHeight;\n\n            const nodeType = nodeElement.querySelector('.node-type');\n            const nodeFooter = nodeElement.querySelector('.node-footer');\n            const fixedPartsHeight = (nodeType ? nodeType.offsetHeight : 0) + (nodeFooter ? nodeFooter.offsetHeight : 0) + 40;\n\n            const neededTotalHeight = neededTextareaHeight + fixedPartsHeight;\n            const currentHeight = (nodes[nodeId] && nodes[nodeId].height) || 120;\n            const newHeight = Math.max(120, currentHeight, neededTotalHeight);\n\n            nodeElement.style.minHeight = newHeight + 'px';\n            if (nodes[nodeId]) {\n                nodes[nodeId].height = newHeight;\n            }\n        }\n\n        // Create Arrow Node\n        function createArrowNode(id, parentId, arrowType = 'straight', position = { x: 0, y: 0 }, rotation = 0, length = 100) {\n            nodes[id] = {\n                id,\n                parentId,\n                type: 'arrow',\n                arrowType,\n                position,\n                rotation: rotation || 0,\n                length: length || 100\n            };\n\n            const nodeElement = document.createElement('div');\n            nodeElement.id = id;\n            nodeElement.className = 'arrow-node';\n            nodeElement.style.left = position.x + 'px';\n            nodeElement.style.top = position.y + 'px';\n            nodeElement.style.transform = `rotate(${rotation}deg)`;\n            \n            let svgPath = '';\n            if (arrowType === 'straight') {\n                svgPath = `\u003cpath d=\"M10 15 L${length - 15} 15\" />\n                          \u003cpolygon points=\"${length - 15},10 ${length - 15},20 ${length - 5},15\" />`;\n            } else if (arrowType === 'left') {\n                svgPath = `\u003cpath d=\"M10 20 Q${length/2} 5, ${length - 15} 15\" />\n                          \u003cpolygon points=\"${length - 15},10 ${length - 15},20 ${length - 5},15\" />`;\n            } else if (arrowType === 'right') {\n                svgPath = `\u003cpath d=\"M10 10 Q${length/2} 25, ${length - 15} 15\" />\n                          \u003cpolygon points=\"${length - 15},10 ${length - 15},20 ${length - 5},15\" />`;\n            }\n\n            nodeElement.innerHTML = `\n                \u003csvg class=\"arrow-svg\" style=\"width: ${length}px; height: 30px;\">\n                    ${svgPath}\n                \u003c/svg>\n                \u003cdiv class=\"arrow-resize-handle\" onmousedown=\"startArrowResize(event, '${id}')\">\u003c/div>\n                \u003cdiv class=\"rotate-handle\" onmousedown=\"startRotate(event, '${id}')\" title=\"Kéo để xoay\">⟲\u003c/div>\n            `;\n\n            addNodeEventListeners(nodeElement, id);\n            document.getElementById('mindmapArea').appendChild(nodeElement);\n            return nodeElement;\n        }\n\n        // Create Image Node (Polaroid)\n        function createImageNode(id, parentId, src = null, position = { x: 0, y: 0 }, width = 180, height = 150, rotation = 0) {\n            nodes[id] = {\n                id,\n                parentId,\n                type: 'image',\n                src,\n                position,\n                width,\n                height,\n                rotation: rotation || 0\n            };\n\n            const nodeElement = document.createElement('div');\n            nodeElement.id = id;\n            nodeElement.className = 'polaroid-frame';\n            nodeElement.style.left = position.x + 'px';\n            nodeElement.style.top = position.y + 'px';\n            nodeElement.style.width = width + 'px';\n            nodeElement.style.transform = `rotate(${rotation}deg)`;\n\n            const imageHTML = src \n                ? `\u003cimg src=\"${src}\" alt=\"uploaded\">`\n                : `\u003cdiv class=\"image-placeholder\" onclick=\"selectImage('${id}')\">Click để tải ảnh\u003c/div>`;\n\n            nodeElement.innerHTML = `\n                \u003cdiv class=\"image-container\" style=\"width: ${width - 24}px; height: ${height - 47}px;\">\n                    ${imageHTML}\n                \u003c/div>\n                \u003cdiv class=\"resize-handle\" onmousedown=\"startResize(event, '${id}')\">\u003c/div>\n                \u003cdiv class=\"rotate-handle\" onmousedown=\"startRotate(event, '${id}')\" title=\"Kéo để xoay\">⟲\u003c/div>\n            `;\n\n            addNodeEventListeners(nodeElement, id);\n            document.getElementById('mindmapArea').appendChild(nodeElement);\n            return nodeElement;\n        }\n\n        // Create Timeline Node\n        function createTimelineNode(id, parentId, content = '', position = { x: 0, y: 0 }, width = 150, height = 60) {\n            nodes[id] = {\n                id,\n                parentId,\n                type: 'timeline',\n                content,\n                position,\n                width: width || 150,\n                height: height || 60\n            };\n\n            const nodeElement = document.createElement('div');\n            nodeElement.id = id;\n            nodeElement.className = 'timeline-node';\n            nodeElement.style.left = position.x + 'px';\n            nodeElement.style.top = position.y + 'px';\n            nodeElement.style.width = width + 'px';\n            nodeElement.style.minHeight = height + 'px';\n            nodeElement.innerHTML = `\n                \u003cdiv class=\"timeline-label\">Timeline\u003c/div>\n                \u003cinput class=\"timeline-input\" type=\"text\" placeholder=\"2025 → 2030\" value=\"${content}\" onchange=\"updateNodeContent('${id}', this.value)\">\n                \u003cdiv class=\"content-resize-handle content-resize-se\" onmousedown=\"startContentResize(event, '${id}', 'se')\">\u003c/div>\n                \u003cdiv class=\"content-resize-handle content-resize-e\" onmousedown=\"startContentResize(event, '${id}', 'e')\">\u003c/div>\n                \u003cdiv class=\"content-resize-handle content-resize-s\" onmousedown=\"startContentResize(event, '${id}', 's')\">\u003c/div>\n            `;\n\n            addNodeEventListeners(nodeElement, id);\n            document.getElementById('mindmapArea').appendChild(nodeElement);\n            return nodeElement;\n        }\n\n        function addNodeEventListeners(nodeElement, id) {\n            nodeElement.addEventListener('click', (e) => {\n                e.stopPropagation();\n                if (e.target.closest('.image-placeholder')) {\n                    selectImage(id);\n                } else {\n                    selectNode(id);\n                }\n            });\n\n            nodeElement.addEventListener('mousedown', startDrag);\n        }\n\n        function selectNode(id) {\n            // Remove previous selection\n            document.querySelectorAll('.content-node, .polaroid-frame, .timeline-node, .arrow-node').forEach(node => {\n                node.classList.remove('selected');\n            });\n\n            // Select new node\n            const nodeElement = document.getElementById(id);\n            if (nodeElement) {\n                nodeElement.classList.add('selected');\n                selectedNodeId = id;\n\n                // Update toolbar textarea\n                const contentInput = document.getElementById('contentInput');\n                contentInput.value = nodes[id].content || '';\n            }\n        }\n\n        function updateNodeContent(id, value) {\n            if (nodes[id]) {\n                nodes[id].content = value;\n                saveDataToStorage();\n            }\n        }\n\n        function updateContent() {\n            if (selectedNodeId) {\n                const contentInput = document.getElementById('contentInput');\n                updateNodeContent(selectedNodeId, contentInput.value);\n                \n                // Update the node's display\n                const nodeElement = document.getElementById(selectedNodeId);\n                const textarea = nodeElement.querySelector('.node-textarea');\n                const input = nodeElement.querySelector('.timeline-input');\n                \n                if (textarea) {\n                    textarea.value = contentInput.value;\n                } else if (input) {\n                    input.value = contentInput.value;\n                }\n            }\n        }\n\n        function changeFontSize(delta) {\n            if (selectedNodeId && nodes[selectedNodeId].type === 'content') {\n                const node = nodes[selectedNodeId];\n                node.fontSize = Math.max(10, Math.min(24, (node.fontSize || 14) + delta));\n                \n                const textarea = document.getElementById(selectedNodeId).querySelector('.node-textarea');\n                textarea.style.fontSize = node.fontSize + 'px';\n                saveDataToStorage();\n            }\n        }\n\n        // Rotation functions\n        function rotateImage(angle) {\n            if (selectedNodeId && (nodes[selectedNodeId].type === 'image' || nodes[selectedNodeId].type === 'content' || nodes[selectedNodeId].type === 'arrow')) {\n                const node = nodes[selectedNodeId];\n                node.rotation = (node.rotation || 0) + angle;\n                \n                const nodeElement = document.getElementById(selectedNodeId);\n                nodeElement.style.transform = `rotate(${node.rotation}deg)`;\n                saveDataToStorage();\n            }\n        }\n\n        function resetRotation() {\n            if (selectedNodeId && (nodes[selectedNodeId].type === 'image' || nodes[selectedNodeId].type === 'content' || nodes[selectedNodeId].type === 'arrow')) {\n                const node = nodes[selectedNodeId];\n                node.rotation = 0;\n                \n                const nodeElement = document.getElementById(selectedNodeId);\n                nodeElement.style.transform = `rotate(0deg)`;\n                saveDataToStorage();\n            }\n        }\n\n        // Start rotation with mouse drag\n        function startRotate(e, nodeId) {\n            e.stopPropagation();\n            e.preventDefault();\n            isRotating = true;\n            \n            const nodeElement = document.getElementById(nodeId);\n            const rect = nodeElement.getBoundingClientRect();\n            const centerX = rect.left + rect.width / 2;\n            const centerY = rect.top + rect.height / 2;\n\n            function handleRotate(e) {\n                if (!isRotating) return;\n                \n                const mouseX = e.clientX;\n                const mouseY = e.clientY;\n                \n                const angle = Math.atan2(mouseY - centerY, mouseX - centerX) * (180 / Math.PI);\n                \n                nodes[nodeId].rotation = angle;\n                nodeElement.style.transform = `rotate(${angle}deg)`;\n            }\n\n            function stopRotate() {\n                isRotating = false;\n                document.removeEventListener('mousemove', handleRotate);\n                document.removeEventListener('mouseup', stopRotate);\n                saveDataToStorage();\n            }\n\n            document.addEventListener('mousemove', handleRotate);\n            document.addEventListener('mouseup', stopRotate);\n        }\n\n        // Arrow resize functionality\n        function startArrowResize(e, nodeId) {\n            e.stopPropagation();\n            e.preventDefault();\n            isResizing = true;\n            \n            const node = nodes[nodeId];\n            const startX = e.clientX;\n            const startLength = node.length;\n\n            function handleArrowResize(e) {\n                if (!isResizing) return;\n                \n                const deltaX = e.clientX - startX;\n                const newLength = Math.max(40, Math.min(200, startLength + deltaX));\n                \n                node.length = newLength;\n                updateArrowSVG(nodeId, node.arrowType, newLength);\n            }\n\n            function stopArrowResize() {\n                isResizing = false;\n                document.removeEventListener('mousemove', handleArrowResize);\n                document.removeEventListener('mouseup', stopArrowResize);\n                saveDataToStorage();\n            }\n\n            document.addEventListener('mousemove', handleArrowResize);\n            document.addEventListener('mouseup', stopArrowResize);\n        }\n\n        function updateArrowSVG(nodeId, arrowType, length) {\n            const nodeElement = document.getElementById(nodeId);\n            const svg = nodeElement.querySelector('.arrow-svg');\n            svg.style.width = length + 'px';\n            \n            let svgPath = '';\n            if (arrowType === 'straight') {\n                svgPath = `\u003cpath d=\"M5 10 L${length - 10} 10\" />\n                          \u003cpolygon points=\"${length - 10},6 ${length - 10},14 ${length - 2},10\" />`;\n            } else if (arrowType === 'left') {\n                svgPath = `\u003cpath d=\"M5 15 Q${length/2} 5, ${length - 10} 10\" />\n                          \u003cpolygon points=\"${length - 10},6 ${length - 10},14 ${length - 2},10\" />`;\n            } else if (arrowType === 'right') {\n                svgPath = `\u003cpath d=\"M5 5 Q${length/2} 15, ${length - 10} 10\" />\n                          \u003cpolygon points=\"${length - 10},6 ${length - 10},14 ${length - 2},10\" />`;\n            }\n            \n            svg.innerHTML = svgPath;\n        }\n\n        // Content resize functionality\n        function startContentResize(e, nodeId, direction) {\n            e.stopPropagation();\n            e.preventDefault();\n            isResizing = true;\n            \n            const node = nodes[nodeId];\n            const startX = e.clientX;\n            const startY = e.clientY;\n            const startWidth = node.width || 240;\n            const startHeight = node.height || 120;\n\n            function handleContentResize(e) {\n                if (!isResizing) return;\n                \n                const deltaX = e.clientX - startX;\n                const deltaY = e.clientY - startY;\n                \n                let newWidth = startWidth;\n                let newHeight = startHeight;\n                \n                if (direction.includes('e')) {\n                    newWidth = Math.max(150, startWidth + deltaX);\n                }\n                if (direction.includes('s')) {\n                    newHeight = Math.max(80, startHeight + deltaY);\n                }\n                \n                node.width = newWidth;\n                node.height = newHeight;\n                \n                const element = document.getElementById(nodeId);\n                element.style.width = newWidth + 'px';\n                element.style.minHeight = newHeight + 'px';\n            }\n\n            function stopContentResize() {\n                isResizing = false;\n                document.removeEventListener('mousemove', handleContentResize);\n                document.removeEventListener('mouseup', stopContentResize);\n                saveDataToStorage();\n            }\n\n            document.addEventListener('mousemove', handleContentResize);\n            document.addEventListener('mouseup', stopContentResize);\n        }\n\n        // Bring to front functionality\n        function bringToFront() {\n            if (!selectedNodeId) return;\n            \n            const nodeElement = document.getElementById(selectedNodeId);\n            if (nodeElement) {\n                nodeElement.style.zIndex = Date.now();\n                saveDataToStorage();\n            }\n        }\n\n        function addChild() {\n            if (!selectedNodeId) return;\n            const childId = generateId();\n            const parentPos = nodes[selectedNodeId].position;\n            createContentNode(childId, selectedNodeId, '', { \n                x: parentPos.x, \n                y: parentPos.y + 200 \n            });\n            saveDataToStorage();\n        }\n\n        function addArrow(arrowType) {\n            if (!selectedNodeId) return;\n            const arrowId = generateId();\n            const parentPos = nodes[selectedNodeId].position;\n            createArrowNode(arrowId, selectedNodeId, arrowType, { \n                x: parentPos.x + 150, \n                y: parentPos.y + 50 \n            });\n            saveDataToStorage();\n        }\n\n        function addSibling() {\n            if (!selectedNodeId) return;\n            const parentId = nodes[selectedNodeId].parentId;\n            const siblingId = generateId();\n            const selectedPos = nodes[selectedNodeId].position;\n            createContentNode(siblingId, parentId, '', { \n                x: selectedPos.x + 300, \n                y: selectedPos.y \n            });\n            saveDataToStorage();\n        }\n\n        function addImage() {\n            if (!selectedNodeId) return;\n            const imageId = generateId();\n            const parentPos = nodes[selectedNodeId].position;\n            createImageNode(imageId, selectedNodeId, null, { \n                x: parentPos.x + 280, \n                y: parentPos.y \n            });\n            saveDataToStorage();\n        }\n\n        function addTimeline() {\n            if (!selectedNodeId) return;\n            const timelineId = generateId();\n            const parentPos = nodes[selectedNodeId].position;\n            createTimelineNode(timelineId, selectedNodeId, '', { \n                x: parentPos.x - 200, \n                y: parentPos.y \n            });\n            saveDataToStorage();\n        }\n\n        function removeNode() {\n            if (!selectedNodeId) return;\n            \n            // Remove node and its children recursively\n            function removeNodeRecursive(id) {\n                const children = Object.values(nodes).filter(node => node.parentId === id);\n                children.forEach(child => removeNodeRecursive(child.id));\n                \n                const element = document.getElementById(id);\n                if (element) element.remove();\n                \n                delete nodes[id];\n            }\n\n            removeNodeRecursive(selectedNodeId);\n            selectedNodeId = null;\n            document.getElementById('contentInput').value = '';\n            saveDataToStorage();\n        }\n\n        function selectImage(nodeId) {\n            const fileInput = document.getElementById('fileInput');\n            fileInput.onchange = (e) => {\n                const file = e.target.files[0];\n                if (!file) return;\n\n                const reader = new FileReader();\n                reader.onload = () => {\n                    nodes[nodeId].src = reader.result;\n                    const nodeElement = document.getElementById(nodeId);\n                    const imageContainer = nodeElement.querySelector('.image-container');\n                    imageContainer.innerHTML = `\u003cimg src=\"${reader.result}\" alt=\"uploaded\">`;\n                    saveDataToStorage();\n                };\n                reader.readAsDataURL(file);\n            };\n            fileInput.click();\n        }\n\n        // Resize functionality\n        function startResize(e, nodeId) {\n            e.stopPropagation();\n            e.preventDefault();\n            isResizing = true;\n            \n            const node = nodes[nodeId];\n            const startX = e.clientX;\n            const startY = e.clientY;\n            const startWidth = node.width;\n            const startHeight = node.height;\n\n            function handleResize(e) {\n                if (!isResizing) return;\n                \n                const deltaX = e.clientX - startX;\n                const deltaY = e.clientY - startY;\n                \n                const newWidth = Math.max(100, startWidth + deltaX);\n                const newHeight = Math.max(80, startHeight + deltaY);\n                \n                node.width = newWidth;\n                node.height = newHeight;\n                \n                const element = document.getElementById(nodeId);\n                const imageContainer = element.querySelector('.image-container');\n                element.style.width = newWidth + 'px';\n                imageContainer.style.width = (newWidth - 24) + 'px';\n                imageContainer.style.height = (newHeight - 47) + 'px';\n            }\n\n            function stopResize() {\n                isResizing = false;\n                document.removeEventListener('mousemove', handleResize);\n                document.removeEventListener('mouseup', stopResize);\n                saveDataToStorage();\n            }\n\n            document.addEventListener('mousemove', handleResize);\n            document.addEventListener('mouseup', stopResize);\n        }\n\n        // Drag functionality\n        function startDrag(e) {\n            if (isResizing || isRotating || e.target.classList.contains('resize-handle') || e.target.classList.contains('rotate-handle')) return;\n            \n            isDragging = true;\n            const nodeElement = e.target.closest('.content-node, .polaroid-frame, .timeline-node, .arrow-node');\n            if (!nodeElement) return;\n\n            const nodeId = nodeElement.id;\n            const rect = nodeElement.getBoundingClientRect();\n            const containerRect = document.getElementById('mindmapArea').getBoundingClientRect();\n            \n            dragOffset.x = e.clientX - rect.left;\n            dragOffset.y = e.clientY - rect.top;\n\n            function handleDrag(e) {\n                if (!isDragging || isResizing || isRotating) return;\n                const containerRect = document.getElementById('mindmapArea').getBoundingClientRect();\n                const x = e.clientX - containerRect.left - dragOffset.x;\n                const y = e.clientY - containerRect.top - dragOffset.y;\n\n                nodeElement.style.left = Math.max(0, x) + 'px';\n                nodeElement.style.top = Math.max(0, y) + 'px';\n\n                nodes[nodeId].position = { x: Math.max(0, x), y: Math.max(0, y) };\n            }\n\n            function stopDrag() {\n                isDragging = false;\n                document.removeEventListener('mousemove', handleDrag);\n                document.removeEventListener('mouseup', stopDrag);\n                saveDataToStorage();\n            }\n\n            document.addEventListener('mousemove', handleDrag);\n            document.addEventListener('mouseup', stopDrag);\n        }\n\n        // IndexedDB Storage Functions (thay cho localStorage vì dung lượng lớn hơn nhiều,\n        // tránh tình trạng lưu thất bại âm thầm khi board có nhiều ảnh)\n        const VB_DB_NAME = 'VisionBoardDB';\n        const VB_STORE_NAME = 'boardData';\n        const VB_DATA_KEY = 'visionBoardData';\n\n        function vbOpenDB() {\n            return new Promise((resolve, reject) => {\n                const request = indexedDB.open(VB_DB_NAME, 1);\n                request.onupgradeneeded = (e) => {\n                    const db = e.target.result;\n                    if (!db.objectStoreNames.contains(VB_STORE_NAME)) {\n                        db.createObjectStore(VB_STORE_NAME);\n                    }\n                };\n                request.onsuccess = (e) => resolve(e.target.result);\n                request.onerror = (e) => reject(e.target.error);\n            });\n        }\n\n        let __vbSaveErrShown = false;\n        async function saveDataToStorage() {\n            try {\n                const db = await vbOpenDB();\n                await new Promise((resolve, reject) => {\n                    const tx = db.transaction(VB_STORE_NAME, 'readwrite');\n                    tx.objectStore(VB_STORE_NAME).put({ nodes: nodes, nodeCounter: nodeCounter }, VB_DATA_KEY);\n                    tx.oncomplete = () => resolve(true);\n                    tx.onerror = (e) => reject(e.target.error);\n                });\n                return true;\n            } catch (e) {\n                console.error('Error saving to IndexedDB:', e);\n                if (!__vbSaveErrShown) {\n                    __vbSaveErrShown = true;\n                    alert('⚠️ KHÔNG LƯU ĐƯỢC ảnh/thay đổi vừa rồi!\\n\\nLỗi: ' + (e && e.name ? e.name + ' - ' + e.message : e) + '\\n\\nẢnh vẫn đang hiện tạm trên màn hình nhưng CHƯA được lưu xuống máy. Đừng tải lại trang / đóng tab lúc này, hãy báo lại để được hỗ trợ ngay.');\n                }\n                return false;\n            }\n        }\n\n        function vbRecreateNodes() {\n            Object.values(nodes).forEach(node => {\n                if (node.type === 'content') {\n                    createContentNode(node.id, node.parentId, node.content, node.position, node.fontSize, node.rotation, node.width, node.height);\n                } else if (node.type === 'image') {\n                    createImageNode(node.id, node.parentId, node.src, node.position, node.width, node.height, node.rotation);\n                } else if (node.type === 'timeline') {\n                    createTimelineNode(node.id, node.parentId, node.content, node.position);\n                } else if (node.type === 'arrow') {\n                    createArrowNode(node.id, node.parentId, node.arrowType, node.position, node.rotation, node.length);\n                }\n            });\n        }\n\n        async function loadDataFromStorage() {\n            try {\n                const db = await vbOpenDB();\n                const data = await new Promise((resolve, reject) => {\n                    const tx = db.transaction(VB_STORE_NAME, 'readonly');\n                    const req = tx.objectStore(VB_STORE_NAME).get(VB_DATA_KEY);\n                    req.onsuccess = () => resolve(req.result);\n                    req.onerror = (e) => reject(e.target.error);\n                });\n\n                if (data) {\n                    nodes = data.nodes || {};\n                    nodeCounter = data.nodeCounter || 1;\n                    vbRecreateNodes();\n                    return;\n                }\n\n                // Không có dữ liệu trong IndexedDB -> thử chuyển dữ liệu cũ từ localStorage (nếu có)\n                const oldData = localStorage.getItem('visionBoardData');\n                if (oldData) {\n                    const parsed = JSON.parse(oldData);\n                    nodes = parsed.nodes || {};\n                    nodeCounter = parsed.nodeCounter || 1;\n                    vbRecreateNodes();\n                    await saveDataToStorage();\n                }\n            } catch (e) {\n                console.error('Error loading from IndexedDB:', e);\n            }\n        }\n\n        async function exportBoardImage() {\n            const restoreFns = [];\n            try {\n                const area = document.getElementById('mindmapArea');\n                if (!area || typeof html2canvas === 'undefined') return;\n\n                // Ẩn hẳn khung ảnh còn trống + tắt đổ bóng trong lúc chụp\n                // (thư viện chụp ảnh render đổ bóng bị thô/xám, và không cập nhật style kịp cho khung trống)\n                area.querySelectorAll('.image-placeholder').forEach(el => {\n                    const frame = el.closest('.polaroid-frame');\n                    if (frame) {\n                        const prevVis = frame.style.visibility;\n                        frame.style.visibility = 'hidden';\n                        restoreFns.push(() => { frame.style.visibility = prevVis; });\n                    }\n                });\n                area.querySelectorAll('.polaroid-frame, .content-node, .timeline-node').forEach(el => {\n                    const prevShadow = el.style.boxShadow;\n                    e
