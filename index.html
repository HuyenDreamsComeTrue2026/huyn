const DBS=['KawaiiGoalsDB','KeHoachThangDB','MucTieuDB','HangNgayDB','NhatKy2026DB','VisionBoardDB'];
function openExisting(name){return new Promise(res=>{const r=indexedDB.open(name);r.onupgradeneeded=e=>e.target.transaction.abort();r.onsuccess=e=>res(e.target.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);});}
async function dumpDB(name){
  const db=await openExisting(name);if(!db)return null;
  const out={version:db.version,stores:{}};
  for(const sn of Array.from(db.objectStoreNames)){
    await new Promise((ok,bad)=>{
      const tx=db.transaction(sn,'readonly'),st=tx.objectStore(sn);
      const meta={keyPath:st.keyPath,autoIncrement:st.autoIncrement,rows:[]};
      st.openCursor().onsuccess=e=>{const c=e.target.result;if(c){meta.rows.push([c.key,c.value]);c.continue();}};
      tx.oncomplete=()=>{out.stores[sn]=meta;ok();};tx.onerror=()=>bad(tx.error);
    });
  }
  db.close();return out;
}
function restoreDB(name,d){
  return new Promise((ok,bad)=>{
    const r=indexedDB.open(name,Math.max(1,d.version||1));
    r.onupgradeneeded=e=>{const db=e.target.result;for(const sn in d.stores){if(!db.objectStoreNames.contains(sn)){const m=d.stores[sn];db.createObjectStore(sn,m.keyPath?{keyPath:m.keyPath,autoIncrement:m.autoIncrement}:{autoIncrement:m.autoIncrement});}}};
    r.onsuccess=e=>{
      const db=e.target.result,sns=Object.keys(d.stores).filter(x=>db.objectStoreNames.contains(x));
      if(!sns.length){db.close();return ok();}
      const tx=db.transaction(sns,'readwrite');
      sns.forEach(sn=>{const st=tx.objectStore(sn);d.stores[sn].rows.forEach(([k,v])=>st.keyPath?st.put(v):st.put(v,k));});
      tx.oncomplete=()=>{db.close();ok();};tx.onerror=()=>bad(tx.error);
    };
    r.onerror=()=>bad(r.error);r.onblocked=()=>bad(new Error('blocked'));
  });
}
const SYNC_STATE_KEY='__sync_state_v1',SEP='\u0001';
const lsSkip=k=>k.startsWith('__sync')||k.startsWith('sb-')||k.startsWith('ts_');
function canon(v){
  if(v===undefined)return 'null';
  if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+':'+s.length;}
async function scanLocal(){
  const m=new Map();
  for(const n of DBS){
    const d=await dumpDB(n);if(!d)continue;
    for(const sn in d.stores)for(const [k,v] of d.stores[sn].rows){
      const store='idb|'+n+'|'+sn,key=String(k);
      m.set(store+SEP+key,{store,key,v,hash:hashStr(canon(v))});
    }
  }
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);if(lsSkip(k))continue;
    const v=localStorage.getItem(k);
    m.set('ls'+SEP+k,{store:'ls',key:k,v,hash:hashStr(canon(v))});
  }
  return m;
}
async function remoteMeta(sb){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('kv').select('store,key,hash').range(from,from+999);
    if(error)throw error;
    out.push(...data);
    if(data.length<1000)break;
  }
  return out;
}
async function writeLocal(rows){
  const idb={};
  for(const r of rows){
    if(r.store==='ls'){localStorage.setItem(r.key,r.value);continue;}
    const [,db,sn]=r.store.split('|');
    idb[db]=idb[db]||{};(idb[db][sn]=idb[db][sn]||[]).push([r.key,r.value]);
  }
  for(const db in idb){
    const stores={};
    for(const sn in idb[db])stores[sn]={keyPath:null,autoIncrement:false,rows:idb[db][sn]};
    await restoreDB(db,{version:1,stores});
  }
}
async function deleteLocal(items){
  for(const it of items){
    if(it.store==='ls'){localStorage.removeItem(it.key);continue;}
    const [,db,sn]=it.store.split('|');
    const d=await openExisting(db);if(!d)continue;
    await new Promise(ok=>{
      if(!d.objectStoreNames.contains(sn)){d.close();return ok();}
      const tx=d.transaction(sn,'readwrite');tx.objectStore(sn).delete(it.key);
      tx.oncomplete=()=>{d.close();ok();};tx.onerror=()=>{d.close();ok();};
    });
  }
}
const group=items=>{const g=new Map();items.forEach(i=>{if(!g.has(i.store))g.set(i.store,[]);g.get(i.store).push(i.key);});return g;};
async function syncOnce(sb,uid,opts){
  opts=opts||{};
  const local=await scanLocal();
  let S={};try{S=JSON.parse(localStorage.getItem(SYNC_STATE_KEY)||'{}');}catch(e){}
  const firstTime=Object.keys(S).length===0;
  const R=new Map((await remoteMeta(sb)).map(r=>[r.store+SEP+r.key,{store:r.store,key:r.key,hash:r.hash}]));
  let localWinsAll=false;
  if(firstTime&&local.size&&R.size){
    const differs=[...local.keys()].some(id=>R.has(id)&&R.get(id).hash!==local.get(id).hash);
    if(differs&&opts.firstConflict)localWinsAll=!!(await opts.firstConflict());
    else if(differs)localWinsAll=true;
    if(differs&&!localWinsAll){ // lấy dữ liệu đám mây: coi như máy này chưa có gì
      for(const id of [...local.keys()])if(R.has(id))local.delete(id);
    }
  }
  const push=[],pull=[],delRemote=[],delLocal=[],newS={};
  for(const id of new Set([...local.keys(),...R.keys(),...Object.keys(S)])){
    const L=local.get(id),r=R.get(id),lh=L&&L.hash,rh=r&&r.hash,sh=S[id];
    if(lh===rh){if(lh)newS[id]=lh;continue;}
    if(L&&lh!==sh){push.push(L);newS[id]=lh;}
    else if(L){ // máy này không đổi
      if(r){pull.push(r);newS[id]=rh;}else delLocal.push(L);
    }else{ // máy này không có
      if(r&&sh===rh)delRemote.push(r);
      else if(r){pull.push(r);newS[id]=rh;}
    }
  }
  // đẩy lên
  const now=new Date().toISOString();let batch=[],size=0;
  const flush=async()=>{if(!batch.length)return;const {error}=await sb.from('kv').upsert(batch,{onConflict:'user_id,store,key'});if(error)throw error;batch=[];size=0;};
  for(const L of push){
    const row={user_id:uid,store:L.store,key:L.key,value:L.v,hash:L.hash,updated_at:now};
    const sz=JSON.stringify(row).length;
    if(batch.length&&size+sz>800000)await flush();
    batch.push(row);size+=sz;
  }
  await flush();
  // xóa trên đám mây
  for(const [store,keys] of group(delRemote))for(let i=0;i<keys.length;i+=50){
    const {error}=await sb.from('kv').delete().eq('store',store).in('key',keys.slice(i,i+50));if(error)throw error;
  }
  // kéo về
  const got=[];
  for(const [store,keys] of group(pull))for(let i=0;i<keys.length;i+=10){
    const {data,error}=await sb.from('kv').select('store,key,value').eq('store',store).in('key',keys.slice(i,i+10));
    if(error)throw error;got.push(...data);
  }
  await writeLocal(got);
  await deleteLocal(delLocal);
  localStorage.setItem(SYNC_STATE_KEY,JSON.stringify(newS));
  return {pushed:push.length,pulled:got.length,deleted:delLocal.length,removed:delRemote.length};
}

  if(!(await doSync(true))){alert('Chưa đồng bộ được nên chưa thể đăng xuất, tránh mất dữ liệu. Thử lại sau.');return;}
  Object.values(frames).forEach(f=>f.remove());
  DBS.forEach(n=>indexedDB.deleteDatabase(n));
  await sb.auth.signOut();localStorage.clear();
  setTimeout(()=>location.reload(),400);
};
boot();
</script>
